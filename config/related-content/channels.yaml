# =============================================================================
# Allowlist de canais do Conteúdo relacionado (docs/12 §3.1)
#
# O canal define a confiança do vídeo (source_tier):
#   clubs, competitions → official       (canal do clube, da confederação, da liga)
#   broadcasters        → rights_holder  (quando a emissora detém os direitos da competição no país,
#                                         pela tabela config/broadcast-rights/<iso2>.yaml); senão media
#   media               → media          (imprensa esportiva de referência)
# Além desta lista, os domínios `youtube.com/@handle` do dicionário de emissoras
# (config/broadcasters/<iso2>.yaml) entram automaticamente como `broadcasters`.
#
# Casamento por handle (snippet.customUrl do channels.list, sem caixa) ou por id do canal
# (`id: UC...`). Handle que não existe simplesmente nunca casa — confira com
# `channels.list?forHandle=<handle>` ao incluir uma entrada. A blocklist editorial do Onde
# Assistir (_policy.yaml + WTW_BLOCKLIST_FILE/WTW_BLOCKLIST) também vale aqui.
# =============================================================================
