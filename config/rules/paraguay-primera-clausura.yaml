# División Profesional de Paraguay — Torneo Clausura no id próprio da api-sports (252). 12 clubes em
# turno e returno (22 rodadas). O rebaixamento é pelos promedios (três temporadas), que só vêm do
# fornecedor. Grupos: sem amostra no repositório; qualquer grupo que não seja promedio é a tabela do
# torneio.
slug: paraguay-primera-clausura
name: División Profesional - Clausura
format: league

standings:
  points: { win: 3, draw: 1, loss: 0 }
  tie_breakers:
    - goal_difference
    - goals_for
    - h2h_points
    - drawing_of_lots

league:
  teams: 12
  matches_per_team: 22
  meetings_per_pair: 2
  title: true
  zones: []

knockout: null

tables:
  - key: clausura
    kind: phase
    name: { pt-BR: Torneio Clausura, es: Torneo Clausura, en: Clausura }
    groups: '.'
    exclude: 'promedio|anual|annual|acumulad'
    rounds: '\d+$'
    group_name: Clausura
  - key: promedios
    kind: relegation_average
    name: { pt-BR: Promedios, es: Promedios, en: Relegation averages }
    groups: 'promedio'

sources:
  - https://www.apf.org.py/
