# Primera División de Uruguay (AUF). 16 clubes: Torneo Apertura (turno único, 15 rodadas), Torneo
# Intermedio (duas séries de 8, 7 rodadas) e Torneo Clausura (turno único, 15 rodadas). A tabela anual
# soma os três (vagas continentais e final do Uruguaio); o rebaixamento é pelos promedios (só do
# fornecedor).
# api-sports: id 268. Até 2025 era "Primera División - Apertura" e o Clausura vinha à parte (id 270,
# uruguay-primera-clausura); em out/2026 o /leagues chama o 268 de "Primera División" (temporada
# inteira). Por isso a tabela anual só é recalculada a partir de 2026: antes, o 268 não tinha o Clausura.
# Rodadas e grupos: sem amostra no repositório; padrão da api-sports ("Apertura - 7", "Intermedio -
# Group A"). Revise a cada temporada.
slug: uruguay-primera
name: Primera División de Uruguay
format: league

standings:
  points: { win: 3, draw: 1, loss: 0 }
  tie_breakers:
    - goal_difference
    - goals_for
    - h2h_points
    - drawing_of_lots

league:
  teams: 16
  matches_per_team: 15
  meetings_per_pair: 1
  title: false
  zones: []

knockout:
  default: { legs: 1, extra_time: true, penalties: true }

tables:
  - key: apertura
    kind: phase
    name: { pt-BR: Torneio Apertura, es: Torneo Apertura, en: Apertura }
    groups: 'apertura'
    exclude: 'anual|annual|promedio'
    rounds: '^apertura - \d+$'
    group_name: Apertura
  - key: intermedio
    kind: phase
    name: { pt-BR: Torneio Intermedio, es: Torneo Intermedio, en: Intermedio }
    subgroup_label: { pt-BR: Série, es: Serie, en: Series }
    groups: 'intermedio'
    exclude: 'anual|annual|promedio'
    rounds: '^intermedio - \d+$'
    league:
      teams: 8
      matches_per_team: 7
  - key: clausura
    kind: phase
    name: { pt-BR: Torneio Clausura, es: Torneo Clausura, en: Clausura }
    groups: 'clausura'
    exclude: 'anual|annual|promedio'
    rounds: '^clausura - \d+$'
    group_name: Clausura
  - key: annual
    kind: annual
    name: { pt-BR: Tabela anual, es: Tabla anual, en: Annual table }
    groups: 'anual|annual'
    group_name: Tabla Anual
    computed: false
  - key: promedios
    kind: relegation_average
    name: { pt-BR: Promedios, es: Promedios, en: Relegation averages }
    groups: 'promedio'

overrides:
  # 268 com a temporada inteira: a anual soma Apertura, Intermedio e Clausura do próprio id
  - seasons: { from: 2026 }
    tables:
      - key: apertura
        kind: phase
        name: { pt-BR: Torneio Apertura, es: Torneo Apertura, en: Apertura }
        groups: 'apertura'
        exclude: 'anual|annual|promedio'
        rounds: '^apertura - \d+$'
        group_name: Apertura
      - key: intermedio
        kind: phase
        name: { pt-BR: Torneio Intermedio, es: Torneo Intermedio, en: Intermedio }
        subgroup_label: { pt-BR: Série, es: Serie, en: Series }
        groups: 'intermedio'
        exclude: 'anual|annual|promedio'
        rounds: '^intermedio - \d+$'
        league:
          teams: 8
          matches_per_team: 7
      - key: clausura
        kind: phase
        name: { pt-BR: Torneio Clausura, es: Torneo Clausura, en: Clausura }
        groups: 'clausura'
        exclude: 'anual|annual|promedio'
        rounds: '^clausura - \d+$'
        group_name: Clausura
      - key: annual
        kind: annual
        name: { pt-BR: Tabela anual, es: Tabla anual, en: Annual table }
        groups: 'anual|annual'
        group_name: Tabla Anual
      - key: promedios
        kind: relegation_average
        name: { pt-BR: Promedios, es: Promedios, en: Relegation averages }
        groups: 'promedio'

sources:
  - https://www.auf.org.uy/
