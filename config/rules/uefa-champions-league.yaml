# UEFA Champions League — fase de liga (36 clubes, 8 jogos cada) desde 2024/25.
# Desempate (Regulamento, art. 18): saldo, gols pró, gols fora, vitórias, vitórias fora,
# pontos dos adversários enfrentados, saldo dos adversários, gols pró dos adversários,
# pontos disciplinares, coeficiente UEFA (não calculado aqui → empate não resolvido).
# 1º–8º: oitavas; 9º–24º: playoffs do mata-mata; 25º–36º: eliminados.
# Mata-mata: ida e volta, sem gol fora (desde 2021/22), prorrogação e pênaltis; final em jogo único.
# A api-sports rotula a temporada pelo ano de início (2024 = 2024/25).
slug: uefa-champions-league
name: UEFA Champions League
format: league_phase

standings:
  points: { win: 3, draw: 1, loss: 0 }
  fair_play: { yellow: 1, red: 3 }
  tie_breakers:
    - goal_difference
    - goals_for
    - away_goals_for
    - wins
    - away_wins
    - opponents_points
    - opponents_goal_difference
    - opponents_goals_for
    - fair_play
    - drawing_of_lots

league:
  teams: 36
  matches_per_team: 8
  meetings_per_pair: 1
  title: false
  zones:
    - { id: round_of_16, kind: qualification, from: 1, to: 8 }
    - { id: knockout_playoff, kind: qualification, from: 9, to: 24 }
    - { id: elimination, kind: elimination, from: 25, to: 36 }

knockout:
  default: { legs: 2, away_goals: false, extra_time: true, penalties: true }
  stages:
    final: { legs: 1, extra_time: true, penalties: true, neutral_venue: true, decides_title: true }

overrides:
  # Até 2023/24: fase de grupos (8 grupos de 4) com confronto direto primeiro.
  - seasons: { to: 2023 }
    format: groups_and_knockout
    standings:
      tie_breakers:
        - h2h_points
        - h2h_goal_difference
        - h2h_goals_for
        - goal_difference
        - goals_for
        - away_goals_for
        - wins
        - away_wins
        - fair_play
        - drawing_of_lots
    league:
      teams: 4
      matches_per_team: 6
      meetings_per_pair: 2
      zones:
        - { id: round_of_16, kind: qualification, from: 1, to: 2 }
        - { id: europa_league_knockout_playoff, kind: qualification, from: 3, to: 3 }
        - { id: elimination, kind: elimination, from: 4, to: 4 }
  # Até 2020/21: gol fora no confronto direto da fase de grupos e no agregado do mata-mata,
  # inclusive na prorrogação.
  - seasons: { to: 2020 }
    standings:
      tie_breakers:
        - h2h_points
        - h2h_goal_difference
        - h2h_goals_for
        - h2h_away_goals
        - goal_difference
        - goals_for
        - away_goals_for
        - wins
        - away_wins
        - fair_play
        - drawing_of_lots
    knockout:
      default: { away_goals: true, away_goals_in_extra_time: true }
      stages:
        final: { away_goals: false, away_goals_in_extra_time: false }

sources:
  - https://documents.uefa.com/
