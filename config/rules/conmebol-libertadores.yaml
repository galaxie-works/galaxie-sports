# CONMEBOL Libertadores.
# Fase de grupos (8 grupos de 4, 6 jogos): pontos, saldo, gols pró, gols como visitante,
# menos vermelhos, menos amarelos, sorteio (sem confronto direto).
# 1º–2º: oitavas; 3º: playoffs da Sul-Americana; 4º: eliminado.
# Mata-mata: ida e volta, sem gol fora (abolido em 2022), empate no agregado vai direto aos
# pênaltis (sem prorrogação). Final em jogo único (desde 2019) com prorrogação e pênaltis.
slug: conmebol-libertadores
name: CONMEBOL Libertadores
format: groups_and_knockout

standings:
  points: { win: 3, draw: 1, loss: 0 }
  tie_breakers:
    - goal_difference
    - goals_for
    - away_goals_for
    - fewest_red_cards
    - fewest_yellow_cards
    - drawing_of_lots

league:
  teams: 4
  matches_per_team: 6
  meetings_per_pair: 2
  title: false
  zones:
    - { id: round_of_16, kind: qualification, from: 1, to: 2 }
    - { id: sudamericana_knockout_playoff, kind: qualification, from: 3, to: 3 }
    - { id: elimination, kind: elimination, from: 4, to: 4 }

knockout:
  default: { legs: 2, away_goals: false, extra_time: false, penalties: true }
  stages:
    final: { legs: 1, extra_time: true, penalties: true, neutral_venue: true, decides_title: true }

overrides:
  # Até 2021 o gol fora desempatava o agregado nos mata-matas (não na final).
  - seasons: { to: 2021 }
    knockout:
      default: { away_goals: true }
      stages:
        final: { away_goals: false }
  # Até 2018 a final era em ida e volta, sem gol fora, com prorrogação e pênaltis.
  - seasons: { to: 2018 }
    knockout:
      stages:
        final: { legs: 2, away_goals: false, extra_time: true, neutral_venue: false, decides_title: true }

sources:
  - https://www.conmebol.com/documentos/
