# Úrvalsdeild (Islândia) — 12 clubes em turno e returno (22 rodadas). Depois, a liga se divide em
# Championship Group e Relegation Group, de 6 clubes cada, com 5 rodadas e os pontos levados da fase
# regular. O fornecedor manda as três tabelas ("Urvalsdeild: Regular season", "...: Championship
# Group", "...: Relegation Group"). Recalculamos só a fase regular; as duas finais, que somam as
# fases, ficam do fornecedor até o motor suportar pontos levados (#1187).
slug: iceland-urvalsdeild-164
name: Úrvalsdeild
format: league

standings:
  points: { win: 3, draw: 1, loss: 0 }
  tie_breakers:
    - goal_difference
    - goals_for
    - wins
    - drawing_of_lots

league:
  teams: 12
  matches_per_team: 22
  meetings_per_pair: 2
  title: false
  zones: []

knockout:
  default: { legs: 1, extra_time: false, penalties: true }

tables:
  - key: regular
    kind: phase
    name: { pt-BR: Fase regular, es: Fase regular, en: Regular season }
    groups: 'regular season'
    rounds: '^regular season - \d+$'
  - key: championship
    kind: phase
    name: { pt-BR: Grupo do título, es: Grupo por el título, en: Championship group }
    groups: 'championship'
    rounds: '^championship group'
    computed: false
  - key: relegation
    kind: phase
    name: { pt-BR: Grupo do rebaixamento, es: Grupo por el descenso, en: Relegation group }
    groups: 'relegation'
    rounds: '^relegation group'
    computed: false

sources:
  - https://www.ksi.is/
