# Planos de dados do catálogo comercial (config/catalog/, plataforma comercial F1). Usados no onboarding de tenants
# (POST /internal/admin/tenants). Cada tenant copia os valores do modelo na criação e pode ter
# ajustes próprios (módulos, mercados, esportes, limites). Mudar este arquivo NÃO altera tenants
# existentes — use PATCH /internal/admin/tenants/{id} com "applyTemplate": true para reaplicar.
#
# Preço não mora aqui: o repositório é público. Preço de lista, moeda e ids do Stripe ficam no banco (billing.price).
#
# Campos:
#   name                  nome comercial exibido
#   modules               módulos de dados incluídos (lista em config/catalog/modules.yaml). Os módulos de engajamento
#                         (live_chat, communities, gamification, shopping, cosmos_ai) não entram em nenhum plano: são
#                         contratados à parte e ligados tenant a tenant (#1018).
#   markets               países ISO2 incluídos por padrão; [] = todos
#   sports                esportes incluídos por padrão (slug); [] = todos
#   rateLimitPerMinute    requisições por minuto, por rota (janela fixa no Valkey)
#   dailyRequestQuota     cota diária de requisições (todas as rotas); null = sem cota
#   defaultKeyEnv         ambiente da chave inicial: live | test
#   trialDays             plano com prazo: dias a partir do onboarding (depois nenhuma chave do tenant vale)
#   selfService           o cliente contrata sozinho, pela loja (false = só por contrato com a Galaxie)
#   tiers                 faixas dos módulos que o plano fixa (chave `modulo.faixa`, ver modules.yaml), além das
#                         que já são colunas do tenant (cota diária e limite por minuto)
#
# A cota diária vale para o uso de produção (a chave de teste fica fora): aviso a partir de 80% e
# 429 QUOTA_EXCEEDED a partir de 110%, até a virada do dia UTC (docs/politica-de-chaves.md §4).
#
# O modelo `trial` tem dois papéis (plataforma comercial F3, decisão 14 do brief; doc 02 §O trial):
#   1. plano dos tenants legados que ainda o têm (selfService: false, não ofertado; sai do código num PR próprio,
#      decisão 13);
#   2. **a tabela dos limites do teste**: com a conta no estado `trial`, `entitlements()` usa o menor entre o limite do
#      tenant e o deste modelo (rateLimitPerMinute, dailyRequestQuota), fixa as faixas listadas em `tiers` como teto
#      (core_data.sse_connections = 5) e tira a feature realtime.webhooks dos direitos. Quem muda o que o trial permite
#      muda aqui, não no código.

plans:
  # Avaliação: 30 dias, cota baixa, SSE com 5 conexões e sem webhooks. Como plano, só os tenants legados; como tabela
  # de limites, vale para toda conta em `trial` (ver cabeçalho).
  trial:
    name: Trial
    modules: [core_data]
    markets: []
    sports: []
    rateLimitPerMinute: 60
    dailyRequestQuota: 5000
    # live: a cota vale para o uso de produção (a chave de teste não conta)
    defaultKeyEnv: live
    trialDays: 30
    # sai como plano na F3: o teste passa a ser por módulo (PL1, PL3); fica até lá para os tenants que já o têm
    selfService: false
    tiers:
      # teto do teste (doc 02 §O trial): o estado `trial` não passa de 5 conexões SSE
      core_data.sse_connections: 5

  core_data:
    name: Core Data
    modules: [core_data]
    markets: []
    sports: []
    rateLimitPerMinute: 120
    dailyRequestQuota: 100000
    defaultKeyEnv: live
    selfService: true

  fan_experience:
    name: Fan Experience
    modules: [core_data, where_to_watch, semantic]
    markets: []
    sports: []
    rateLimitPerMinute: 300
    dailyRequestQuota: 500000
    defaultKeyEnv: live
    selfService: true
    tiers:
      where_to_watch.markets: 3

  live_intelligence:
    name: Live Intelligence
    modules: [core_data, where_to_watch, semantic, live_intelligence, multisport]
    markets: []
    sports: []
    rateLimitPerMinute: 600
    dailyRequestQuota: 2000000
    defaultKeyEnv: live
    selfService: true
    tiers:
      where_to_watch.markets: 8
      live_intelligence.enriched_games: 2000

  enterprise:
    name: Enterprise
    modules: [core_data, where_to_watch, semantic, live_intelligence, multisport, related_content, odds]
    markets: []
    sports: []
    rateLimitPerMinute: 3000
    dailyRequestQuota: null
    defaultKeyEnv: live
    selfService: false
    tiers:
      where_to_watch.markets: 8
