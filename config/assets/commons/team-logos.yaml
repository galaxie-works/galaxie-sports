# Logos de times sem logo do fornecedor, vindos da Wikimedia Commons.
# Consumido por: pnpm --filter @galaxie/ingestor assets:team-logos [--plan]
#
# Começou pelos construtores da F1 (id do f1db): a api-sports só tem logo das equipes recentes. Fonte de cada
# arquivo: o logo (P154) do item do Wikidata da equipe, ligado pelo verbete da Wikipédia que o Jolpica/Ergast
# publica, ou uma busca na Commons conferida à mão (nome da equipe no título do arquivo). Ficaram de fora fotos
# do logo no carro, miniaturas pequenas demais e arquivos de outra empresa com o mesmo nome.
#
# Só entram arquivos cuja licença permite uso comercial (domínio público, CC0, CC BY, CC BY-SA), conferida no
# extmetadata da Commons a cada execução; o crédito vai para core.asset_credit e sai na API com o logo
# (`logo_credit`). Time com logo do fornecedor nunca é tocado. Marca registrada: a licença cobre o direito
# autoral do arquivo, não a marca; uso editorial (identificar a equipe), nada de sugestão de endosso.
