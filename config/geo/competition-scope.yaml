# =============================================================================
# Galaxie Sports - escopo das competições internacionais na navegação por país.
# Consumido pela API (/v1/countries/{code}/competitions); validado por packages/geo.
#
# Uma competição aparece na página de um país quando:
#   - é DOMÉSTICA: core.competition.country_code = país (não precisa estar aqui); ou
#   - está listada abaixo e o país participa dela (membro de uma das `confederations`
#     ou listado em `countries`).
#
# CAMPOS (por esporte, em `sports.<slug>.competitions`, na ordem de exibição dentro do grupo)
#   slug            - slug da competição em config/competitions/<esporte>.yaml. Competições fora do
#                     catálogo (tier 3, slug gerado pelo bootstrap) exigem `api_sports_id`, que é o
#                     critério de casamento (core.provider_map), estável mesmo se o nome mudar.
#   scope           - continental_clubs (copas continentais de clubes), national_teams (seleções)
#                     ou world_clubs (mundiais de clubes). `domestic` vem do país da competição.
#   confederations  - confederações participantes (config/geo/confederations.yaml). FIFA = global
#                     (todos os países). Nos outros esportes o código indica o bloco continental
#                     equivalente (CONMEBOL = América do Sul, CONCACAF = Américas do Norte/Central
#                     e Caribe, UEFA = Europa).
#   countries       - países participantes além (ou em vez) das confederações: convidados
#                     (Copa América) ou recortes (Leagues Cup = México e EUA).
#   featured        - domésticas em destaque: vêm primeiro no grupo do país (dentro do mesmo tier),
#                     nesta ordem (ex.: Brasileirão e Copa do Brasil antes dos estaduais).
#   excluded        - competições internacionais do catálogo que NÃO entram na navegação por país
#                     (amistosos de clubes, F1 e MMA, que não têm recorte por país). O teste exige
#                     que toda competição internacional do catálogo esteja mapeada ou excluída.
# =============================================================================
schema_version: 1

