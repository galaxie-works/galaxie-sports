# =============================================================================
# Galaxie Sports - geografia do futebol: confederações, países e navegação.
# Consumido por:
#   pnpm --filter @galaxie/ingestor geo:seed     (preenche core.country.confederation,
#                                                 ioc_code e nomes pt-BR/es; idempotente)
#   API /v1/countries/{code}, /v1/countries/{code}/competitions e /v1/navigation
# Validado por packages/geo (Zod + testes unitários).
#
# CAMPOS
#   confederations[].code     - código da confederação (CONMEBOL, CONCACAF, UEFA, AFC, CAF, OFC).
#                               "FIFA" é reservado para competições globais (config/geo/competition-scope.yaml).
#   confederations[].members  - países membros da FIFA por confederação. `code` é o código de país
#                               da api-sports (ISO 3166-1 alpha-2, com as extensões GB-ENG, GB-SCT,
#                               GB-WLS e GB-NIR e XK para Kosovo); `ioc` é o código do COI (quando o
#                               membro tem comitê olímpico próprio); `name` traz en, pt-BR e es (a API
#                               segue a cadeia es-XX -> es -> en e pt-BR -> pt -> en).
#   regions                   - pseudo-países de região usados pelos catálogos dos outros esportes
#                               (country "South-America" -> código SOUTH-AMERICA) e o bloco
#                               continental equivalente.
#   markets                   - mercados ativos (ISO2): a API calcula a relevância por país de cada jogo
#                               nesses mercados (`relevance_by_market` no detalhe do evento, docs/06 §3.2),
#                               somados aos mercados dos planos dos tenants.
#   navigation.countries      - países da navegação da demo, na ordem do menu.
#   navigation.sports         - os 12 esportes na ordem do menu, com nome localizado (fallback quando
#                               o banco ainda não tem core.sport).
# Fontes: estatutos e listas de associações-membro da FIFA e das seis confederações (conferência
# manual em out/2026); nomes pt-BR/es alinhados com a base de CONs (services/ingestor multisport).
# =============================================================================
schema_version: 1

markets: [BR, AR, UY, CL, CO, PY, PE, EC, BO, VE, MX]

navigation:
  countries: [BR, AR, BO, CL, CO, EC, PY, PE, UY, VE, MX, GB-ENG, ES, IT, DE, FR, PT]
  sports:
    - { slug: football, name: { en: Football, pt-BR: Futebol, es: Fútbol } }
    - { slug: basketball, name: { en: Basketball, pt-BR: Basquete, es: Básquetbol } }
    - { slug: volleyball, name: { en: Volleyball, pt-BR: Vôlei, es: Vóleibol } }
    - { slug: formula-1, name: { en: Formula 1, pt-BR: Fórmula 1, es: Fórmula 1 } }
    - { slug: mma, name: { en: MMA, pt-BR: MMA, es: MMA } }
    - { slug: nba, name: { en: NBA, pt-BR: NBA, es: NBA } }
    - { slug: american-football, name: { en: American football, pt-BR: Futebol americano, es: Fútbol americano } }
    - { slug: baseball, name: { en: Baseball, pt-BR: Beisebol, es: Béisbol } }
    - { slug: hockey, name: { en: Hockey, pt-BR: Hóquei, es: Hockey } }
    - { slug: handball, name: { en: Handball, pt-BR: Handebol, es: Balonmano } }
    - { slug: rugby, name: { en: Rugby, pt-BR: Rúgbi, es: Rugby } }
    - { slug: afl, name: { en: AFL, pt-BR: Futebol australiano, es: Fútbol australiano } }

regions:
  SOUTH-AMERICA: CONMEBOL
  NORTH-CENTRAL-AMERICA: CONCACAF
  EUROPE: UEFA
  ASIA: AFC
  AFRICA: CAF
  OCEANIA: OFC

