# =============================================================================
# Galaxie Sports - catálogo de competições: rúgbi (v1.rugby.api-sports.io)
# Mesmo schema de config/competitions/football.yaml. Consumido por
#   pnpm --filter @galaxie/ingestor bootstrap:sports rugby
#
# TIERS (prioridade latino-americana, docs/03 §6)
#   tier 1 - competições prioritárias: temporadas inteiras no bootstrap (--jogos) e live.
#   tier 2 - espelhadas com tratamento leve; histórico conforme a cota.
#   tier 3 - todo o resto do /leagues entra automaticamente (sem precisar estar aqui).
#
# CAMPOS
#   name / country / type - exatamente como a API devolve (league.name, country.name,
#                           type em minúsculas); a conferência do bootstrap aponta diferenças.
#   api_sports_id         - ID da liga nesta API (o mesmo número pode existir em outra API;
#                           o mapeamento em core.provider_map é sempre por esporte).
#   verify                - false = ID e nome conferidos no /leagues capturado (snapshot 2025/2026,
#                           ver docs/research/api-sports-outros-esportes.md); confirme na primeira execução autenticada.
#   seasons_strategy      - calendar-year (2026 = 2026) ou split-year (2026 = 2026/27).
# Super Rugby Americas e ligas do Uruguai, Chile e Brasil não aparecem no snapshot; resolver com /leagues?search=.
# =============================================================================
schema_version: 1
sport: rugby
competitions:

