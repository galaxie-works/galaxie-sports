# =============================================================================
# Galaxie Sports - catálogo de competições: rúgbi (v1.rugby.api-sports.io)
# Mesmo schema de config/competitions/football.yaml. Consumido por
#   pnpm --filter @galaxie/ingestor bootstrap:sports rugby
#
# TIERS (prioridade latino-americana, docs/03 §6; no rúgbi, a Argentina primeiro)
#   tier 1 - competições prioritárias: temporadas inteiras no bootstrap (--jogos) e live.
#   tier 2 - espelhadas com tratamento leve; histórico conforme a cota (--jogos --tier 2).
#   tier 3 - todo o resto do /leagues entra automaticamente (sem precisar estar aqui).
#
# CAMPOS
#   name / country / type - exatamente como a API devolve (league.name, country.name,
#                           type em minúsculas); a conferência do bootstrap aponta diferenças.
#   provider_country      - quando o país do fornecedor está errado: se o /leagues devolver este país,
#                           vale o `country` daqui (a Súper Rugby Américas vem como "South-Africa").
#   api_sports_id         - ID da liga nesta API (o mesmo número pode existir em outra API;
#                           o mapeamento em core.provider_map é sempre por esporte).
#   verify                - false = ID e nome conferidos no /leagues (primeiro bootstrap autenticado, 23/10/2026).
#   seasons_strategy      - calendar-year (2024 = 2024), split-year (2024 = 2024/25: ligas europeias,
#                           Champions Cup e Challenge Cup começam em setembro/dezembro e terminam em junho) ou
#                           tournament-year (rótulo = ano em que termina: a Copa do Mundo "2023" começa em
#                           nov/2022 no fornecedor e sairia "2023/24").
# No free (2022–2024) as seleções têm a última edição dentro da janela: Copa do Mundo 2023, Copa do Mundo
# feminina 2022, Pan-Americano de 7 2023. O Circuito Mundial de 7 (SVNS) é uma competição por etapa; a
# chave "2024" de Dubai e da Cidade do Cabo já é a etapa de nov./dez. de 2024 (temporada 2024/25).
# Ligas do Uruguai, Chile e Brasil não existem no /leagues; a Súper Rugby Américas é o "Super Liga Americana".
# =============================================================================
