# =============================================================================
# Galaxie Sports - catálogo de competições: Fórmula 1 (v1.formula-1.api-sports.io)
# Mesmo schema de config/competitions/football.yaml. Consumido por
#   pnpm --filter @galaxie/ingestor bootstrap:sports formula-1
#
# TIERS (prioridade latino-americana, docs/03 §6)
#   tier 1 - competições prioritárias: temporadas inteiras no bootstrap (--jogos) e live.
#   tier 2 - espelhadas com tratamento leve; histórico conforme a cota.
#   tier 3 - todo o resto do /leagues entra automaticamente (sem precisar estar aqui).
#
# CAMPOS
#   name / country / type - exatamente como a API devolve (league.name, country.name,
#                           type em minúsculas); a conferência do bootstrap aponta diferenças.
#   api_sports_id         - ID da liga nesta API (o mesmo número pode existir em outra API;
#                           o mapeamento em core.provider_map é sempre por esporte).
#   verify                - false = ID e nome conferidos no /leagues capturado (snapshot 2025/2026,
#                           ver docs/research/api-sports-outros-esportes.md); confirme na primeira execução autenticada.
#   seasons_strategy      - calendar-year (2026 = 2026) ou split-year (2026 = 2026/27).
# A API não tem entidade "campeonato": /competitions lista os Grandes Prêmios. O bootstrap cria uma
# competição sintética (api_sports_id: world-championship) com uma temporada por ano de /seasons;
# os GPs viram etapas (stage) quando as corridas (races?season) forem normalizadas.
# Construtores (/teams) entram como participantes e circuitos (/circuits) como locais, com imagens no Asset Mirror.
# =============================================================================
schema_version: 1
sport: formula-1
competitions:

  # ---------------------------------------------------------------- tier 1
  - slug: formula-1-world-championship
    name: "Formula 1 World Championship"
    country: "World"
    type: league
    api_sports_id: world-championship
    verify: false
    tier: 1
    region: world
    seasons_strategy: calendar-year
    live_priority: high
    labels: { pt-BR: "Campeonato Mundial de Fórmula 1", es: "Campeonato Mundial de Fórmula 1", en: "Formula 1 World Championship" }
    sources: ["docs/research/api-sports-outros-esportes.md"]

notes:
  - "GP de São Paulo e GP da Cidade do México: IDs a resolver com /competitions?search= (os nomes ficam no raw do /competitions)."
