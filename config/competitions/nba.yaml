# =============================================================================
# Galaxie Sports - catálogo de competições: NBA (v2.nba.api-sports.io)
# Mesmo schema de config/competitions/football.yaml. Consumido por
#   pnpm --filter @galaxie/ingestor bootstrap:sports nba
#
# TIERS (prioridade latino-americana, docs/03 §6)
#   tier 1 - competições prioritárias: temporadas inteiras no bootstrap (--jogos) e live.
#   tier 2 - espelhadas com tratamento leve; histórico conforme a cota.
#   tier 3 - todo o resto do /leagues entra automaticamente (sem precisar estar aqui).
#
# CAMPOS
#   name / country / type - exatamente como a API devolve (league.name, country.name,
#                           type em minúsculas); a conferência do bootstrap aponta diferenças.
#   api_sports_id         - ID da liga nesta API (o mesmo número pode existir em outra API;
#                           o mapeamento em core.provider_map é sempre por esporte).
#   verify                - false = ID e nome conferidos no /leagues capturado (snapshot 2025/2026,
#                           ver docs/research/api-sports-outros-esportes.md); confirme na primeira execução autenticada.
#   seasons_strategy      - calendar-year (2026 = 2026) ou split-year (2026 = 2026/27).
# Na NBA v2 as ligas são texto (/leagues: standard, vegas, utah, sacramento, orlando, africa) e
# as temporadas vêm só de /seasons (2024 = 2024/25). Logos dos times apontam para a Wikimedia
# (licença própria) e não entram no Asset Mirror.
# =============================================================================
schema_version: 1
sport: nba
competitions:

  # ---------------------------------------------------------------- tier 1
  - slug: nba
    name: "NBA"
    country: "USA"
    type: league
    api_sports_id: standard
    verify: false
    tier: 1
    region: north-america
    seasons_strategy: split-year
    live_priority: high
    labels: { pt-BR: "NBA", es: "NBA", en: "NBA" }
    sources: ["docs/research/api-sports-outros-esportes.md"]

  # ---------------------------------------------------------------- tier 3
  - slug: nba-summer-league-las-vegas
    name: "NBA Summer League Las Vegas"
    country: "USA"
    type: league
    api_sports_id: vegas
    verify: false
    tier: 3
    region: north-america
    seasons_strategy: calendar-year
    live_priority: none
    sources: ["docs/research/api-sports-outros-esportes.md"]
  - slug: nba-summer-league-utah
    name: "NBA Summer League Utah"
    country: "USA"
    type: league
    api_sports_id: utah
    verify: false
    tier: 3
    region: north-america
    seasons_strategy: calendar-year
    live_priority: none
    sources: ["docs/research/api-sports-outros-esportes.md"]
  - slug: nba-summer-league-sacramento
    name: "NBA Summer League Sacramento"
    country: "USA"
    type: league
    api_sports_id: sacramento
    verify: false
    tier: 3
    region: north-america
    seasons_strategy: calendar-year
    live_priority: none
    sources: ["docs/research/api-sports-outros-esportes.md"]
  - slug: nba-summer-league-orlando
    name: "NBA Summer League Orlando"
    country: "USA"
    type: league
    api_sports_id: orlando
    verify: false
    tier: 3
    region: north-america
    seasons_strategy: calendar-year
    live_priority: none
    sources: ["docs/research/api-sports-outros-esportes.md"]
  - slug: nba-africa-game
    name: "NBA Africa Game"
    country: "USA"
    type: league
    api_sports_id: africa
    verify: false
    tier: 3
    region: africa
    seasons_strategy: calendar-year
    live_priority: none
    sources: ["docs/research/api-sports-outros-esportes.md"]
