# =============================================================================
# Galaxie Sports - catálogo de competições: hóquei no gelo (v1.hockey.api-sports.io)
# Mesmo schema de config/competitions/football.yaml. Consumido por
#   pnpm --filter @galaxie/ingestor bootstrap:sports hockey
#
# TIERS (prioridade latino-americana, docs/03 §6; no hóquei, NHL e seleções primeiro)
#   tier 1 - competições prioritárias: temporadas inteiras no bootstrap (--jogos) e live.
#   tier 2 - espelhadas com tratamento leve; histórico conforme a cota (--jogos --tier 2).
#   tier 3 - todo o resto do /leagues entra automaticamente (sem precisar estar aqui).
#
# CAMPOS
#   name / country / type - exatamente como a API devolve (league.name, country.name,
#                           type em minúsculas); a conferência do bootstrap aponta diferenças.
#   api_sports_id         - ID da liga nesta API (o mesmo número pode existir em outra API;
#                           o mapeamento em core.provider_map é sempre por esporte).
#   verify                - false = ID e nome conferidos no /leagues (primeiro bootstrap autenticado, 23/10/2026).
#   seasons_strategy      - calendar-year (2024 = 2024), split-year (2024 = 2024/25: NHL e ligas europeias
#                           começam em setembro/outubro e terminam em abril/junho) ou tournament-year
#                           (rótulo = ano em que termina: o torneio olímpico "2022" começa nas eliminatórias
#                           de nov/2019 e o Mundial Sub-20 "2024" começa em dez/2023).
# No free (2022–2024) cada competição entra com a temporada mais recente da janela: 2024/25 nas ligas,
# 2024 nos Mundiais e nos torneios do Euro Hockey Tour e 2022 (Pequim) nos Jogos Olímpicos de Inverno.
# Não há ligas latino-americanas no /leagues; o interesse vem da NHL, dos Olímpicos e dos Mundiais.
# =============================================================================
