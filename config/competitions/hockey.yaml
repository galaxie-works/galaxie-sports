# =============================================================================
# Galaxie Sports - catálogo de competições: hóquei no gelo (v1.hockey.api-sports.io)
# Mesmo schema de config/competitions/football.yaml. Consumido por
#   pnpm --filter @galaxie/ingestor bootstrap:sports hockey
#
# TIERS (prioridade latino-americana, docs/03 §6)
#   tier 1 - competições prioritárias: temporadas inteiras no bootstrap (--jogos) e live.
#   tier 2 - espelhadas com tratamento leve; histórico conforme a cota.
#   tier 3 - todo o resto do /leagues entra automaticamente (sem precisar estar aqui).
#
# CAMPOS
#   name / country / type - exatamente como a API devolve (league.name, country.name,
#                           type em minúsculas); a conferência do bootstrap aponta diferenças.
#   api_sports_id         - ID da liga nesta API (o mesmo número pode existir em outra API;
#                           o mapeamento em core.provider_map é sempre por esporte).
#   verify                - false = ID e nome conferidos no /leagues capturado (snapshot 2025/2026,
#                           ver docs/research/api-sports-outros-esportes.md); confirme na primeira execução autenticada.
#   seasons_strategy      - calendar-year (2026 = 2026) ou split-year (2026 = 2026/27).
# Sem ligas latino-americanas; interesse vem dos Jogos Olímpicos de Inverno.
# Há relato de que games?date sem season é recusado: se confirmado, no free só há histórico.
# =============================================================================
schema_version: 1
sport: hockey
competitions:

  # ---------------------------------------------------------------- tier 1
  - slug: olympics-ice-hockey
    name: "Olympic Games"
    country: "World"
    type: cup
    api_sports_id: 131
    verify: false
    tier: 1
    region: world
    seasons_strategy: calendar-year
    live_priority: medium
    labels: { pt-BR: "Hóquei no gelo masculino — Jogos Olímpicos de Inverno", es: "Hockey sobre hielo masculino — Juegos Olímpicos de Invierno" }
    sources: ["docs/research/api-sports-outros-esportes.md"]
  - slug: olympics-ice-hockey-women
    name: "Olympic Games Women"
    country: "World"
    type: cup
    api_sports_id: 151
    verify: false
    tier: 1
    region: world
    seasons_strategy: calendar-year
    live_priority: medium
    labels: { pt-BR: "Hóquei no gelo feminino — Jogos Olímpicos de Inverno", es: "Hockey sobre hielo femenino — Juegos Olímpicos de Invierno" }
    sources: ["docs/research/api-sports-outros-esportes.md"]

  # ---------------------------------------------------------------- tier 2
  - slug: nhl
    name: "NHL"
    country: "USA"
    type: league
    api_sports_id: 57
    verify: false
    tier: 2
    region: north-america
    seasons_strategy: split-year
    live_priority: low
    labels: { en: "National Hockey League" }
    sources: ["docs/research/api-sports-outros-esportes.md"]
