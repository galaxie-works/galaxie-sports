# =============================================================================
# Galaxie Sports - football competition catalog (API-FOOTBALL v3 / api-sports.io)
# Generated 2026-10-21. Consumed by the mirror bootstrap.
#
# TIERS
#   tier 1 - live AI coverage + full history backfill (all seasons api-sports has).
#            Brazilian national + state top flights, CONMEBOL club cups, the main
#            South American / Mexican leagues, Europe's big five + UEFA club cups,
#            FIFA / CONMEBOL / CONCACAF / UEFA national-team tournaments, Olympics.
#   tier 2 - mirrored (fixtures, results, standings, lineups/events where covered)
#            with lighter live treatment; history backfill may be limited to the
#            last N seasons by the bootstrap config.
#
# FIELDS
#   name / country / type  - exactly as api-sports returns them (league.name,
#                            country.name, league.type lower-cased). Used only for
#                            the bootstrap fallback match when api_sports_id is null.
#   api_sports_id          - API-FOOTBALL v3 league id. verify:false means the id was
#                            confirmed by at least two independent public sources
#                            (league dumps of GET /leagues committed to GitHub) and by
#                            a visual check of media.api-sports.io/football/leagues/<id>.png
#                            (all 76 checked; only 475 shows a wrong crest, see notes).
#                            verify:true + null id => resolve at bootstrap via
#                            GET /leagues?country=<country> matching name+country+type.
#   seasons_strategy       - how api-sports labels seasons: calendar-year (2026 = 2026)
#                            or split-year (2026 = 2026/27). For national-team
#                            tournaments the label is the edition year.
#   live_priority          - polling priority for live fixtures (high|medium|low|none).
#   sources                - where the id was verified.
#
# Source key (dumps of GET /leagues / fixtures):
#   https://github.com/ductd26100/avatar-remake/blob/main/src/main/java/avatar/football/League.java
#   https://github.com/zkoprek/diplomski-server/blob/master/Leagues_data
#   https://github.com/davidhuertabeltran/football-scores/blob/master/src/lib/league-list-clean.js
#   https://github.com/jonas556440/scout-dados-cartola/tree/main/data/fixtures  (2026 fixtures, Brazilian ids)
# =============================================================================
