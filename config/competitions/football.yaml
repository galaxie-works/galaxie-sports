notes:
  - "Ids are stable across seasons in api-sports; names are not (sponsor/rebrand changes). The bootstrap must key on api_sports_id and only use name+country+type for entries with verify:true. Log (do not fail) when the returned name differs from the catalog name."
  - "Argentina: the format changes almost every year. 2020-2024 used Liga Profesional (id 128) plus a separate Copa de la Liga Profesional (id 1032). From 2025 the season is Apertura + Clausura (zones + playoffs) and no separate Copa de la Liga is played; both tournaments are expected under id 128 with the tournament in the round name, and id 1032 should have no new seasons (mirrored for history only). Copa Argentina (130) is unaffected. Verify the 2026 round naming at bootstrap via GET /fixtures/rounds?league=128&season=2026."
  - "Apertura/Clausura representation differs per country: Uruguay (268 Apertura, 270 Clausura) and Paraguay (250 Apertura, 252 Clausura) have separate league ids per tournament; the Uruguayan Intermedio and the annual aggregate table are not separate ids in the sources. Liga MX (262), Colombia Primera A (239), Peru (281), Ecuador LigaPro (242) and Chile (265) use a single id per season with phases split through round names (e.g. 'Apertura - 1', 'Clausura - 3', 'Torneo Apertura', 'Second Stage') and sometimes multiple standings groups. Derive the phase from fixture.league.round / standings group names, never assume one table per season."
  - "Liga MX and Liga MX Femenil are split-year in api-sports: season 2026 = Apertura 2026 + Clausura 2027, even though the competition is played in two calendar years."
  - "Brazilian state championships (ids 475, 624, 629, 477, 606, 602, 622, 609, 628, 604) are all typed 'League' in api-sports and confirmed with 2026 fixtures. Expect coverage depth below the national leagues: fixtures/results/standings are the baseline, while lineups, events, player statistics and odds can be partial, late or absent (often depending on the season and on whether big clubs are involved) - not verified per season here. Check per-season coverage flags (GET /leagues?id=<id>&season=<y> -> seasons[].coverage) before promising AI live features."
  - "The api-sports logo for Paulista - A1 (leagues/475.png) currently shows a club crest (Paulista FC, Jundiaí) instead of the FPF championship mark. The id itself is confirmed by text sources and 2026 fixtures; do not use that logo in the product."
  - "Renamed competitions whose api-sports name may lag or have changed: 848 (UEFA Europa Conference League -> UEFA Conference League), 16 (CONCACAF Champions League -> CONCACAF Champions Cup), 281 Peru (Primera División vs 'Liga 1' branding). Ids are confirmed; names are what the sources returned."
  - "National-team tournaments (World Cup, qualifiers, Copa America, Euro, Olympics, youth World Cups) are labelled by edition year in api-sports, e.g. World Cup qualification CONMEBOL season 2026 contains matches from 2023-2025. The next cycle (2030) will appear as a new season on the same ids."
  - "FIFA Club World Cup (15) appears with type 'League' in some api-sports dumps; the new 32-team format (2025) and the annual FIFA Intercontinental Cup (separate id, not mirrored here) should not be confused."
  - "CONCACAF Nations League (536) was added because the scope said only 'Nations League'; remove it if only the UEFA competition was intended."
  - "Pan American Games (1045) is a single id in the sources; confirm at bootstrap whether women's tournament fixtures share the id or need a separate one."
  - "Friendlies (10) and Friendlies Clubs (667) are very high-volume; mirror them with filters (teams of interest) rather than full backfill."
  - "The api-football.com documentation and dashboard pages block automated fetching (HTTP 403); ids were therefore verified from public GitHub dumps of the API responses plus the media.api-sports.io logos. Re-check all ids against GET /leagues on the first authenticated bootstrap run."
