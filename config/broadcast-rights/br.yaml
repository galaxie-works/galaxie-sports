# =============================================================================
# Tabela de direitos — Brasil (BR): competição × temporada → quem PODE transmitir
#
# É o "prior" do agente Onde Assistir (docs/07 §2.2): o agente parte daqui e confirma
# jogo a jogo. No validador, opção de um detentor (`holders`) ganha +0,1; opção de quem
# não aparece em `holders` nem em `uncertain_holders` perde 0,2 (rights_mismatch).
# `uncertain_holders` = marcados [incerto] na pesquisa: nem bônus, nem penalidade.
#
# season: rótulo da api-sports (ano de início). valid_from/valid_to delimitam o ciclo e
# são o que o validador usa (data do jogo). per_round_selection: a emissora escolhe o
# jogo por rodada → fonte com mais de 72 h perde 0,3.
# broadcaster: id do dicionário config/broadcasters/br.yaml.
#
# Fonte: docs/research/onde-assistir.md §2.1 (pesquisa de 2026-10-21) — os links de
# cada linha são os anúncios/reportagens citados lá. Operadoras de TV paga omitidas por
# política editorial não aparecem aqui.
# =============================================================================
schema_version: 1
country: BR
updated_at: 2026-10-21
