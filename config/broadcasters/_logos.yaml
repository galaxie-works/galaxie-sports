# =============================================================================
# Logos da biblioteca de emissoras (enrich.broadcaster) — por id do dicionário.
#
# Só entram logos com origem verificável: arquivo da Wikimedia Commons ligado à emissora pelo
# Wikidata (propriedade "logo"), conferido pelo site oficial (P856) ou pela marca no país.
# `url` é o arquivo (PNG; SVG vira a miniatura PNG da própria Commons) que o Asset Mirror do
# ingestor espelha no nosso storage; `source_page` é a página do arquivo; `license` é a licença
# informada pela Commons. Uso nominativo: o logo só identifica a emissora/plataforma ao lado da
# opção de transmissão — marcas registradas continuam dos titulares.
#
# Emissora sem logo verificável fica de fora (sem logo na API) — nada de logo inventado.
# Pesquisa de 2026-10-22.
# =============================================================================
