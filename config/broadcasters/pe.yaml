# =============================================================================
# Dicionário de emissoras e plataformas — Peru (PE)
# Formato e regras: ver config/broadcasters/br.yaml.
# Fonte do panorama: docs/research/onde-assistir.md §2.2–2.3 (revisado em 2026-10-21).
# Operadoras de TV paga não são nomeadas por política editorial (ver _policy.yaml).
# =============================================================================
schema_version: 1
country: PE
language: es-PE
updated_at: 2026-10-25
broadcasters:
  - id: america_tv
    name: América TV
    aliases: ['America TV', 'América Televisión', 'América tvGO', 'Canal 4']
    medium: free_tv
    access_model: free
    domains: [americatv.com.pe]
  - id: espn
    name: ESPN
    # Fora do Brasil e da Argentina, a Disney renomeou os Fox Sports 2 e 3 para ESPN 6 e 7 em
    # fevereiro de 2024: o nome antigo numa grade é o canal novo (não conta duas vezes; antes da data,
    # não casa). Na Argentina a Fox Sports segue existindo (ar.yaml).
    aliases:
      - 'ESPN Perú'
      - 'ESPN Peru'
      - { name: 'Fox Sports 2', channel: 'ESPN 6', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 2 HD', channel: 'ESPN 6', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 3', channel: 'ESPN 7', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 3 HD', channel: 'ESPN 7', valid_from: 2024-02-01 }
    channels: ['ESPN 2', 'ESPN 3', 'ESPN 4', 'ESPN 6', 'ESPN 7']
    medium: pay_tv
    access_model: subscription
    group: disney
    domains: [espn.com.pe]
  # Saiu das grades em 01/01/2026: fica no dicionário só para a pesquisa recusar o canal extinto
  # (sem a entrada, ele cairia em "fora da biblioteca" e voltaria para a curadoria).
  - id: golperu
    name: GolPerú
    aliases: ['GolPeru', 'Gol Perú', 'Gol Peru', 'GOLPERU']
    medium: pay_tv
    access_model: subscription
    domains: [golperu.com.pe]
    valid_to: 2025-12-31
  # Canal oficial da Liga 1 (1190 Sports): todos os jogos da Liga 1 a partir de 2026, na TV paga e no
  # streaming próprio (l1max.com).
  - id: l1_max
    name: L1 MAX
    aliases: ['L1MAX', 'L1 Max', 'Liga 1 MAX', 'Liga 1 Max']
    medium: pay_tv
    access_model: subscription
    domains: [l1max.com]
  - id: disney_plus
    name: Disney+
    aliases: ['Disney Plus', 'Disney+ Premium']
    medium: streaming_svod
    access_model: subscription
    group: disney
    domains: [disneyplus.com]
  - id: paramount_plus
    name: Paramount+
    aliases: ['Paramount Plus']
    medium: streaming_svod
    access_model: subscription
    domains: [paramountplus.com]
  # Acervo oficial de logos (2026-10-23): emissoras do acervo com país e site oficial conferidos.
  - id: latina
    name: Latina
    aliases: ['Latina Televisión', 'Latina TV']
    medium: free_tv
    access_model: free
    domains: [latina.pe]
  - id: atv
    name: ATV
    aliases: ['ATV Perú', 'Andina de Televisión']
    medium: free_tv
    access_model: free
    domains: [atv.pe]
  - id: panamericana
    name: Panamericana
    aliases: ['Panamericana Televisión', 'Panamericana TV']
    medium: free_tv
    access_model: free
    domains: [panamericana.pe]
  - id: tv_peru
    name: TV Perú
    aliases: ['TV Peru', 'TVPerú', 'Canal 7 Perú']
    medium: free_tv
    access_model: free
    domains: [tvperu.gob.pe]
sources:
  organizers: [liga1.pe, fpf.org.pe]
  press:
    - larepublica.pe
    - libero.pe
    - elcomercio.pe
    - depor.com
    - gestion.pe
    - expreso.com.pe
