# =============================================================================
# Dicionário de emissoras e plataformas — Colômbia (CO)
# Formato e regras: ver config/broadcasters/br.yaml.
# Fonte do panorama: docs/research/onde-assistir.md §2.2–2.3 (revisado em 2026-10-21).
# Operadoras de TV paga não são nomeadas por política editorial (ver _policy.yaml).
# =============================================================================
schema_version: 1
country: CO
language: es-CO
updated_at: 2026-10-21
broadcasters:
  - id: caracol
    name: Caracol TV
    aliases: ['Caracol', 'Caracol Televisión', 'Gol Caracol']
    medium: free_tv
    access_model: free
    domains: [caracoltv.com, golcaracol.com]
  - id: rcn
    name: Canal RCN
    aliases: ['RCN', 'RCN Televisión']
    medium: free_tv
    access_model: free
    domains: [canalrcn.com]
  - id: win_sports
    name: Win Sports
    aliases: ['Win Sports+', 'Win+', 'Win Sports Plus']
    medium: pay_tv
    access_model: subscription
    domains: [winsports.co]
  - id: espn
    name: ESPN
    aliases: ['ESPN Colombia']
    channels: ['ESPN 2', 'ESPN 3', 'ESPN 4']
    medium: pay_tv
    access_model: subscription
    group: disney
    domains: [espn.com.co]
  - id: disney_plus
    name: Disney+
    aliases: ['Disney Plus', 'Disney+ Premium']
    medium: streaming_svod
    access_model: subscription
    group: disney
    domains: [disneyplus.com]
  - id: paramount_plus
    name: Paramount+
    aliases: ['Paramount Plus']
    medium: streaming_svod
    access_model: subscription
    domains: [paramountplus.com]
  # Acervo oficial de logos (2026-10-23): emissoras do acervo com país e site oficial conferidos.
  - id: senal_colombia
    name: Señal Colombia
    aliases: ['Senal Colombia', 'Señal Colombia TV']
    medium: free_tv
    access_model: free
    domains: [senalcolombia.tv]
sources:
  organizers: [dimayor.com.co, fcf.com.co]
  press:
    - eltiempo.com
    - elespectador.com
    - publimetro.co
    - semana.com
    - futbolred.com
    - canaltrece.com.co
