# =============================================================================
# Dicionário de emissoras e plataformas — Chile (CL)
# Formato e regras: ver config/broadcasters/br.yaml.
# Fonte do panorama: docs/research/onde-assistir.md §2.2–2.3 (revisado em 2026-10-21).
# Operadoras de TV paga não são nomeadas por política editorial (ver _policy.yaml).
# =============================================================================
schema_version: 1
country: CL
language: es-CL
updated_at: 2026-10-21
broadcasters:
  - id: chilevision
    name: Chilevisión
    aliases: ['CHV', 'Chilevision']
    medium: free_tv
    access_model: free
    domains: [chilevision.cl]
  - id: tnt_sports
    name: TNT Sports
    aliases: ['TNT Sports Chile', 'TNT Sports Premium']
    medium: pay_tv
    access_model: subscription
    group: wbd
    domains: [tntsports.cl]
  - id: espn
    name: ESPN
    # Fora do Brasil e da Argentina, a Disney renomeou os Fox Sports 2 e 3 para ESPN 6 e 7 em
    # fevereiro de 2024: o nome antigo numa grade é o canal novo (não conta duas vezes; antes da data,
    # não casa). Na Argentina a Fox Sports segue existindo (ar.yaml).
    aliases:
      - 'ESPN Chile'
      - { name: 'Fox Sports 2', channel: 'ESPN 6', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 2 HD', channel: 'ESPN 6', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 3', channel: 'ESPN 7', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 3 HD', channel: 'ESPN 7', valid_from: 2024-02-01 }
      # No Chile, o Fox Sports (1) virou ESPN 4 em 2021.
      - { name: 'Fox Sports', channel: 'ESPN 4', valid_from: 2021-01-01 }
      - { name: 'Fox Sports 1', channel: 'ESPN 4', valid_from: 2021-01-01 }
      - { name: 'Fox Sports Chile', channel: 'ESPN 4', valid_from: 2021-01-01 }
    channels: ['ESPN 2', 'ESPN 3', 'ESPN 4', 'ESPN 6', 'ESPN 7']
    medium: pay_tv
    access_model: subscription
    group: disney
    domains: [espn.cl]
  - id: disney_plus
    name: Disney+
    aliases: ['Disney Plus', 'Disney+ Premium']
    medium: streaming_svod
    access_model: subscription
    group: disney
    domains: [disneyplus.com]
  - id: paramount_plus
    name: Paramount+
    aliases: ['Paramount Plus']
    medium: streaming_svod
    access_model: subscription
    domains: [paramountplus.com]
  # Acervo oficial de logos (2026-10-23): emissoras do acervo com país e site oficial conferidos.
  - id: mega
    name: Mega
    aliases: ['Mega Chile', 'Canal Mega']
    medium: free_tv
    access_model: free
    domains: [mega.cl]
  - id: tvn
    name: TVN
    aliases: ['Televisión Nacional de Chile', 'TVN Chile']
    medium: free_tv
    access_model: free
    domains: [tvn.cl]
  - id: canal_13
    name: Canal 13
    aliases: ['Canal 13 Chile', 'T13', 'Trece Chile']
    medium: free_tv
    access_model: free
    domains: [13.cl]
sources:
  organizers: [anfp.cl]
  press:
    - latercera.com
    - emol.com
    - biobiochile.cl
    - redgol.cl
    - cooperativa.cl
