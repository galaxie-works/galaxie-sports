# =============================================================================
# Dicionário de emissoras e plataformas — México (MX)
# Formato e regras: ver config/broadcasters/br.yaml.
# Fonte do panorama: docs/research/onde-assistir.md §2.2–2.3 (revisado em 2026-10-21).
# Na Liga MX os direitos são do clube mandante: a tabela de direitos lista todos os
# detentores do torneio e o agente confirma jogo a jogo.
# Operadoras de TV paga não são nomeadas por política editorial (ver _policy.yaml).
# =============================================================================
schema_version: 1
country: MX
language: es-MX
updated_at: 2026-10-21
broadcasters:
  - id: televisa
    name: Televisa
    aliases: ['Televisa Deportes', 'TelevisaUnivision']
    channels: ['Canal 5', 'Las Estrellas', 'Canal 9', 'Nu9ve']
    medium: free_tv
    access_model: free
    group: televisaunivision
    domains: [televisa.com, lasestrellas.tv]
  - id: tudn
    name: TUDN
    aliases: ['TUDN México']
    medium: pay_tv
    access_model: subscription
    group: televisaunivision
    domains: [tudn.com]
  - id: vix
    name: ViX
    aliases: ['ViX Premium', 'Vix', 'ViX Plus']
    medium: streaming_svod
    access_model: subscription
    group: televisaunivision
    domains: [vix.com]
  - id: tv_azteca
    name: TV Azteca
    aliases: ['Azteca Deportes', 'TV Azteca Deportes']
    channels: ['Azteca 7', 'Azteca Uno']
    medium: free_tv
    access_model: free
    domains: [tvazteca.com, aztecadeportes.com]
  - id: fox
    name: FOX
    aliases: ['FOX Sports México', 'Fox Sports', 'FOX México', 'Fox Sports Premium']
    medium: pay_tv
    access_model: subscription
    domains: [foxsports.com.mx]
  - id: fox_one
    name: Fox One
    aliases: ['FOX One', 'FoxOne']
    medium: streaming_svod
    access_model: subscription
    domains: [foxsports.com.mx/fox-one]
  - id: tnt_sports
    name: TNT Sports
    aliases: ['TNT Sports México', 'TNT']
    medium: pay_tv
    access_model: subscription
    group: wbd
    domains: [tntsports.com.mx]
  - id: hbo_max
    name: HBO Max
    aliases: ['Max', 'HBOMax']
    medium: streaming_svod
    access_model: subscription
    group: wbd
    domains: [hbomax.com, max.com, help.hbomax.com]
  - id: espn
    name: ESPN
    aliases: ['ESPN México']
    channels: ['ESPN 2', 'ESPN 3', 'ESPN 4']
    medium: pay_tv
    access_model: subscription
    group: disney
    domains: [espn.com.mx]
  - id: disney_plus
    name: Disney+
    aliases: ['Disney Plus', 'Disney+ Premium']
    medium: streaming_svod
    access_model: subscription
    group: disney
    domains: [disneyplus.com]
  - id: prime_video
    name: Prime Video
    aliases: ['Amazon Prime Video', 'Amazon Prime']
    medium: streaming_svod
    access_model: subscription
    domains: [primevideo.com, amazon.com.mx]
  - id: paramount_plus
    name: Paramount+
    aliases: ['Paramount Plus']
    medium: streaming_svod
    access_model: subscription
    domains: [paramountplus.com]
  # Liga MX Femenil (Apertura 2026): os clubes da FOX transmitem como mandante pela Tubi ("FOX en Tubi").
  - id: tubi
    name: Tubi
    aliases: ['Tubi TV', 'FOX en Tubi', 'Fox en Tubi']
    medium: streaming_free
    access_model: free
    domains: [tubitv.com]
  # Canal oficial da Liga BBVA MX Femenil ("FutFem Donde Sea"), gratuito.
  - id: liga_femenil_youtube
    name: YouTube Liga BBVA MX Femenil
    aliases:
      - 'YouTube de la Liga Femenil'
      - 'Canal de YouTube de la Liga MX Femenil'
      - 'Liga BBVA MX Femenil (YouTube)'
      - 'LIGA FEMENIL BBVA'
      - 'FutFem Donde Sea'
    medium: youtube
    access_model: free
    domains: [youtube.com/@ligabbvamxfemenil, ligafemenil.mx]
