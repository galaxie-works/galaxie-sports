# =============================================================================
# Dicionário de emissoras e plataformas — Equador (EC)
# Formato e regras: ver config/broadcasters/br.yaml.
# Fonte do panorama: docs/research/onde-assistir.md §2.2–2.3 (revisado em 2026-10-21).
# Operadoras de TV paga não são nomeadas por política editorial (ver _policy.yaml).
# =============================================================================
schema_version: 1
country: EC
language: es-EC
updated_at: 2026-10-21
broadcasters:
  - id: teleamazonas
    name: Teleamazonas
    aliases: ['Tele Amazonas']
    medium: free_tv
    access_model: free
    domains: [teleamazonas.com]
  - id: espn
    name: ESPN
    # Fora do Brasil e da Argentina, a Disney renomeou os Fox Sports 2 e 3 para ESPN 6 e 7 em
    # fevereiro de 2024: o nome antigo numa grade é o canal novo (não conta duas vezes; antes da data,
    # não casa). Na Argentina a Fox Sports segue existindo (ar.yaml).
    aliases:
      - 'ESPN Ecuador'
      - { name: 'Fox Sports 2', channel: 'ESPN 6', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 2 HD', channel: 'ESPN 6', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 3', channel: 'ESPN 7', valid_from: 2024-02-01 }
      - { name: 'Fox Sports 3 HD', channel: 'ESPN 7', valid_from: 2024-02-01 }
    channels: ['ESPN 2', 'ESPN 3', 'ESPN 6', 'ESPN 7']
    medium: pay_tv
    access_model: subscription
    group: disney
    domains: [espn.com.ec]
  - id: disney_plus
    name: Disney+
    aliases: ['Disney Plus', 'Disney+ Premium']
    medium: streaming_svod
    access_model: subscription
    group: disney
    domains: [disneyplus.com]
  - id: paramount_plus
    name: Paramount+
    aliases: ['Paramount Plus']
    medium: streaming_svod
    access_model: subscription
    domains: [paramountplus.com]
  # Acervo oficial de logos (2026-10-23): emissoras do acervo com país e site oficial conferidos.
  - id: ecuavisa
    name: Ecuavisa
    aliases: ['Ecuavisa TV']
    medium: free_tv
    access_model: free
    domains: [ecuavisa.com]
  - id: ecdf
    name: El Canal del Fútbol
    aliases: ['ECDF', 'El Canal del Futbol', 'Canal del Fútbol']
    medium: pay_tv
    access_model: subscription
    domains: [elcanaldelfutbol.com]
  - id: tc_television
    name: TC Televisión
    aliases: ['TC', 'TC Television', 'TC Mi Canal']
    medium: free_tv
    access_model: free
    domains: [tctelevision.com]
  - id: gama_tv
    name: Gama TV
    aliases: ['GamaTV', 'Gamavisión']
    medium: free_tv
    access_model: free
    domains: [gamatv.com.ec]
sources:
  organizers: [ligapro.ec, fef.ec]
  press:
    - eluniverso.com
    - primicias.ec
    - expreso.ec
    - elcomercio.com
    - estadio.ec
