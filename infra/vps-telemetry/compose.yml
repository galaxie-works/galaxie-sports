# Projeto de apps da stack do Galaxie Sports na VPS "telemetry" (Traefik já em produção, em network_mode: host): o único que o
# deploy automático conhece (deploy-gh.sh). Dados em compose.dados.yml e observabilidade em compose.obs.yml, na mesma rede.
# Derivada da antiga stack do Portainer (aposentada em 30/10/2026): sem Caddy (o Traefik faz TLS e roteamento), sem builds (imagens do GHCR),
# rede com sub-rede fixa (TRUST_PROXY conhecido), limites de memória e o app de demonstração.
# Passo a passo, verificação e reverso: infra/vps-telemetry/README.md.
#
# Validar: docker compose -f infra/vps-telemetry/compose.yml --env-file infra/vps-telemetry/env.example config -q
#
# Cada imagem tem a própria tag no .env (TAG_API: api, webhooks, migrate e candidato; TAG_DEMO: site, console e candidatos;
# TAG_INGESTOR: live, ingestor e agents; TAG_BACKUP; TAG_PROMETHEUS; TAG_GRAFANA), para um deploy trocar só o que mudou
# (deploy-gh.sh). O SHA publicado fica em DEPLOY_SHA, que não pode entrar no env de nenhum serviço: env novo recria o
# contêiner.

name: galaxie-sports

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-node-env: &node-env
  NODE_ENV: production
  APP_ENV: staging
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Dono do banco (POSTGRES_USER): só o migrate usa. Cada serviço sobrescreve com o papel dele (DB_URL_<SERVIÇO>,
  # docs/runbooks/papeis-do-banco.md); sem a variável, o serviço segue com o dono (troca sem downtime, um por vez).
  DATABASE_URL: postgres://${POSTGRES_USER:-galaxie}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxie_sports}
  REDIS_URL: redis://valkey:6379
  S3_ENDPOINT: http://s3:9000
  S3_BUCKET: ${S3_BUCKET:-galaxie-sports-assets}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
  APISPORTS_PLAN: ${APISPORTS_PLAN:-free}
  # Plano por API (cada API tem assinatura própria); vazio = APISPORTS_PLAN.
  APISPORTS_PLAN_FOOTBALL: ${APISPORTS_PLAN_FOOTBALL:-}
  APISPORTS_PLAN_AFL: ${APISPORTS_PLAN_AFL:-}
  APISPORTS_PLAN_BASEBALL: ${APISPORTS_PLAN_BASEBALL:-}
  APISPORTS_PLAN_BASKETBALL: ${APISPORTS_PLAN_BASKETBALL:-}
  APISPORTS_PLAN_FORMULA_1: ${APISPORTS_PLAN_FORMULA_1:-}
  APISPORTS_PLAN_HANDBALL: ${APISPORTS_PLAN_HANDBALL:-}
  APISPORTS_PLAN_HOCKEY: ${APISPORTS_PLAN_HOCKEY:-}
  APISPORTS_PLAN_MMA: ${APISPORTS_PLAN_MMA:-}
  APISPORTS_PLAN_NBA: ${APISPORTS_PLAN_NBA:-}
  APISPORTS_PLAN_AMERICAN_FOOTBALL: ${APISPORTS_PLAN_AMERICAN_FOOTBALL:-}
  APISPORTS_PLAN_RUGBY: ${APISPORTS_PLAN_RUGBY:-}
  APISPORTS_PLAN_VOLLEYBALL: ${APISPORTS_PLAN_VOLLEYBALL:-}
  # Abaixo desta parte da cota do dia só o ao vivo chama (APP_ENV acima diz ao Governor que é produção).
  QUOTA_LIVE_RESERVE_PERCENT: ${QUOTA_LIVE_RESERVE_PERCENT:-25}
  # URL pública dos assets (logos, bandeiras, fotos) servidos pelo Traefik direto do bucket
  ASSETS_PUBLIC_BASE_URL: https://${ASSETS_DOMAIN:?defina ASSETS_DOMAIN}/${S3_BUCKET:-galaxie-sports-assets}

services:
  # Aplica as migrations (idempotente) antes de API e ingestor subirem.
  migrate:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-api:${TAG_API:?defina TAG_API}
    pull_policy: ${PULL_POLICY:-always}
    command: ['node', 'node_modules/@galaxie/db/dist/migrate-cli.js']
    environment:
      <<: *node-env
      # papéis por serviço (packages/db/src/roles.ts): off até a troca; on cria os papéis, aplica os GRANTs e dá
      # LOGIN com a senha das URLs abaixo (o usuário da URL tem de ser o papel: galaxie_api, galaxie_demo…)
      DB_ROLES: ${DB_ROLES:-off}
      DB_URL_API: ${DB_URL_API:-}
      DB_URL_DEMO: ${DB_URL_DEMO:-}
      DB_URL_INGESTOR: ${DB_URL_INGESTOR:-}
      DB_URL_AGENTS: ${DB_URL_AGENTS:-}
      DB_URL_LIVE: ${DB_URL_LIVE:-}
      DB_URL_BACKUP: ${DB_URL_BACKUP:-}
    restart: 'no'
    logging: *logging

  api: &api
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-api:${TAG_API:?defina TAG_API}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 512m
    environment: &api-env
      <<: *node-env
      DATABASE_URL: ${DB_URL_API:-postgres://${POSTGRES_USER:-galaxie}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxie_sports}}
      API_PORT: '8080'
      # Bearer exigido em /metrics (o Prometheus da stack manda o mesmo): sem ele, qualquer contêiner da rede lia as métricas
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN (openssl rand -hex 32)}
      # token curto do SSE (POST /v1/stream/token): mesmo segredo em todas as instâncias; vazio = aleatório por
      # processo (o token emitido antes de um deploy não abre o stream depois dele; o cliente pede outro)
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:-}
      FAN_TOKEN_SECRET: ${FAN_TOKEN_SECRET:-}
      FAN_TOKEN_SECRET_PREVIOUS: ${FAN_TOKEN_SECRET_PREVIOUS:-}
      LIVE_POLL_INTERVAL_SECONDS: ${LIVE_POLL_INTERVAL_SECONDS:-300}
      # teto de streams SSE deste contêiner (todos os tenants); acima, 503 com Retry-After (mem_limit 512m)
      SSE_MAX_CONNECTIONS: ${SSE_MAX_CONNECTIONS:-1000}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      # Cosmos AI (#993): segredo do endpoint do webhook do Stripe (whsec_…). Vazio, POST /webhooks/stripe/cosmos
      # responde 503 e o Stripe tenta de novo depois
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      API_PUBLIC_URL: https://${API_DOMAIN:?defina API_DOMAIN}
      SEMANTIC_MIN_REVIEW_STATUS: ${SEMANTIC_MIN_REVIEW_STATUS:-approved}
      # Hardening (SECURITY.md): CORS estrito, /internal/admin (chave + allowlist), proxy confiável, HSTS
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_KEY_HASHES: ${ADMIN_KEY_HASHES:-}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      TRUST_PROXY: ${TRUST_PROXY:?defina TRUST_PROXY (gateway da rede da stack)}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - '8080'
    # /metrics e /internal não passam pelo Traefik (equivale ao bloqueio que o Caddy fazia).
    labels:
      - traefik.enable=true
      # middlewares da borda (infra/traefik/README.md): os mesmos em api, demo, s3 e maintenance; ligados por EDGE_MIDDLEWARES
      - traefik.http.middlewares.gsports-compress.compress.encodings=br,gzip
      - traefik.http.middlewares.gsports-compress.compress.includedcontenttypes=application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,image/svg+xml,text/plain
      - traefik.http.middlewares.gsports-retry.retry.attempts=2
      - traefik.http.middlewares.gsports-retry.retry.initialinterval=100ms
      - traefik.http.routers.gsports-api.rule=Host(`${API_DOMAIN:?defina API_DOMAIN}`) && !PathPrefix(`/metrics`) && !PathPrefix(`/internal`)
      - traefik.http.routers.gsports-api.entrypoints=websecure
      - traefik.http.routers.gsports-api.tls.certresolver=letsencrypt
      - traefik.http.routers.gsports-api.middlewares=${EDGE_MIDDLEWARES:-}
      - traefik.http.services.gsports-api.loadbalancer.server.port=8080
    # Healthcheck vem da imagem (GET /health).
    logging: *logging

  # App de demonstração (Next.js), em dois serviços da mesma imagem (issue #546): `site` (público, demo, docs, exemplo,
  # embed e registry dos widgets) e `console` (portal do cliente com o Builder e o painel de Ajustes). APP_ROLE desliga
  # no processo as rotas do outro papel (404) e o que só o outro usa (o console não segue o change feed); a tabela das
  # rotas é apps/demo/src/lib/app-role.ts. Um vazamento no painel derruba só o console: o site, a demo e o login seguem.
  # Fala com a API pela rede interna; a chave fica só no servidor.
  #
  # Traefik, no mesmo host: o router do console casa os prefixos dele (PathRegexp igual ao CONSOLE_PATH_REGEXP do
  # app-role.ts, conferido no teste) com prioridade 2000; o do site casa o host inteiro com prioridade 1000; o de
  # manutenção do console (1500, declarado no site, aponta para o serviço maintenance) cobre os prefixos do console quando
  # ele sai do ar, e o de manutenção da demo (1) o resto. Um contêiner `demo` de antes da divisão (rótulo sem prioridade:
  # a do tamanho da regra, ~30) perde dos dois; o deploy o tira depois que eles sobem (deploy-plan.sh › SAI). Login e /api/auth ficam no site: o cookie de sessão é do host, vale nos dois.
  # Healthcheck: o da imagem (/robots.txt, que os dois papéis atendem), com o intervalo da partida curto para a troca.
  # Memória: README › Memória dos jobs (site 512m como a demo de antes; console 384m, heap 224).
  site: &site
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-demo:${TAG_DEMO:?defina TAG_DEMO}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 512m
    environment: &demo-env
      APP_ROLE: site
      # /metrics do processo (build_info, memória) numa porta só da rede interna, para o Prometheus; sem router
      DEMO_METRICS_PORT: '9464'
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN (openssl rand -hex 32)}
      GALAXIE_API_URL: http://api:8080
      GALAXIE_DEMO_KEY: ${GALAXIE_DEMO_KEY:-}
      # Logos da grade em Ajustes → Grades e ofertas, lidos direto do banco: sem a base pública dos assets, a
      # demo só tinha a origem gravada (`acervo-oficial://…`), que o navegador não carrega
      ASSETS_PUBLIC_BASE_URL: https://${ASSETS_DOMAIN:?defina ASSETS_DOMAIN}/${S3_BUCKET:-galaxie-sports-assets}
      # Upload de logos no painel (Ajustes → Grades e ofertas): grava no mesmo bucket que a API serve
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: ${S3_BUCKET:-galaxie-sports-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
      # Login e usuários da demo (Better Auth): schema demo_auth no mesmo Postgres
      DEMO_DATABASE_URL: ${DB_URL_DEMO:-postgres://${POSTGRES_USER:-galaxie}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxie_sports}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET (openssl rand -hex 32)}
      BETTER_AUTH_URL: https://${DEMO_DOMAIN:?defina DEMO_DOMAIN}
      # Primeiro admin: criado na subida se ainda não houver nenhum; recebe o convite por e-mail
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_NAME: ${DEMO_ADMIN_NAME:-}
      # Conta de revisão externa com código fixo (apps/demo/src/lib/auth/reviewer.ts)
      DEMO_REVIEWER_EMAIL: ${DEMO_REVIEWER_EMAIL:-}
      DEMO_REVIEWER_CODE: ${DEMO_REVIEWER_CODE:-}
      # E-mail de convite e de redefinição de senha (sem SMTP o painel mostra o link para copiar)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Webhooks no painel do cliente (/cliente/webhooks): a mesma KEK do worker cifra o segredo no cadastro e na
      # rotação. Vazia: o painel lista, testa e reenvia, mas não cadastra (docs/runbooks/webhooks.md)
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      # Cosmos AI (#993): chave secreta do Stripe da Galaxie Works LLC (sk_test_… no ensaio), para abrir o Checkout dos
      # pacotes de créditos. Vazia: a compra fica indisponível no painel do cliente
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Cosmos AI (#1003): chave do provedor só do assistente do app. Vazia: o assistente responde "indisponível"
      COSMOS_ANTHROPIC_API_KEY: ${COSMOS_ANTHROPIC_API_KEY:-}
      # "Sugerir ou reportar algo" do cabeçalho vira issue numa repo PRIVADA só de sugestões (docs/runbooks/sugestoes-do-app.md):
      # token próprio, só dessa repo (Issues: read and write). Vazio, ou repo pública: o formulário responde "indisponível".
      # As imagens vão para o bucket privado das tarefas (feedback/) e a issue as mostra por link assinado da demo
      FEEDBACK_GITHUB_TOKEN: ${FEEDBACK_GITHUB_TOKEN:-}
      FEEDBACK_GITHUB_REPO: ${FEEDBACK_GITHUB_REPO:-}
      S3_TASKS_BUCKET: ${S3_TASKS_BUCKET:-galaxie-sports-tasks}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '3000'
      - '9464'
    healthcheck:
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
      start_interval: 2s
    # O acesso é controlado pelo próprio app (login por convite, papéis e prazo por usuário).
    labels:
      - traefik.enable=true
      # middlewares da borda (infra/traefik/README.md): os mesmos em api, site, console, s3 e maintenance; ligados por EDGE_MIDDLEWARES
      - traefik.http.middlewares.gsports-compress.compress.encodings=br,gzip
      - traefik.http.middlewares.gsports-compress.compress.includedcontenttypes=application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,image/svg+xml,text/plain
      - traefik.http.middlewares.gsports-retry.retry.attempts=2
      - traefik.http.middlewares.gsports-retry.retry.initialinterval=100ms
      - traefik.http.routers.gsports-site.rule=Host(`${DEMO_DOMAIN:?defina DEMO_DOMAIN}`)
      - traefik.http.routers.gsports-site.entrypoints=websecure
      - traefik.http.routers.gsports-site.tls.certresolver=letsencrypt
      - traefik.http.routers.gsports-site.middlewares=${EDGE_MIDDLEWARES:-}
      - traefik.http.routers.gsports-site.priority=1000
      - traefik.http.routers.gsports-site.service=gsports-site
      - traefik.http.services.gsports-site.loadbalancer.server.port=3000
      # console fora do ar (reinício, OOM): os prefixos dele vão para a página de manutenção (serviço maintenance), não
      # para o 404 do site. Fica no site para o compose do maintenance não mudar; com o site também fora, o router de
      # manutenção da demo (prioridade 1) cobre o host inteiro
      - traefik.http.routers.gsports-console-maintenance.rule=Host(`${DEMO_DOMAIN:?defina DEMO_DOMAIN}`) && PathRegexp(`^/(ajustes|api/ajustes|api/cliente|cliente)(/|$$)`)
      - traefik.http.routers.gsports-console-maintenance.entrypoints=websecure
      - traefik.http.routers.gsports-console-maintenance.tls.certresolver=letsencrypt
      - traefik.http.routers.gsports-console-maintenance.middlewares=${EDGE_MIDDLEWARES:-}
      - traefik.http.routers.gsports-console-maintenance.priority=1500
      - traefik.http.routers.gsports-console-maintenance.service=gsports-maintenance-site
    logging: *logging

  console: &console
    <<: *site
    mem_limit: 320m
    # heap menor que o do site (320): sem o cache do explorador; 224 + geração nova 3 × 16 + ~50 no limite (pico medido 193, #533)
    command: ['node', '--max-old-space-size=224', '--max-semi-space-size=16', 'apps/demo/server.js']
    environment: &console-env
      <<: *demo-env
      APP_ROLE: console
    labels:
      - traefik.enable=true
      # middlewares da borda (infra/traefik/README.md): os mesmos em api, site, console, s3 e maintenance; ligados por EDGE_MIDDLEWARES
      - traefik.http.middlewares.gsports-compress.compress.encodings=br,gzip
      - traefik.http.middlewares.gsports-compress.compress.includedcontenttypes=application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,image/svg+xml,text/plain
      - traefik.http.middlewares.gsports-retry.retry.attempts=2
      - traefik.http.middlewares.gsports-retry.retry.initialinterval=100ms
      - traefik.http.routers.gsports-console.rule=Host(`${DEMO_DOMAIN:?defina DEMO_DOMAIN}`) && PathRegexp(`^/(ajustes|api/ajustes|api/cliente|cliente)(/|$$)`)
      - traefik.http.routers.gsports-console.entrypoints=websecure
      - traefik.http.routers.gsports-console.tls.certresolver=letsencrypt
      - traefik.http.routers.gsports-console.middlewares=${EDGE_MIDDLEWARES:-}
      - traefik.http.routers.gsports-console.priority=2000
      - traefik.http.routers.gsports-console.service=gsports-console
      - traefik.http.services.gsports-console.loadbalancer.server.port=3000

  # Worker dos webhooks (docs/05 §5.2): enfileira a partir do ops.change_feed e entrega as notificações assinadas.
  # Mesma imagem da API, sem router: a 8080 só tem /health, /version e /metrics (servidor de operação). Na primeira subida
  # o cursor começa do fim do change feed (não reenvia o histórico). Healthcheck vem da imagem (GET /health): o deploy troca
  # lado a lado (rolling-swap.sh); duas instâncias juntas não entregam em dobro (FOR UPDATE SKIP LOCKED), o worker fecha a
  # entrega em andamento no SIGTERM (stop_grace_period) e o novo retoma pelo cursor. Na volta automática do deploy para uma versão sem este serviço, o `up` usa
  # --remove-orphans (deploy-gh.sh/deploy.sh), para o worker da versão recusada não seguir entregando.
  webhooks:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-api:${TAG_API:?defina TAG_API}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 192m
    command: ['node', '--max-old-space-size=128', 'dist/webhooks/worker-main.js']
    environment:
      <<: *node-env
      DATABASE_URL: ${DB_URL_API:-postgres://${POSTGRES_USER:-galaxie}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxie_sports}}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      # depois de `webhook seal-secrets` (SECURITY.md › Webhooks): segredo legado em texto puro deixa de assinar
      WEBHOOK_REJECT_PLAINTEXT_SECRETS: ${WEBHOOK_REJECT_PLAINTEXT_SECRETS:-}
      # Bearer do /metrics do servidor de operação do worker (build_info), igual ao da API
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN (openssl rand -hex 32)}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    logging: *logging

  # Candidatos do deploy (perfil `candidate`; só o deploy-gh.sh os sobe): a API, o site e o console da
  # versão nova ao lado dos que estão no ar, sem router no Traefik (nenhum tráfego de fora), para o smoke rodar ANTES
  # da troca. Mesmo env e mesmos limites dos originais (as âncoras); a API com prefixo próprio no Valkey (cache, rate
  # limit, uso e relay do SSE não se misturam com os da versão no ar), sem consolidar o uso no Postgres, e site e
  # console falando com ela. Sobem com --no-deps e
  # saem logo depois do smoke. README › Atualizar › Candidato e troca sem manutenção.
  api-candidate:
    <<: *api
    profiles: [candidate]
    restart: 'no'
    environment:
      <<: *api-env
      REDIS_KEY_PREFIX: 'gs-candidate:'
      # o uso do smoke não vai para api.usage_daily: o epoch do prefixo novo travaria a consolidação da produção
      USAGE_PERSIST: 'off'
    depends_on: {}
    labels: [traefik.enable=false]

  site-candidate:
    <<: *site
    profiles: [candidate]
    restart: 'no'
    environment:
      <<: *demo-env
      GALAXIE_API_URL: http://api-candidate:8080
    depends_on: {}
    labels: [traefik.enable=false]

  console-candidate:
    <<: *console
    profiles: [candidate]
    restart: 'no'
    environment:
      <<: *console-env
      GALAXIE_API_URL: http://api-candidate:8080
    depends_on: {}
    labels: [traefik.enable=false]

  # Página de manutenção: responde 503 nos hosts da demo e da API enquanto o contêiner de verdade não está no ar
  # (reiniciando ou ainda sem healthcheck "healthy"), em vez do 404 do Traefik sem backend. O deploy troca sem ela.
  # Os routers têm prioridade 1 (a padrão do Traefik é o tamanho da regra): só ganham quando o router da demo ou da
  # API some. Imagem fixa e config só neste arquivo (configs: abaixo), sem tag de deploy: deploy normal não recria.
  # Mudou o conteúdo das configs → atualize works.galaxie.maintenance-rev (o CI confere com maintenance-rev.mjs e diz
  # o valor); é ele que faz o próximo deploy recriar o serviço. Forçar a manutenção, para mexer no banco:
  # maintenance.sh up|down (README › Página de manutenção).
  # Mesmos hosts e mesma regra da API (sem /metrics e /internal) dos routers originais.
  maintenance:
    image: caddy:2.11.7-alpine
    pull_policy: missing
    restart: unless-stopped
    mem_limit: 64m
    # sem read_only: as configs inline são copiadas para dentro do contêiner na criação
    security_opt:
      - no-new-privileges:true
    configs:
      - source: maintenance-caddyfile
        target: /etc/caddy/Caddyfile
      - source: maintenance-page
        target: /srv/site/index.html
      - source: maintenance-problem
        target: /srv/api/problem.json
    expose:
      - '8080'
      - '8081'
    # "Saudável" = respondendo o 503 da página (o Traefik só usa contêiner healthy)
    healthcheck:
      test: ['CMD-SHELL', "wget -q -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q 'HTTP/1.1 503'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    labels:
      - works.galaxie.maintenance-rev=ea68f94e0334
      - traefik.enable=true
      # middlewares da borda (infra/traefik/README.md): os mesmos em api, demo, s3 e maintenance; ligados por EDGE_MIDDLEWARES
      - traefik.http.middlewares.gsports-compress.compress.encodings=br,gzip
      - traefik.http.middlewares.gsports-compress.compress.includedcontenttypes=application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,image/svg+xml,text/plain
      - traefik.http.middlewares.gsports-retry.retry.attempts=2
      - traefik.http.middlewares.gsports-retry.retry.initialinterval=100ms
      - traefik.http.routers.gsports-demo-maintenance.rule=Host(`${DEMO_DOMAIN:?defina DEMO_DOMAIN}`)
      - traefik.http.routers.gsports-demo-maintenance.entrypoints=websecure
      - traefik.http.routers.gsports-demo-maintenance.tls.certresolver=letsencrypt
      - traefik.http.routers.gsports-demo-maintenance.middlewares=${EDGE_MIDDLEWARES:-}
      - traefik.http.routers.gsports-demo-maintenance.priority=${MAINTENANCE_PRIORITY:-1}
      - traefik.http.routers.gsports-demo-maintenance.service=gsports-maintenance-site
      - traefik.http.services.gsports-maintenance-site.loadbalancer.server.port=8080
      - traefik.http.routers.gsports-api-maintenance.rule=Host(`${API_DOMAIN:?defina API_DOMAIN}`) && !PathPrefix(`/metrics`) && !PathPrefix(`/internal`)
      - traefik.http.routers.gsports-api-maintenance.entrypoints=websecure
      - traefik.http.routers.gsports-api-maintenance.tls.certresolver=letsencrypt
      - traefik.http.routers.gsports-api-maintenance.middlewares=${EDGE_MIDDLEWARES:-}
      - traefik.http.routers.gsports-api-maintenance.priority=${MAINTENANCE_PRIORITY:-1}
      - traefik.http.routers.gsports-api-maintenance.service=gsports-maintenance-api
      - traefik.http.services.gsports-maintenance-api.loadbalancer.server.port=8081
    logging: *logging

  # Ao vivo (#535): a mesma imagem do ingestor com o scheduler no perfil `live`, só com a faixa do ao vivo
  # (live-run, live-reconcile, events-clock). Um deploy que não muda a imagem do ingestor não toca nele, e a troca do
  # ingestor não corta mais o placar. O live-run fica no ar com líder e reserva (LIVE_LEADER=on, trava `live:leader`
  # no Postgres); morreu, o scheduler sobe de novo. Duas cópias sempre (#537): uma lidera, a outra assume em ~1 s se a
  # líder cair. O deploy troca uma cópia por vez, a líder primeiro (rolling-swap.sh), antes de ingestor e agents.
  live:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-ingestor:${TAG_INGESTOR:?defina TAG_INGESTOR}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    # o Compose (v2) sobe as cópias sem swarm; `--scale live=N` no up vale por cima. Uma cópia (dev): LIVE_REPLICAS=1
    deploy:
      replicas: ${LIVE_REPLICAS:-2}
    # por cópia: pico medido 237 com 79 jogos em andamento ou começando (#533), × 1,5 = 355; 448 por não ter medido rodada cheia de fim de
    # semana. A soma dos heaps (576 MB) não cabe e não acontece junto: README › Memória dos jobs
    mem_limit: 448m
    environment:
      <<: *node-env
      # papel galaxie_live (packages/db/src/roles.ts); sem DB_URL_LIVE, o dono, como os outros
      DATABASE_URL: ${DB_URL_LIVE:-postgres://${POSTGRES_USER:-galaxie}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxie_sports}}
      # Bearer do /metrics do servidor de operação do scheduler (porta 9464, build_info), igual ao da API
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN (openssl rand -hex 32)}
      APISPORTS_KEY: ${APISPORTS_KEY:?defina APISPORTS_KEY}
      SCHEDULER_PROFILE: live
      LIVE_LEADER: 'on'
      # no SIGTERM, o scheduler espera o live-run fechar o tick: a chamada no ar (APISPORTS_LIVE_TIMEOUT_MS, 30 s) e a
      # gravação (perfil `live` do banco: 30 s de consulta), mais o estado e o job_run; detalhe novo não abre
      # (README › Ao vivo). Abaixo do stop_grace_period
      SCHEDULER_STOP_WAIT_SECONDS: '70'
      SCHEDULE_LIVE_RUN: ${SCHEDULE_LIVE_RUN:-*/5 * * * *}
      SCHEDULE_LIVE_RECONCILE: ${SCHEDULE_LIVE_RECONCILE:-*/10 * * * *}
      SCHEDULE_EVENTS_CLOCK: ${SCHEDULE_EVENTS_CLOCK:-* * * * *}
      LIVE_FEATURED: ${LIVE_FEATURED:-off}
      LIVE_MAX_INTERVAL_MINUTES: ${LIVE_MAX_INTERVAL_MINUTES:-15}
      LIVE_IDLE_EXIT_MINUTES: ${LIVE_IDLE_EXIT_MINUTES:-15}
      LIVE_PROTECT_DAILY: ${LIVE_PROTECT_DAILY:-}
      LIVE_MIN_PRIORITY: ${LIVE_MIN_PRIORITY:-medium}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # O da imagem (batimento do scheduler, como no ingestor), com a primeira checagem em 2 s: a troca espera a cópia
    # nova ficar healthy antes de parar a antiga
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node /usr/local/lib/galaxie/selfheal.mjs heartbeat "$$SCHEDULER_HEARTBEAT_FILE" 120000',
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # No SIGTERM a líder fecha o tick (até 70 s no pior caso: SCHEDULER_STOP_WAIT_SECONDS; o normal é 1 a 3 s), publica
    # o estado e solta a trava; a reserva assume na tentativa seguinte. 5 s a mais para o scheduler sair antes do SIGKILL
    stop_grace_period: 75s
    logging: *logging

  # Scheduler: roda os CLIs do ingestor em horários fixos (UTC) e registra cada execução em ops.job_run. A faixa do ao
  # vivo roda no serviço `live` (SCHEDULER_LIVE=external).
  ingestor:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-ingestor:${TAG_INGESTOR:?defina TAG_INGESTOR}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    # scheduler + SCHEDULER_MAX_JOBS jobs, cada um com heap fixo: a soma no pior caso é 352 MB; pico medido 331 (#533) × 1,5 = 497.
    # O ao vivo está no `live` e o trabalho longo no `worker` (QUEUE_MODE=enqueue). Teto de CPU: ingestor, worker e agents somam
    # 1,0 das 2 vCPU, o resto fica para Postgres, API e ao vivo (README › Memória dos jobs)
    cpus: 0.4
    mem_limit: 512m
    environment:
      <<: *node-env
      DATABASE_URL: ${DB_URL_INGESTOR:-postgres://${POSTGRES_USER:-galaxie}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxie_sports}}
      # Bearer do /metrics do servidor de operação do scheduler (porta 9464, build_info), igual ao da API
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN (openssl rand -hex 32)}
      APISPORTS_KEY: ${APISPORTS_KEY:?defina APISPORTS_KEY}
      # Bucket privado dos pacotes e relatórios das tarefas (tasks/<id>/, #587): o `assets:acervo --pacote` avulso
      # (docker compose run ingestor) lê de lá; sem leitura anônima, fora do Traefik (compose.dados.yml › s3-init)
      S3_TASKS_BUCKET: ${S3_TASKS_BUCKET:-galaxie-sports-tasks}
      # live-run, live-reconcile e events-clock rodam no serviço `live`
      SCHEDULER_LIVE: external
      SCHEDULE_SYNC_DAILY: ${SCHEDULE_SYNC_DAILY:-5 0 * * *}
      SCHEDULE_SYNC_MIRROR: ${SCHEDULE_SYNC_MIRROR:-0 8 * * *}
      SCHEDULE_NORMALIZE_FOOTBALL: ${SCHEDULE_NORMALIZE_FOOTBALL:-35 0 * * *}
      SCHEDULE_NORMALIZE_SPORTS: ${SCHEDULE_NORMALIZE_SPORTS:-15 * * * *}
      SCHEDULE_ASSETS_MIRROR: ${SCHEDULE_ASSETS_MIRROR:-30 1 * * *}
      SCHEDULE_CHANGE_FEED_PRUNE: ${SCHEDULE_CHANGE_FEED_PRUNE:-45 2 * * *}
      CHANGE_FEED_RETENTION_DAYS: ${CHANGE_FEED_RETENTION_DAYS:-7}
      SCHEDULE_QUOTA_STATUS: ${SCHEDULE_QUOTA_STATUS:-5 * * * *}
      SCHEDULE_BOOTSTRAP_CATALOG: ${SCHEDULE_BOOTSTRAP_CATALOG:-15 3 * * 1}
      SCHEDULER_RUN_ON_START: ${SCHEDULER_RUN_ON_START:-}
      SCHEDULER_TIMEOUT_MINUTES: ${SCHEDULER_TIMEOUT_MINUTES:-}
      # 1 job fora da faixa do ao vivo: o pesado (espelho de assets e as tarefas da fila) roda no worker. Variável
      # própria no .env (como a dos agents): um SCHEDULER_MAX_JOBS=2 antigo no .env não passa do mem_limit acima
      SCHEDULER_MAX_JOBS: ${INGESTOR_MAX_JOBS:-1}
      SCHEDULER_JOB_HEAP_MB: ${SCHEDULER_JOB_HEAP_MB:-160}
      # enqueue: o job com tarefa equivalente (assets-mirror → assets.espelhar) só enfileira, e o worker executa
      # (docs/runbooks/tarefas.md › O scheduler e a fila). `run` volta a rodar no ingestor, sem worker
      QUEUE_MODE: ${QUEUE_MODE:-enqueue}
      # Qualidade dos dados (job data-quality): as regras da F1 leem a API do próprio stack; sem a chave, saem "puladas"
      SCHEDULE_DATA_QUALITY: ${SCHEDULE_DATA_QUALITY:-40 4 * * *}
      # Cosmos AI (#994): reservas vencidas, teste vencido e recarga automática a cada 5 min; a recarga só cobra com a chave
      SCHEDULE_COSMOS_UPKEEP: ${SCHEDULE_COSMOS_UPKEEP:-*/5 * * * *}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      QUALITY_API_URL: ${QUALITY_API_URL:-http://api:8080}
      QUALITY_API_KEY: ${QUALITY_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 40s
    logging: *logging

  # Worker da fila de tarefas (#542; docs/runbooks/tarefas.md): toma as tarefas de ops.job_request (acervo, espelho de
  # assets, carga histórica, backfills), roda cada uma num processo filho com heap fixo, renova a concessão e retoma
  # do checkpoint o que outro worker deixou. Mesma imagem do ingestor e o papel dele no banco (escrita larga). No
  # SIGTERM drena: para de tomar, o lote em andamento fecha (WORKER_DRAIN_S, 60 s) e o que não fechou volta à fila
  # com o checkpoint; o stop_grace_period cobre a drenagem e o SIGKILL do filho. O deploy troca lado a lado depois do
  # ingestor e antes da API (rolling-swap.sh drena o antigo: espera o /health dizer `idle` ou o prazo). Vagas:
  # WORKER_CONCURRENCY_<TIPO> (padrão 1; o espelho 2; 0 tira o tipo), com o teto WORKER_MAX_TASKS somando os tipos.
  # Chamadas à api-sports passam pelo Quota Governor, com a reserva do ao vivo (QUOTA_LIVE_RESERVE_PERCENT).
  # /health, /version e /metrics na 8080 (sem router no Traefik).
  worker:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-ingestor:${TAG_INGESTOR:?defina TAG_INGESTOR}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    command: ['node', '--max-old-space-size=64', '--max-semi-space-size=8', 'dist/cli/worker.js']
    cpus: 0.2
    # pai 64 + WORKER_TASK_SLOTS 1 × (heap do filho 160 + 64) = 288 MB; pico medido 172 com o espelho de assets (README › Memória dos jobs)
    mem_limit: 384m
    environment:
      <<: *node-env
      DATABASE_URL: ${DB_URL_INGESTOR:-postgres://${POSTGRES_USER:-galaxie}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxie_sports}}
      # Bearer do /metrics do worker (worker_tasks_running, worker_task_duration_seconds, build_info), igual ao da API
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN (openssl rand -hex 32)}
      APISPORTS_KEY: ${APISPORTS_KEY:?defina APISPORTS_KEY}
      # Bucket privado das tarefas (#587): relatório da prévia do acervo em tasks/<id>/cobertura.md
      S3_TASKS_BUCKET: ${S3_TASKS_BUCKET:-galaxie-sports-tasks}
      # variável própria no .env (como INGESTOR_MAX_JOBS): um WORKER_MAX_TASKS=2 antigo no .env não passa do mem_limit acima
      WORKER_MAX_TASKS: ${WORKER_TASK_SLOTS:-1}
      WORKER_TASK_HEAP_MB: ${WORKER_TASK_HEAP_MB:-160}
      WORKER_DRAIN_S: ${WORKER_DRAIN_S:-60}
      WORKER_CONCURRENCY_ASSETS_ESPELHAR: ${WORKER_CONCURRENCY_ASSETS_ESPELHAR:-2}
      WORKER_CONCURRENCY_CARGA_HISTORICA: ${WORKER_CONCURRENCY_CARGA_HISTORICA:-1}
      WORKER_CONCURRENCY_ACERVO_IMPORTAR: ${WORKER_CONCURRENCY_ACERVO_IMPORTAR:-1}
      WORKER_CONCURRENCY_BACKFILL_NORMALIZAR: ${WORKER_CONCURRENCY_BACKFILL_NORMALIZAR:-1}
      WORKER_CONCURRENCY_BACKFILL_TABELAS: ${WORKER_CONCURRENCY_BACKFILL_TABELAS:-1}
      WORKER_CONCURRENCY_EXEMPLO_ECO: ${WORKER_CONCURRENCY_EXEMPLO_ECO:-1}
    healthcheck:
      test: ['CMD', 'node', '/usr/local/lib/galaxie/selfheal.mjs', 'http', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 75s
    logging: *logging

  # Agentes de IA (docs/07): resumo pós-jogo, cenário pré-jogo e Onde Assistir. Mesma imagem do
  # ingestor, com o scheduler no perfil `agents`; roda mesmo com o ingestor parado. A IA liga e desliga
  # por AI_STATUS (on|off) e AI_AGENT_STATUS (agente=on|off); ligada, o gasto com o LLM tem teto diário
  # em tokens (AI_DAILY_TOKEN_BUDGET) e em US$ (AI_DAILY_USD_BUDGET, tokens + buscas na web;
  # AI_AGENT_USD_BUDGETS por agente, AI_AGENT_DEFAULT_USD_BUDGET para o agente fora da lista), somando
  # todos os agentes e a ordem das fotos da F1 (ledger ops.llm_usage). Tetos: número
  # ou "unlimited"; 0 é inválido.
  agents:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-ingestor:${TAG_INGESTOR:?defina TAG_INGESTOR}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    # scheduler + AGENTS_MAX_JOBS jobs de 128 MB de heap: ~690 MB se todos enchessem o heap; pico medido 314 (#533), sem job de IA provocado
    # (README › Memória dos jobs)
    cpus: 0.4
    mem_limit: 448m
    environment:
      <<: *node-env
      DATABASE_URL: ${DB_URL_AGENTS:-postgres://${POSTGRES_USER:-galaxie}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-galaxie_sports}}
      # Bearer do /metrics do servidor de operação do scheduler (porta 9464, build_info), igual ao da API
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN (openssl rand -hex 32)}
      SCHEDULER_PROFILE: agents
      SCHEDULER_MAX_JOBS: ${AGENTS_MAX_JOBS:-3}
      SCHEDULER_JOB_HEAP_MB: ${AGENTS_JOB_HEAP_MB:-128}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # heartbeat da checagem de crédito na página de status (Better Stack); vazio = não avisa
      AI_HEARTBEAT_URL: ${AI_HEARTBEAT_URL:-}
      # pesquisa de direitos por temporada com outro provedor (vazio = AI_PROVIDER)
      AI_RIGHTS_PROVIDER: ${AI_RIGHTS_PROVIDER:-}
      AI_RIGHTS_MODEL: ${AI_RIGHTS_MODEL:-}
      # revisão das sugestões de edição da base semântica (padrão gemini, com GEMINI_API_KEY)
      AI_REVIEW_PROVIDER: ${AI_REVIEW_PROVIDER:-gemini}
      AI_REVIEW_MODEL: ${AI_REVIEW_MODEL:-}
      # sobras do casamento da lista de canais do cliente (padrão gemini, com GEMINI_API_KEY)
      AI_CHANNELS_PROVIDER: ${AI_CHANNELS_PROVIDER:-gemini}
      AI_CHANNELS_MODEL: ${AI_CHANNELS_MODEL:-}
      AI_MODEL_LIGHT: ${AI_MODEL_LIGHT:-}
      AI_MODEL_STANDARD: ${AI_MODEL_STANDARD:-}
      AI_MODEL_RESEARCH: ${AI_MODEL_RESEARCH:-}
      AI_STATUS: ${AI_STATUS:-on}
      AI_AGENT_STATUS: ${AI_AGENT_STATUS:-}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-1000000}
      AI_DAILY_USD_BUDGET: ${AI_DAILY_USD_BUDGET:-10}
      AI_AGENT_USD_BUDGETS: ${AI_AGENT_USD_BUDGETS:-}
      AI_AGENT_DEFAULT_USD_BUDGET: ${AI_AGENT_DEFAULT_USD_BUDGET:-}
      # política de execução (#357; vazio = padrão do código; também em Ajustes → Operação → IA): faixas por
      # prioridade em % do teto global, corte P0/P1 e virada do dia de orçamento (06:00 em Brasília)
      AI_BAND_SHARES: ${AI_BAND_SHARES:-}
      AI_P0_MIN_AUDIENCE: ${AI_P0_MIN_AUDIENCE:-}
      AI_BUDGET_DAY_START: ${AI_BUDGET_DAY_START:-}
      AI_BUDGET_TIMEZONE: ${AI_BUDGET_TIMEZONE:-}
      AI_MAX_SEARCHES_PER_CALL: ${AI_MAX_SEARCHES_PER_CALL:-5}
      WTW_MARKETS: ${WTW_MARKETS:-BR,AR,MX,CO,CL,PE,UY,EC}
      WTW_MIN_RELEVANCE: ${WTW_MIN_RELEVANCE:-60}
      WTW_DAILY_USD_PER_MARKET: ${WTW_DAILY_USD_PER_MARKET:-1}
      # canal do jogo: consulta semanal (cron UTC), retentativas só sem canal confirmado e pós-jogo
      # (vazio = padrão do código: "0 6 * * 1", "3d,1d" e "on"; também em Ajustes → Onde assistir)
      WTW_CHANNEL_WEEKLY_CRON: ${WTW_CHANNEL_WEEKLY_CRON:-}
      WTW_CHANNEL_RETRY_OFFSETS: ${WTW_CHANNEL_RETRY_OFFSETS:-}
      WTW_CHANNEL_POST: ${WTW_CHANNEL_POST:-}
      # texto das páginas de planos no prompt da extração da grade (o painel sobrescreve; vazio = padrão)
      LINEUP_PROMPT_MAX_CHARS: ${LINEUP_PROMPT_MAX_CHARS:-}
      LINEUP_PAGE_MAX_CHARS: ${LINEUP_PAGE_MAX_CHARS:-}
      SCHEDULE_RECAP_RUN: ${SCHEDULE_RECAP_RUN:-*/5 * * * *}
      SCHEDULE_CONTEXT_RUN: ${SCHEDULE_CONTEXT_RUN:-10 * * * *}
      SCHEDULE_WTW_RUN: ${SCHEDULE_WTW_RUN:-*/5 * * * *}
      # Conteúdo relacionado: sem chave, o job falha rápido e nada é gravado
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SCHEDULE_RELATED_RUN: ${SCHEDULE_RELATED_RUN:-*/3 * * * *}
      SCHEDULE_WTW_RIGHTS: ${SCHEDULE_WTW_RIGHTS:-40 5,17 * * *}
      # revisita semanal da grade de canais e ofertas pela página oficial (até 4 chamadas ao modelo por execução,
      # extração sem busca só se a página mudou; AI_RIGHTS_PROVIDER vale aqui)
      SCHEDULE_LINEUPS_REVISIT: ${SCHEDULE_LINEUPS_REVISIT:-50 4 * * 1}
      # página oficial do plano lida do nosso lado (sem LLM; cache de 25 dias por URL)
      SCHEDULE_LINEUPS_PAGES: ${SCHEDULE_LINEUPS_PAGES:-20 5 * * *}
      # navegador headless para página que só mostra a grade com JavaScript (vazio = só HTML estático);
      # ex.: ws://lineup-render:3000/ com o serviço do perfil "render" no ar
      LINEUP_RENDER_WS: ${LINEUP_RENDER_WS:-}
    # `render`: só para alcançar o lineup-render, que não entra na rede da stack
    networks: [default, render]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 40s
    logging: *logging

  # Navegador headless para a leitura da página oficial do plano que só mostra a grade com JavaScript
  # (lineups:pages). Fora do padrão: sobe só com `--profile render`, durante a leitura, e cai depois.
  # Imagem própria (infra/lineup-render): a oficial do Playwright com o pacote npm já instalado, sem npx na partida.
  # A tag é a versão do Playwright, a mesma do playwright-core do services/ai-agents (o CI confere). O deploy.sh a
  # constrói na VPS quando a pasta muda; `missing` usa essa e só puxa do GHCR se ela não existir.
  # Sem a imagem própria (fallback): image mcr.microsoft.com/playwright:v1.64.0-noble com
  # command ['npx', '-y', 'playwright@1.64.0', 'run-server', '--port', '3000', '--host', '0.0.0.0'] e
  # working_dir: /home/pwuser, o resto igual.
  # Abre páginas de terceiros: roda como o usuário sem privilégio da imagem (pwuser), com /dev/shm próprio
  # em vez do IPC do host e só na rede `render`, que ele divide com os agents (sem Postgres, Valkey nem S3).
  lineup-render:
    profiles: [render]
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-lineup-render:1.64.0
    pull_policy: missing
    user: pwuser
    init: true
    shm_size: 512m
    mem_limit: 1g
    restart: 'no'
    networks: [render]
    logging: *logging

networks:
  # A rede da stack, a mesma dos três projetos (o nome dos serviços resolve entre eles). Sub-rede fixa 172.30.50.0/24: o
  # Traefik (rede do host) chega aos contêineres pelo gateway 172.30.50.1 = TRUST_PROXY. Criada uma vez, fora dos projetos
  # (migrar-para-tres-projetos.sh preparar). O nome vem de quando a stack era um projeto só: rede não se renomeia, e duas
  # com a mesma sub-rede não coexistem.
  default:
    name: galaxie-sports_default
    external: true
  # Navegador headless (lineup-render) e agents; com saída para a internet, sem os serviços da stack.
  # O host continua alcançável pelo gateway desta rede (Traefik em network_mode: host e outras portas do host).
  render: {}

# Página de manutenção (serviço `maintenance`). Conteúdo inline para ir junto com este arquivo no deploy (a VPS só
# recebe o compose.yml). Aqui `$` precisaria ser `$$` (interpolação do compose): a página e o Caddyfile não usam.
# Editou? Atualize works.galaxie.maintenance-rev no serviço (o compose não recria por mudança só de conteúdo).
configs:
  maintenance-caddyfile:
    content: |
      {
      	admin off
      	persist_config off
      	auto_https off
      }

      (maintenance) {
      	# sem 304 nem 206: a resposta é sempre o 503 inteiro
      	request_header -If-None-Match
      	request_header -If-Modified-Since
      	request_header -Range
      	# POST, PUT etc. também recebem o 503 (o file_server só serve GET/HEAD)
      	@write not method GET HEAD
      	method @write GET
      	header {
      		Retry-After 30
      		Cache-Control no-store
      		X-Robots-Tag noindex
      		-Server
      		-Etag
      		-Last-Modified
      		-Accept-Ranges
      	}
      }

      # host da demo: página HTML
      :8080 {
      	import maintenance
      	root * /srv/site
      	rewrite * /index.html
      	file_server {
      		status 503
      	}
      }

      # host da API: problem+json no formato dos erros da API (apps/api/src/errors.ts)
      :8081 {
      	import maintenance
      	header Content-Type "application/problem+json; charset=utf-8"
      	root * /srv/api
      	rewrite * /problem.json
      	file_server {
      		status 503
      	}
      }
  maintenance-problem:
    content: |
      {"type":"https://docs.galaxie.sports/errors/maintenance","title":"Em manutenção","status":503,"code":"MAINTENANCE","detail":"Estamos atualizando o Galaxie Sports. Tente de novo em 30 segundos.","retry_after":30}
  maintenance-page:
    content: |
      <!doctype html>
      <html lang="pt-BR">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex">
      <meta name="color-scheme" content="dark">
      <meta name="theme-color" content="#0b0f14">
      <title>Em manutenção · Galaxie Sports</title>
      <noscript><meta http-equiv="refresh" content="20"></noscript>
      <style>
      :root{--bg:#0b0f14;--fg:#f1f4f8;--muted:#9aa4b2;--accent:#6c69f2;--ring:#a5a3ff;--border:rgba(255,255,255,.1)}
      *{box-sizing:border-box}
      html,body{height:100%}
      body{margin:0;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 480px at 50% -10%,rgba(108,105,242,.2),transparent 65%),var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
      main{width:100%;max-width:520px;text-align:center}
      .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:40px;text-align:left}
      .brand b{display:block;font-size:18px;letter-spacing:-.01em}
      .brand small{display:block;font-size:12px;color:var(--muted)}
      h1{margin:0 0 12px;font-size:clamp(24px,6vw,32px);line-height:1.2;letter-spacing:-.02em}
      p{margin:0;color:var(--muted)}
      .state{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:8px 16px;border:1px solid var(--border);border-radius:999px;font-size:14px}
      .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-out infinite}
      @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(108,105,242,.7)}100%{box-shadow:0 0 0 10px rgba(108,105,242,0)}}
      @media (prefers-reduced-motion:reduce){.dot{animation:none}}
      .status{margin-top:16px;font-size:14px}
      a{color:var(--ring)}
      .langs{display:grid;gap:4px;margin-top:40px;padding-top:24px;border-top:1px solid var(--border);font-size:14px}
      </style>
      </head>
      <body>
      <main>
      <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="10" fill="#6c69f2"/><ellipse cx="20" cy="20" rx="18" ry="6" fill="none" stroke="#a5a3ff" stroke-width="1.8" transform="rotate(-20 20 20)"/></svg>
      <span><b>Galaxie Sports</b><small>Galactical Sports XP</small></span>
      </div>
      <h1>Estamos atualizando o Galaxie Sports.</h1>
      <p>Volte em instantes: esta página recarrega sozinha quando terminarmos.</p>
      <p class="state" role="status"><span class="dot"></span>Tentando de novo automaticamente…</p>
      <!-- TODO(status): URL da página de status ainda não decidida; preencher o href e tirar o hidden -->
      <p class="status" hidden><a href="">Acompanhe pela página de status</a></p>
      <div class="langs">
      <p lang="en">We're updating Galaxie Sports. Back in a moment.</p>
      <p lang="es">Estamos actualizando Galaxie Sports. Volvemos en unos instantes.</p>
      </div>
      </main>
      <script>
      // a cada 10 s pergunta pela mesma URL; quando não é mais o 503 desta página, o site voltou
      (function () {
        function check() {
          fetch(location.href, { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' })
            .then(function (r) { if (r.status !== 503) location.replace(location.href); else setTimeout(check, 10000); })
            .catch(function () { setTimeout(check, 10000); });
        }
        setTimeout(check, 10000);
      })();
      </script>
      </body>
      </html>
