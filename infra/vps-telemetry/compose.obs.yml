# Projeto `obs` da stack da VPS: Prometheus, Grafana e node-exporter (privados: acesso por túnel SSH). Ritmo próprio: o deploy
# automático não toca aqui. Aplicar: deploy-gh.sh --project obs (gh workflow run deploy.yml -f project=obs);
# docs/runbooks/stack-dados-e-observabilidade.md.
#
# Validar: docker compose -f infra/vps-telemetry/compose.obs.yml --env-file infra/vps-telemetry/env.example config -q

name: galaxie-sports-obs

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  prometheus:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-prometheus:${TAG_PROMETHEUS:?defina TAG_PROMETHEUS}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 192m
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN (openssl rand -hex 32)}
      # Fixos aqui, fora do .env: o .env da VPS passa de um deploy para o outro (o deploy-gh.sh só troca as tags) e ainda
      # traz PROMETHEUS_RETENTION=15d, que agora não vale. 35 dias cobrem a janela de 28 dos SLOs; 2 GB é o teto de
      # proteção do disco (docs/14-slos-e-error-budget.md › Retenção do Prometheus)
      PROMETHEUS_RETENTION: 35d
      PROMETHEUS_RETENTION_SIZE: 2GB
    volumes:
      - promdata:/prometheus
    logging: *logging

  # Uso do disco para o alerta DiskAlmostFull. Sem bind mount do host nem privilégio: o volume promdata (montado só
  # para leitura) fica no disco onde o Docker guarda os volumes (Postgres, backups, Prometheus), e o statfs dele é o
  # desse disco. Só o coletor de sistemas de arquivos; sem porta publicada (o Prometheus raspa pela rede da stack).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    mem_limit: 64m
    command:
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|etc)($$|/)
    volumes:
      - promdata:/data/promdata:ro
    logging: *logging

  grafana:
    image: ${IMAGE_PREFIX:?defina IMAGE_PREFIX}-grafana:${TAG_GRAFANA:?defina TAG_GRAFANA}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    mem_limit: 288m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:3000
      # canais dos alertas (infra/observability/grafana/entrypoint.sh): push no celular para o crítico (ntfy),
      # resumo diário por e-mail e uma issue no GitHub por alerta; vazios = alertas só no Grafana
      ALERT_NTFY_URL: ${ALERT_NTFY_URL:-}
      ALERT_NTFY_TOKEN: ${ALERT_NTFY_TOKEN:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_GITHUB_TOKEN: ${ALERT_GITHUB_TOKEN:-}
      ALERT_GITHUB_REPO: ${ALERT_GITHUB_REPO:-}
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  # A rede da stack, a mesma dos três projetos (o nome dos serviços resolve entre eles). Sub-rede fixa 172.30.50.0/24: o
  # Traefik (rede do host) chega aos contêineres pelo gateway 172.30.50.1 = TRUST_PROXY. Criada uma vez, fora dos projetos
  # (migrar-para-tres-projetos.sh preparar). O nome vem de quando a stack era um projeto só: rede não se renomeia, e duas
  # com a mesma sub-rede não coexistem.
  default:
    name: galaxie-sports_default
    external: true

# Volumes criados uma vez, fora dos projetos: o nome é o de sempre, de quando a stack era um projeto só.
volumes:
  promdata:
    name: galaxie-sports_promdata
    external: true
  grafanadata:
    name: galaxie-sports_grafanadata
    external: true
