# Testes simulados dos alertas: docker run --rm -v "$PWD/infra/observability/prometheus:/w" -w /w \
#   --entrypoint promtool prom/prometheus:v3.15.1 test rules alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: cota abaixo de 20% dispara depois de 5 minutos
    interval: 1m
    input_series:
      - series: 'galaxie_quota_remaining_ratio{api="football"}'
        values: '0.5 0.3 0.19 0.15 0.12 0.10 0.10 0.10 0.10'
      - series: 'galaxie_quota_remaining_ratio{api="basketball"}'
        values: '0.9x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: QuotaBelow20Percent
        exp_alerts: []
      - eval_time: 8m
        alertname: QuotaBelow20Percent
        exp_alerts:
          - exp_labels:
              severity: warning
              api: football
            exp_annotations:
              summary: 'Cota da API football abaixo de 20%'
              description: 'Restam 10% da cota diária de football. Reveja o plano do dia (governor.plan) ou adie BOOTSTRAP/ADHOC.'

  - name: job falhando 3 vezes seguidas
    interval: 1m
    input_series:
      - series: 'galaxie_job_consecutive_failures{job_name="quota-status"}'
        values: '0 1 2 3 3'
      - series: 'galaxie_job_consecutive_failures{job_name="bootstrap-catalog"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: JobFailingRepeatedly
        exp_alerts: []
      - eval_time: 3m
        alertname: JobFailingRepeatedly
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: quota-status
            exp_annotations:
              summary: 'Job quota-status falhou 3 vezes seguidas'
              description: 'Veja ops.job_run (coluna error) e os logs com job=quota-status.'

  - name: evento ao vivo sem atualização por mais de 2 intervalos
    interval: 1m
    input_series:
      - series: 'galaxie_live_poll_interval_seconds{instance="api:8080",job="galaxie-api"}'
        values: '300x20'
      - series: 'galaxie_live_event_max_staleness_seconds{sport="football",coverage="poller",instance="api:8080",job="galaxie-api"}'
        values: '0+60x20'
      - series: 'galaxie_live_event_max_staleness_seconds{sport="basketball",coverage="poller",instance="api:8080",job="galaxie-api"}'
        values: '30x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: LiveEventStale
        exp_alerts: []
      - eval_time: 12m
        alertname: LiveEventStale
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: ao-vivo
              sport: football
            exp_annotations:
              summary: 'Evento ao vivo de football sem atualização há 12m 0s'
              description: 'Mais de 2 intervalos do live poller sem atualização válida. Verifique a cota LIVE e o worker ao vivo.'

  # jogo fora do plano do ao vivo (tier 3 do espelho, esporte sem ao vivo): o relógio o põe em andamento pelo
  # horário e ninguém o atualiza até a reconciliação ou a agenda D-1; não é incidente do ao vivo
  - name: jogo em andamento só pelo relógio não alerta, e não esconde o parado do plano
    interval: 1m
    input_series:
      - series: 'galaxie_live_poll_interval_seconds{instance="api:8080",job="galaxie-api"}'
        values: '300x20'
      - series: 'galaxie_live_event_max_staleness_seconds{sport="volleyball",coverage="clock",instance="api:8080",job="galaxie-api"}'
        values: '54000+60x20'
      - series: 'galaxie_live_event_max_staleness_seconds{sport="football",coverage="clock",instance="api:8080",job="galaxie-api"}'
        values: '54000+60x20'
      - series: 'galaxie_live_event_max_staleness_seconds{sport="football",coverage="poller",instance="api:8080",job="galaxie-api"}'
        values: '30x5 300+60x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: LiveEventStale
        exp_alerts: []
      - eval_time: 12m
        alertname: LiveEventStale
        exp_alerts: []
      - eval_time: 13m
        alertname: LiveEventStale
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: ao-vivo
              sport: football
            exp_annotations:
              summary: 'Evento ao vivo de football sem atualização há 12m 0s'
              description: 'Mais de 2 intervalos do live poller sem atualização válida. Verifique a cota LIVE e o worker ao vivo.'

  - name: backup sem sucesso há mais de 26 horas
    interval: 1m
    input_series:
      - series: 'galaxie_job_last_success_timestamp_seconds{job_name="pg-backup"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: backup-disco
              job_name: pg-backup
            exp_annotations:
              summary: 'Último backup do Postgres com sucesso há 1d 3h 0m 0s'
              description: 'O serviço backup deveria gerar um dump por dia. Veja os logs do container backup.'

  - name: raw do futebol parado há mais de 26 horas
    interval: 1m
    input_series:
      - series: 'galaxie_raw_last_fetched_timestamp_seconds{sport="football"}'
        values: '0x1700'
      - series: 'galaxie_raw_last_fetched_timestamp_seconds{sport="hockey"}'
        values: '0+60x1700'
    alert_rule_test:
      - eval_time: 26h
        alertname: FootballRawStale
        exp_alerts: []
      - eval_time: 27h
        alertname: FootballRawStale
        exp_alerts:
          - exp_labels:
              severity: warning
              sport: football
            exp_annotations:
              summary: 'Nada novo no raw do futebol há 1d 3h 0m 0s'
              description: 'Verifique o job sync-daily (ops.job_run, logs do ingestor) e a cota DAILY.'

  - name: coletor do banco falhando
    interval: 1m
    input_series:
      - series: 'galaxie_metrics_collector_up{collector="quota"}'
        values: '1 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 7m
        alertname: MetricsCollectorDown
        exp_alerts:
          - exp_labels:
              severity: warning
              collector: quota
            exp_annotations:
              summary: 'Coletor de métricas quota falhando'
              description: 'A consulta ao banco para as métricas falha há 5 minutos (banco indisponível?).'

  - name: verificador e ensaio de restauração alertam na 1ª falha, sem repetir o JobFailingRepeatedly
    interval: 1m
    input_series:
      - series: 'galaxie_job_consecutive_failures{job_name="backup-check"}'
        values: '0 1 1 3 3'
      - series: 'galaxie_job_consecutive_failures{job_name="pg-restore-drill"}'
        values: '0 0 1 3 3'
    alert_rule_test:
      - eval_time: 0m
        alertname: BackupCheckFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: BackupCheckFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: backup-disco
              job_name: backup-check
            exp_annotations:
              summary: 'Verificação do backup falhou'
              description: 'Último dump atrasado ou cópia do NAS sem recibo recente. Veja ops.job_run (job backup-check, coluna error) e os logs do container backup.'
      - eval_time: 2m
        alertname: RestoreDrillFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: backup-disco
              job_name: pg-restore-drill
            exp_annotations:
              summary: 'Ensaio de restauração do backup falhou'
              description: 'O dump mais recente não restaurou ou não passou na conferência. Veja ops.job_run (job pg-restore-drill, coluna error) e o runbook docs/runbooks/exercicio-dr.md.'
      - eval_time: 4m
        alertname: JobFailingRepeatedly
        exp_alerts: []

  - name: ensaio de restauração sem sucesso há mais de 35 dias
    # Amostra por minuto: com 1 h entre amostras, a série some fora do lookback de 5 min e o `for: 1h` nunca se cumpre.
    interval: 1m
    input_series:
      - series: 'galaxie_job_last_success_timestamp_seconds{job_name="pg-restore-drill"}'
        values: '0x52000'
    alert_rule_test:
      - eval_time: 34d
        alertname: RestoreDrillStale
        exp_alerts: []
      - eval_time: 36d
        alertname: RestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: pg-restore-drill
            exp_annotations:
              summary: 'Nenhum ensaio de restauração com sucesso há 36d 0h 0m 0s'
              description: 'O ensaio roda no dia RESTORE_DRILL_DAY de cada mês (sem nenhum sucesso, a idade conta do início do verificador). Confira RESTORE_DRILL_DAY e os logs do container backup.'

  # ensaio que nunca teve sucesso: sem a série do último sucesso, conta da 1ª execução do verificador
  - name: ensaio que nunca teve sucesso vira stale 35 dias depois do início do verificador
    interval: 1m
    input_series:
      - series: 'galaxie_job_first_run_timestamp_seconds{job_name="backup-check"}'
        values: '0x52000'
    alert_rule_test:
      - eval_time: 30m
        alertname: RestoreDrillStale
        exp_alerts: []
      - eval_time: 34d
        alertname: RestoreDrillStale
        exp_alerts: []
      - eval_time: 36d
        alertname: RestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: pg-restore-drill
            exp_annotations:
              summary: 'Nenhum ensaio de restauração com sucesso há 36d 0h 0m 0s'
              description: 'O ensaio roda no dia RESTORE_DRILL_DAY de cada mês (sem nenhum sucesso, a idade conta do início do verificador). Confira RESTORE_DRILL_DAY e os logs do container backup.'

  - name: verificador antigo e ensaio com sucesso recente não alertam
    interval: 1m
    input_series:
      - series: 'galaxie_job_first_run_timestamp_seconds{job_name="backup-check"}'
        values: '0x52000'
      - series: 'galaxie_job_last_success_timestamp_seconds{job_name="pg-restore-drill"}'
        values: '0+60x52000'
    alert_rule_test:
      - eval_time: 36d
        alertname: RestoreDrillStale
        exp_alerts: []

  - name: disco acima de 85% por 15 minutos
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",instance="node-exporter:9100",device="/dev/sda1",fstype="ext4",mountpoint="/data/promdata"}'
        values: '1000x30'
      - series: 'node_filesystem_avail_bytes{job="node",instance="node-exporter:9100",device="/dev/sda1",fstype="ext4",mountpoint="/data/promdata"}'
        values: '200x5 100x25'
    alert_rule_test:
      - eval_time: 15m
        alertname: DiskAlmostFull
        exp_alerts: []
      - eval_time: 25m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: backup-disco
              job: node
              instance: node-exporter:9100
              device: /dev/sda1
              fstype: ext4
              mountpoint: /data/promdata
            exp_annotations:
              summary: 'Disco /dev/sda1 com 90% ocupado'
              description: 'Acima de 85%. O ensaio de restauração precisa de 2x o tamanho do banco livre; veja docker system df (sem prune) e os dumps em /backups.'

  - name: node-exporter fora do ar
    interval: 1m
    input_series:
      - series: 'up{job="node",instance="node-exporter:9100"}'
        values: '1 0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: node-exporter:9100
            exp_annotations:
              summary: 'node-exporter fora do ar: sem medida de disco'
              description: 'O alvo node-exporter:9100 não responde há 10 minutos; o alerta DiskAlmostFull fica cego.'

  - name: disco acabando em menos de 3 dias no ritmo atual
    interval: 10m
    input_series:
      # 100 GB de disco, 40 GB livres caindo 1 GB por hora
      - series: 'node_filesystem_avail_bytes{job="node",instance="node-exporter:9100",device="/dev/sda1",fstype="ext4",mountpoint="/data/promdata"}'
        values: '40000000000-166666667x30'
      - series: 'node_filesystem_size_bytes{job="node",instance="node-exporter:9100",device="/dev/sda1",fstype="ext4",mountpoint="/data/promdata"}'
        values: '100000000000x30'
      # disco folgado (80% livre) caindo no mesmo ritmo: não avisa
      - series: 'node_filesystem_avail_bytes{job="node",instance="node-exporter:9100",device="/dev/sdb1",fstype="ext4",mountpoint="/data/outro"}'
        values: '80000000000-166666667x30'
      - series: 'node_filesystem_size_bytes{job="node",instance="node-exporter:9100",device="/dev/sdb1",fstype="ext4",mountpoint="/data/outro"}'
        values: '100000000000x30'
    alert_rule_test:
      - eval_time: 50m
        alertname: DiskFillingUp
        exp_alerts: []
      - eval_time: 2h
        alertname: DiskFillingUp
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: backup-disco
              job: node
              instance: node-exporter:9100
              device: /dev/sda1
              fstype: ext4
              mountpoint: /data/promdata
            exp_annotations:
              summary: 'Disco /dev/sda1 acaba em menos de 3 dias no ritmo atual'
              description: 'O espaço livre cai rápido (tendência das últimas 12 h). Veja galaxie_db_table_bytes (qual tabela cresce), o job data-retention e os dumps em /backups.'

  - name: banco crescendo mais de 1 GiB por dia
    interval: 1h
    input_series:
      - series: 'galaxie_db_database_bytes{job="galaxie-api",instance="api:8080"}'
        values: '5000000000x24 7000000000x6'
    alert_rule_test:
      - eval_time: 23h
        alertname: DatabaseGrowingFast
        exp_alerts: []
      - eval_time: 27h
        alertname: DatabaseGrowingFast
        exp_alerts:
          - exp_labels:
              severity: warning
              job: galaxie-api
              instance: api:8080
            exp_annotations:
              summary: 'Banco cresceu mais de 1 GiB em 24 h'
              description: 'Veja galaxie_db_table_bytes para achar a tabela e se o job data-retention está rodando (docs/runbooks/retencao-de-dados.md).'

  - name: fila do change feed parada
    interval: 1m
    input_series:
      - series: 'galaxie_change_feed_pending_age_seconds{consumer="demo-cache:demo"}'
        values: '0 0 700+60x10'
      - series: 'galaxie_change_feed_pending_age_seconds{consumer="webhooks:default"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: ChangeFeedStalled
        exp_alerts: []
      - eval_time: 8m
        alertname: ChangeFeedStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              consumer: demo-cache:demo
            exp_annotations:
              summary: 'Fila do change feed parada para demo-cache:demo'
              description: 'A mudança pendente mais antiga tem 17m 40s. Veja se o consumidor está no ar (demo, worker de webhooks, API) e o cursor dele.'

  - name: p99 por rota acima de 1 s com tráfego dispara depois de 15 min; rota fria e /internal não
    interval: 1m
    input_series:
      # /v1/events/live: 1 req/s, todas entre 1 e 2,5 s
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events/live",method="GET",status_code="200",le="0.5"}'
        values: '0x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events/live",method="GET",status_code="200",le="1"}'
        values: '0x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events/live",method="GET",status_code="200",le="2.5"}'
        values: '0+60x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events/live",method="GET",status_code="200",le="+Inf"}'
        values: '0+60x40'
      - series: 'galaxie_http_request_duration_seconds_count{route="/v1/events/live",method="GET",status_code="200"}'
        values: '0+60x40'
      # /v1/events/live com status 304: rápido, entra no mesmo p99 da rota
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events/live",method="GET",status_code="304",le="0.5"}'
        values: '0+6x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events/live",method="GET",status_code="304",le="1"}'
        values: '0+6x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events/live",method="GET",status_code="304",le="2.5"}'
        values: '0+6x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events/live",method="GET",status_code="304",le="+Inf"}'
        values: '0+6x40'
      - series: 'galaxie_http_request_duration_seconds_count{route="/v1/events/live",method="GET",status_code="304"}'
        values: '0+6x40'
      # rota fria: lenta, mas 3 req/min (o p99 seria uma requisição só)
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/teams/:id",method="GET",status_code="200",le="1"}'
        values: '0x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/teams/:id",method="GET",status_code="200",le="+Inf"}'
        values: '0+3x40'
      - series: 'galaxie_http_request_duration_seconds_count{route="/v1/teams/:id",method="GET",status_code="200"}'
        values: '0+3x40'
      # admin interno: lento e com tráfego, fora do alerta
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/internal/admin/tenants",method="GET",status_code="200",le="1"}'
        values: '0x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/internal/admin/tenants",method="GET",status_code="200",le="+Inf"}'
        values: '0+60x40'
      - series: 'galaxie_http_request_duration_seconds_count{route="/internal/admin/tenants",method="GET",status_code="200"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: ApiRouteLatencyP99High
        exp_alerts: []
      - eval_time: 25m
        alertname: ApiRouteLatencyP99High
        exp_alerts:
          - exp_labels:
              severity: warning
              route: /v1/events/live
            exp_annotations:
              summary: 'p99 de /v1/events/live acima de 1 s'
              description: 'A rota /v1/events/live tem p99 acima de 1 s há 15 minutos. Veja no Grafana a latência por rota e o galaxie_cache_requests_total (miss/stale).'

  - name: p99 rápido não dispara
    interval: 1m
    input_series:
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events",method="GET",status_code="200",le="0.1"}'
        values: '0+600x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events",method="GET",status_code="200",le="1"}'
        values: '0+600x40'
      - series: 'galaxie_http_request_duration_seconds_bucket{route="/v1/events",method="GET",status_code="200",le="+Inf"}'
        values: '0+600x40'
      - series: 'galaxie_http_request_duration_seconds_count{route="/v1/events",method="GET",status_code="200"}'
        values: '0+600x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiRouteLatencyP99High
        exp_alerts: []

  - name: lacuna do change feed abandonada vai para o resumo
    interval: 1m
    input_series:
      - series: 'galaxie_change_feed_gaps_abandoned_total{consumer="sse",reason="timeout",job="galaxie-api",instance="api:8080"}'
        values: '0 0 0 1 1 1 1 1'
      - series: 'galaxie_change_feed_gaps_abandoned_total{consumer="cache-purge",reason="timeout",job="galaxie-api",instance="api:8080"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: ChangeFeedGapAbandoned
        exp_alerts: []
      - eval_time: 5m
        alertname: ChangeFeedGapAbandoned
        exp_alerts:
          - exp_labels:
              severity: warning
              consumer: sse
              reason: timeout
            exp_annotations:
              summary: 'Lacuna do change feed abandonada (sse, timeout)'
              description: 'O consumidor sse pulou ids do ops.change_feed na última hora. Os ids estão no log da API ("lacuna do change feed abandonada"); transação do ingestor mais longa que 90 s é a causa provável.'

  - name: teto de conexões SSE do processo estourado
    interval: 1m
    input_series:
      - series: 'galaxie_sse_connections_rejected_total{reason="process_limit",job="galaxie-api",instance="api:8080"}'
        values: '0 0 0 7 9 9'
      - series: 'galaxie_sse_connections_rejected_total{reason="tenant_limit",job="galaxie-api",instance="api:8080"}'
        values: '0 5 10 15 20 25'
    alert_rule_test:
      - eval_time: 2m
        alertname: SseProcessLimitReached
        exp_alerts: []
      - eval_time: 4m
        alertname: SseProcessLimitReached
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'Teto de conexões SSE da API atingido'
              description: 'Aberturas do /v1/stream recusadas com 503 nos últimos 15 min. Veja galaxie_sse_connections_open e a memória do contêiner antes de subir SSE_MAX_CONNECTIONS.'

  - name: API fora do ar por 2 minutos
    interval: 1m
    input_series:
      - series: 'up{job="galaxie-api",instance="api:8080"}'
        values: '1 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: ApiDown
        exp_alerts: []
      - eval_time: 3m
        alertname: ApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: api
              job: galaxie-api
              instance: api:8080
            exp_annotations:
              summary: 'API fora do ar para o Prometheus'
              description: 'O alvo api:8080 não responde ao /metrics há 2 minutos.'

  - name: job sem sucesso há mais de 2 intervalos da agenda (piso de 30 min)
    interval: 1m
    input_series:
      # live-run a cada 5 min: o piso de 30 min vale; sem sucesso desde o instante 0
      - series: 'galaxie_job_last_success_timestamp_seconds{job_name="live-run"}'
        values: '0x60'
      - series: 'galaxie_job_expected_interval_seconds{job_name="live-run",component="ingestor"}'
        values: '300x60'
      # nunca teve sucesso: conta da primeira execução; de hora em hora, só depois de 2 h
      - series: 'galaxie_job_first_run_timestamp_seconds{job_name="context-run"}'
        values: '0x60'
      - series: 'galaxie_job_expected_interval_seconds{job_name="context-run",component="agents"}'
        values: '3600x60'
      # fora da agenda (backup tem alerta próprio): sem intervalo esperado, sem alerta
      - series: 'galaxie_job_last_success_timestamp_seconds{job_name="pg-backup"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: JobOverdue
        exp_alerts: []
      - eval_time: 45m
        alertname: JobOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job_name: live-run
              component: ingestor
            exp_annotations:
              summary: 'Job live-run sem sucesso há 45m 0s'
              description: 'Mais de 2 intervalos da agenda sem execução com sucesso. Veja o scheduler ingestor (Ajustes → Sistema), ops.job_run e os logs com job=live-run.'

  - name: scheduler sem relato em ops.runtime_env por mais de 10 minutos
    interval: 1m
    input_series:
      - series: 'galaxie_service_last_report_timestamp_seconds{component="ingestor"}'
        values: '0x30'
      - series: 'galaxie_service_last_report_timestamp_seconds{component="agents"}'
        values: '0+60x30'
      # a API só relata na partida: fora do alerta
      - series: 'galaxie_service_last_report_timestamp_seconds{component="api"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: SchedulerHeartbeatStale
        exp_alerts: []
      - eval_time: 20m
        alertname: SchedulerHeartbeatStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: ingestor
            exp_annotations:
              summary: 'Scheduler ingestor sem sinal de vida há 20m 0s'
              description: 'Nenhum relato em ops.runtime_env. Veja docker compose ps ingestor e os logs; o healthcheck reinicia o contêiner travado (infra/healthcheck/selfheal.mjs).'

  - name: crédito da IA em falha vai para o push
    interval: 1m
    input_series:
      - series: 'galaxie_ai_credit_check{status="pass",provider="gemini"}'
        values: '1 1 _ _ _ _'
      - series: 'galaxie_ai_credit_check{status="fail",provider="gemini"}'
        values: '_ _ 1 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: AiCreditExhausted
        exp_alerts: []
      - eval_time: 4m
        alertname: AiCreditExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: ia
              status: fail
              provider: gemini
            exp_annotations:
              summary: 'IA parada: conta gemini sem crédito ou chave recusada'
              description: 'A checagem horária do crédito falhou (402, cota/billing ou 401/403). Recarregue o saldo ou troque a chave e peça "verificar agora" em Ajustes → Sistema → IA.'

  - name: crédito da IA sem checagem há mais de 3 horas
    interval: 1m
    input_series:
      - series: 'galaxie_ai_credit_checked_timestamp_seconds'
        values: '0x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: AiCreditCheckStale
        exp_alerts: []
      - eval_time: 3h45m
        alertname: AiCreditCheckStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'Crédito da IA sem checagem há 3h 45m 0s'
              description: 'O scheduler dos agentes confere o crédito de hora em hora. Veja se o contêiner agents está no ar.'

  - name: gasto de IA em 80% do teto diário vai para o push; sem teto (unlimited), nada
    interval: 1m
    input_series:
      - series: 'galaxie_ai_spend_usd{budget_day="2026-10-28"}'
        values: '5 7 8 8 8 8 8 8 8 8'
      - series: 'galaxie_ai_daily_budget_usd'
        values: '10x9'
    alert_rule_test:
      - eval_time: 6m
        alertname: AiSpendNearDailyBudget
        exp_alerts: []
      - eval_time: 7m
        alertname: AiSpendNearDailyBudget
        exp_alerts:
          - exp_labels:
              severity: critical
              sinal: ia
            exp_annotations:
              summary: 'Gasto de IA do dia em 80% do teto'
              description: 'Ao bater 100% os agentes ficam sem IA até a virada do dia de orçamento. Veja o gasto por agente em Ajustes → Sistema → IA antes de mexer no teto.'

  - name: sem teto de IA não há alerta de gasto
    interval: 1m
    input_series:
      - series: 'galaxie_ai_spend_usd{budget_day="2026-10-28"}'
        values: '50x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: AiSpendNearDailyBudget
        exp_alerts: []
