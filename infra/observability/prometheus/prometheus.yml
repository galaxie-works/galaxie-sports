# Prometheus do staging: raspa a API (que expõe cota, jobs, frescor e ao vivo lidos do Postgres) e avalia os alertas.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: galaxie-api
    metrics_path: /metrics
    # Token gravado pelo entrypoint a partir de METRICS_TOKEN (vazio = API sem token).
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['api:8080']
        labels:
          service: api

  # Quem não tem API: só o build_info e as métricas do processo (servidor de operação de @galaxie/observability). O
  # ingestor na escala 0 fica como alvo fora do ar, sem alerta: os alertas de up são do job galaxie-api.
  - job_name: galaxie-services
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['webhooks:8080']
        labels:
          service: webhooks
      - targets: ['ingestor:9464']
        labels:
          service: ingestor
      - targets: ['agents:9464']
        labels:
          service: agents

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Disco dos volumes do Docker (alerta DiskAlmostFull); só o coletor de sistemas de arquivos.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
