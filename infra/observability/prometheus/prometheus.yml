# Prometheus do staging: raspa a API (que expõe cota, jobs, frescor e ao vivo lidos do Postgres) e avalia os alertas.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: galaxie-api
    metrics_path: /metrics
    # Token gravado pelo entrypoint a partir de METRICS_TOKEN (vazio = API sem token).
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['api:8080']
        labels:
          service: api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
