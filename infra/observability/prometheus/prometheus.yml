# Prometheus do staging: raspa a API (que expõe cota, jobs, frescor e ao vivo lidos do Postgres) e avalia os alertas.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: galaxie-api
    metrics_path: /metrics
    # Token gravado pelo entrypoint a partir de METRICS_TOKEN (vazio = API sem token).
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['api:8080']
        labels:
          service: api

  # Quem não tem API: só o build_info e as métricas do processo (servidor de operação de @galaxie/observability). O
  # ingestor na escala 0 fica como alvo fora do ar, sem alerta: os alertas de up são do job galaxie-api.
  # O `live` (#535) entra pelo DNS do Docker: cada cópia do serviço é um alvo (`instance` = IP:porta), e uma cópia a
  # mais durante a troca também. Sem o serviço (SCHEDULER_LIVE=internal), o nome não resolve e não há alvo.
  - job_name: galaxie-services
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ['webhooks:8080']
        labels:
          service: webhooks
      - targets: ['ingestor:9464']
        labels:
          service: ingestor
      - targets: ['agents:9464']
        labels:
          service: agents
      # worker da fila de tarefas (#542): worker_tasks_running, worker_task_duration_seconds e build_info
      - targets: ['worker:8080']
        labels:
          service: worker
    dns_sd_configs:
      - names: ['live']
        type: A
        port: 9464
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: live
        target_label: service
        replacement: live

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Disco dos volumes do Docker (alerta DiskAlmostFull); só o coletor de sistemas de arquivos.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
