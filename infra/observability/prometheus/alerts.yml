# Regras de alerta do Galaxie Sports (issue #6). Testadas com `promtool test rules alerts.test.yml`.
# As métricas vêm do /metrics da API, que lê ops.quota_ledger, ops.job_run, raw.api_response, core.event e ops.runtime_*.
#
# Canais (infra/observability/grafana/entrypoint.sh, runbook docs/runbooks/alertas-e-monitoramento.md):
#   severity: critical  push no celular na hora. Só os 5 sinais graves, cada um com o rótulo `sinal`:
#                       api (API fora), ao-vivo (jogo em andamento sem atualização), ia (crédito ou gasto),
#                       backup-disco, deploy (o deploy travado avisa direto do .github/workflows/deploy.yml).
#   severity: warning   resumo diário por e-mail (08:00 de Brasília).
# Alerta novo que não é um desses 5 sinais entra como warning.
groups:
  - name: galaxie-quota
    rules:
      - alert: QuotaBelow20Percent
        expr: galaxie_quota_remaining_ratio < 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Cota da API {{ $labels.api }} abaixo de 20%'
          description: 'Restam {{ $value | humanizePercentage }} da cota diária de {{ $labels.api }}. Reveja o plano do dia (governor.plan) ou adie BOOTSTRAP/ADHOC.'

  - name: galaxie-jobs
    rules:
      # o verificador e o ensaio de restauração têm alerta próprio já na 1ª falha
      - alert: JobFailingRepeatedly
        expr: galaxie_job_consecutive_failures{job_name!~"backup-check|pg-restore-drill"} >= 3
        labels:
          severity: warning
        annotations:
          summary: 'Job {{ $labels.job_name }} falhou {{ $value }} vezes seguidas'
          description: 'Veja ops.job_run (coluna error) e os logs com job={{ $labels.job_name }}.'

      # Job sem sucesso há mais de 2 intervalos da agenda efetiva (painel > env > padrão), com piso de 30 min (job
      # que leva mais que o intervalo pula horários). Job que nunca teve sucesso conta da primeira execução. Job
      # desligado na agenda não tem intervalo e fica de fora; job que nunca rodou: SchedulerHeartbeatStale.
      - alert: JobOverdue
        expr: >-
          (
            time() - (galaxie_job_last_success_timestamp_seconds or galaxie_job_first_run_timestamp_seconds)
          )
          > on(job_name) group_left(component)
          clamp_min(2 * galaxie_job_expected_interval_seconds, 1800)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Job {{ $labels.job_name }} sem sucesso há {{ $value | humanizeDuration }}'
          description: 'Mais de 2 intervalos da agenda sem execução com sucesso. Veja o scheduler {{ $labels.component }} (Ajustes → Sistema), ops.job_run e os logs com job={{ $labels.job_name }}.'

      # Os schedulers (ingestor e agents) relatam o env em ops.runtime_env a cada 30 s: 10 min sem relato = scheduler
      # parado ou sem banco. Com jogo ao vivo, o LiveEventStale (push) dispara antes.
      - alert: SchedulerHeartbeatStale
        expr: time() - galaxie_service_last_report_timestamp_seconds{component=~"ingestor|agents"} > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Scheduler {{ $labels.component }} sem sinal de vida há {{ $value | humanizeDuration }}'
          description: 'Nenhum relato em ops.runtime_env. Veja docker compose ps {{ $labels.component }} e os logs; o healthcheck reinicia o contêiner travado (infra/healthcheck/selfheal.mjs).'

      - alert: BackupStale
        expr: time() - galaxie_job_last_success_timestamp_seconds{job_name="pg-backup"} > 26 * 3600
        for: 10m
        labels:
          severity: critical
          sinal: backup-disco
        annotations:
          summary: 'Último backup do Postgres com sucesso há {{ $value | humanizeDuration }}'
          description: 'O serviço backup deveria gerar um dump por dia. Veja os logs do container backup.'

  # Política de backup e DR: docs/runbooks/exercicio-dr.md.
  - name: galaxie-backup
    rules:
      # backup-check.sh (a cada 6 h): último dump com mais de 26 h ou, com o recibo do NAS ligado, cópia do NAS atrasada.
      - alert: BackupCheckFailed
        expr: galaxie_job_consecutive_failures{job_name="backup-check"} >= 1
        labels:
          severity: critical
          sinal: backup-disco
        annotations:
          summary: 'Verificação do backup falhou'
          description: 'Último dump atrasado ou cópia do NAS sem recibo recente. Veja ops.job_run (job backup-check, coluna error) e os logs do container backup.'

      - alert: RestoreDrillFailed
        expr: galaxie_job_consecutive_failures{job_name="pg-restore-drill"} >= 1
        labels:
          severity: critical
          sinal: backup-disco
        annotations:
          summary: 'Ensaio de restauração do backup falhou'
          description: 'O dump mais recente não restaurou ou não passou na conferência. Veja ops.job_run (job pg-restore-drill, coluna error) e o runbook docs/runbooks/exercicio-dr.md.'

      # Mensal (dia 1): sem sucesso há mais de 35 dias = ensaio parado ou desligado. Ensaio que NUNCA teve sucesso
      # não tem a série do último sucesso; aí a idade conta da 1ª execução do backup-check (job da mesma versão do
      # serviço backup, a cada 6 h), que fica no banco: um deploy novo não alerta antes de 35 dias e um restart do
      # Prometheus não zera a contagem (o `for` é só de 1 h).
      - alert: RestoreDrillStale
        expr: >-
          (time() - galaxie_job_last_success_timestamp_seconds{job_name="pg-restore-drill"} > 35 * 86400)
          or
          (
            label_replace(
              time() - galaxie_job_first_run_timestamp_seconds{job_name="backup-check"} > 35 * 86400,
              "job_name", "pg-restore-drill", "job_name", ".*"
            )
            unless on() galaxie_job_last_success_timestamp_seconds{job_name="pg-restore-drill"}
          )
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Nenhum ensaio de restauração com sucesso há {{ $value | humanizeDuration }}'
          description: 'O ensaio roda no dia RESTORE_DRILL_DAY de cada mês (sem nenhum sucesso, a idade conta do início do verificador). Confira RESTORE_DRILL_DAY e os logs do container backup.'

  # Conta da IA (services/ingestor/src/scheduler/ai-credit.ts, de hora em hora) e gasto do dia contra o teto global.
  - name: galaxie-ai
    rules:
      - alert: AiCreditExhausted
        expr: galaxie_ai_credit_check{status="fail"} == 1
        for: 1m
        labels:
          severity: critical
          sinal: ia
        annotations:
          summary: 'IA parada: conta {{ $labels.provider }} sem crédito ou chave recusada'
          description: 'A checagem horária do crédito falhou (402, cota/billing ou 401/403). Recarregue o saldo ou troque a chave e peça "verificar agora" em Ajustes → Sistema → IA.'

      - alert: AiCreditCheckStale
        expr: time() - galaxie_ai_credit_checked_timestamp_seconds > 3 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Crédito da IA sem checagem há {{ $value | humanizeDuration }}'
          description: 'O scheduler dos agentes confere o crédito de hora em hora. Veja se o contêiner agents está no ar.'

      # Teto global (AI_DAILY_USD_BUDGET efetivo; unlimited = sem a série, sem alerta). O dia vira às 06:00 de
      # Brasília (AI_BUDGET_DAY_START): o alerta resolve sozinho na virada.
      - alert: AiSpendNearDailyBudget
        expr: max(galaxie_ai_spend_usd) / max(galaxie_ai_daily_budget_usd) >= 0.8
        for: 5m
        labels:
          severity: critical
          sinal: ia
        annotations:
          summary: 'Gasto de IA do dia em {{ $value | humanizePercentage }} do teto'
          description: 'Ao bater 100% os agentes ficam sem IA até a virada do dia de orçamento. Veja o gasto por agente em Ajustes → Sistema → IA antes de mexer no teto.'

  - name: galaxie-freshness
    rules:
      # O sync diário (00:05 UTC) grava ao menos a agenda do dia no raw; 26 h sem nada novo = sync parado.
      - alert: FootballRawStale
        expr: time() - galaxie_raw_last_fetched_timestamp_seconds{sport="football"} > 26 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Nada novo no raw do futebol há {{ $value | humanizeDuration }}'
          description: 'Verifique o job sync-daily (ops.job_run, logs do ingestor) e a cota DAILY.'

  - name: galaxie-live
    rules:
      # O intervalo esperado é um placeholder (LIVE_POLL_INTERVAL_SECONDS) até o Live Scheduler publicar o intervalo dinâmico.
      # Só os jogos do plano do ao vivo (coverage="poller"): os que o relógio põe em andamento pelo horário
      # (fora do catálogo, esporte sem ao vivo) não têm quem os atualize até a reconciliação ou a agenda D-1.
      - alert: LiveEventStale
        expr: >-
          max by (sport) (galaxie_live_event_max_staleness_seconds{coverage="poller"})
          > on() group_left()
          2 * max(galaxie_live_poll_interval_seconds)
        for: 1m
        labels:
          severity: critical
          sinal: ao-vivo
        annotations:
          summary: 'Evento ao vivo de {{ $labels.sport }} sem atualização há {{ $value | humanizeDuration }}'
          description: 'Mais de 2 intervalos do live poller sem atualização válida. Verifique a cota LIVE e o worker ao vivo.'

  - name: galaxie-platform
    rules:
      - alert: ApiDown
        expr: up{job="galaxie-api"} == 0
        for: 2m
        labels:
          severity: critical
          sinal: api
        annotations:
          summary: 'API fora do ar para o Prometheus'
          description: 'O alvo {{ $labels.instance }} não responde ao /metrics há 2 minutos.'

      # Disco onde o Docker guarda os volumes (Postgres, backups, Prometheus), medido pelo node-exporter.
      - alert: DiskAlmostFull
        expr: >-
          1 - node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"} > 0.85
        for: 15m
        labels:
          severity: critical
          sinal: backup-disco
        annotations:
          summary: 'Disco {{ $labels.device }} com {{ $value | humanizePercentage }} ocupado'
          description: 'Acima de 85%. O ensaio de restauração precisa de 2x o tamanho do banco livre; veja docker system df (sem prune) e os dumps em /backups.'

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'node-exporter fora do ar: sem medida de disco'
          description: 'O alvo {{ $labels.instance }} não responde há 10 minutos; o alerta DiskAlmostFull fica cego.'

      # Tendência do disco (lote 6): no ritmo das últimas 12 h, acaba em menos de 3 dias. Só com menos da metade
      # livre, para um dump grande e passageiro não acordar ninguém com o disco folgado.
      - alert: DiskFillingUp
        expr: >-
          predict_linear(node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}[12h], 3 * 86400) < 0
          and node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay"} < 0.5
        for: 1h
        labels:
          severity: critical
          sinal: backup-disco
        annotations:
          summary: 'Disco {{ $labels.device }} acaba em menos de 3 dias no ritmo atual'
          description: 'O espaço livre cai rápido (tendência das últimas 12 h). Veja galaxie_db_table_bytes (qual tabela cresce), o job data-retention e os dumps em /backups.'

      # O banco cresceu mais de 1 GiB em 24 h: o normal é bem menos (o raw do ao vivo fica 30 dias). Uma rodada de
      # sincronização NAS → produção também dispara, por isso é só aviso.
      - alert: DatabaseGrowingFast
        expr: delta(galaxie_db_database_bytes[24h]) > 1073741824
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Banco cresceu mais de 1 GiB em 24 h'
          description: 'Veja galaxie_db_table_bytes para achar a tabela e se o job data-retention está rodando (docs/runbooks/retencao-de-dados.md).'

      # Consumidor do ops.change_feed (cache da demo, webhooks, purge do cache da API) com mudança pendente há mais de 10 min.
      - alert: ChangeFeedStalled
        expr: galaxie_change_feed_pending_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Fila do change feed parada para {{ $labels.consumer }}'
          description: 'A mudança pendente mais antiga tem {{ $value | humanizeDuration }}. Veja se o consumidor está no ar (demo, worker de webhooks, API) e o cursor dele.'

      - alert: MetricsCollectorDown
        expr: galaxie_metrics_collector_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Coletor de métricas {{ $labels.collector }} falhando'
          description: 'A consulta ao banco para as métricas falha há 5 minutos (banco indisponível?).'

      # p95 das rotas de cliente (fora /metrics, /health, /internal) e só com tráfego: ≥ 0,2 req/s, ~60 requisições na
      # janela. Abaixo disso o cache de 10 s do ao vivo nunca está quente e o p95 é a requisição mais lenta da janela
      # (#450: 0,03 req/s em jogo ao vivo, cada /v1/events/live montado do zero). Rota lenta com pouco tráfego fica
      # com o ApiRouteLatencyP99High e o SLO de 1 s.
      - alert: ApiLatencyP95High
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(galaxie_http_request_duration_seconds_bucket{route!~"/metrics|/health.*|/internal/.*|unmatched"}[5m]))
          ) > 0.15
          and on ()
          sum(rate(galaxie_http_request_duration_seconds_count{route!~"/metrics|/health.*|/internal/.*|unmatched"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'p95 da API acima de 150 ms'
          description: 'p95 atual: {{ $value | humanizeDuration }} (NFR: ≤ 150 ms com cache quente).'

      # p99 por rota (o p95 acima mistura todas): uma rota quente que ficou lenta (placar ao vivo sem cache, consulta
      # sem índice) aparece mesmo com o resto rápido. Só rota com tráfego (≥ 30 req/min, para o p99 não ser uma
      # requisição só), fora /metrics, /health e /internal, e por 15 min seguidos.
      - alert: ApiRouteLatencyP99High
        expr: >-
          histogram_quantile(0.99,
            sum by (route, le) (rate(galaxie_http_request_duration_seconds_bucket{route!~"/metrics|/health.*|/internal/.*|unmatched"}[10m]))
          ) > 1
          and on (route)
          sum by (route) (rate(galaxie_http_request_duration_seconds_count{route!~"/metrics|/health.*|/internal/.*|unmatched"}[10m])) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'p99 de {{ $labels.route }} acima de 1 s'
          description: 'A rota {{ $labels.route }} tem p99 acima de 1 s há 15 minutos. Veja no Grafana a latência por rota e o galaxie_cache_requests_total (miss/stale).'

      # O GapCursor desistiu de um id do change feed (venceu os 90 s e continuou faltando na releitura, ou a
      # proteção de memória): o SSE ou o purge do cache podem ter perdido mudanças. Uma transação revertida também
      # abre lacuna, então isto vai para o resumo, não para o push.
      - alert: ChangeFeedGapAbandoned
        expr: sum by (consumer, reason) (increase(galaxie_change_feed_gaps_abandoned_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Lacuna do change feed abandonada ({{ $labels.consumer }}, {{ $labels.reason }})'
          description: 'O consumidor {{ $labels.consumer }} pulou ids do ops.change_feed na última hora. Os ids estão no log da API ("lacuna do change feed abandonada"); transação do ingestor mais longa que 90 s é a causa provável.'

      # Teto de streams SSE do processo (SSE_MAX_CONNECTIONS) estourou: clientes receberam 503.
      - alert: SseProcessLimitReached
        expr: sum(increase(galaxie_sse_connections_rejected_total{reason="process_limit"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Teto de conexões SSE da API atingido'
          description: 'Aberturas do /v1/stream recusadas com 503 nos últimos 15 min. Veja galaxie_sse_connections_open e a memória do contêiner antes de subir SSE_MAX_CONNECTIONS.'
