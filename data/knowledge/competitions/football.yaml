# Base semântica — competições de futebol (schema v1)
# Arquivo compartilhado: outros mercados (Europa, etc.) devem apenas acrescentar
# itens à lista `competitions`. Agrupe por bloco com um comentário de seção.
# api_sports_league_id só quando verificado (fontes: arquivos públicos que referenciam
# media.api-sports.io/football/leagues/<id>.png); caso contrário null. Os IDs daqui são os
# mesmos do catálogo (config/competitions/football.yaml), conferido no /leagues em out/2026.
# Revisão (out/2026, docs/06 §2): nome, rótulos, apelidos e troféu conferidos nas fontes de
# cada item; apelido sem fonte foi retirado. A API só serve o perfil no piso editorial.
