# yaml-language-server: $schema=../schemas/i18n.schema.json
#
# Chile: hinchada, chancho, jote e a "talla" (brincadeira) chilena. Só os campos que mudam; o resto
# cai no es de i18n/es.yaml (docs/06 §3.3).
schema_version: 1
locale: es-CL

teams:
  - slug: palmeiras
    identity:
      - "Fundado por inmigrantes italianos como Palestra Italia; adoptó el nombre Palmeiras en 1942."
      - "El apodo Porco («chancho» en portugués) partió como una talla de los rivales y la propia hinchada lo adoptó."
      - "En 2026 el estadio pasó a llamarse Nubank Parque (antes Allianz Parque) por un contrato de naming rights."
    mascot: Porco (chancho)
    review_status: approved

  - slug: flamengo
    identity:
      - "Nació como club de remo en 1895, en Río de Janeiro."
      - "El Urubu (un jote), que los rivales usaban para tirarles tallas, fue adoptado por la hinchada en 1969."
    mascot: Urubu (jote)
    review_status: approved

  - slug: fluminense
    identity:
      - "Fundado el 21 de julio de 1902 en una reunión en el barrio de Flamengo, con sede en Laranjeiras desde octubre de ese año; campeón de la Copa Libertadores 2023."
      - "El apodo Pó de Arroz (polvo de arroz), que partió como talla en 1914, fue resignificado por la hinchada."
      - "Su mascota actual es el Guerreirinho (pequeño guerrero), adoptado en 2016; el Cartola (sombrero de copa) sigue siendo una figura tradicional del club."
    review_status: approved

  - slug: atletico-mineiro
    identity:
      - "Fundado en 1908 en Belo Horizonte; campeón de la Copa Libertadores 2013, cuando el lema Eu acredito («Yo creo») prendió a toda la hinchada."
    review_status: approved

derbies:
  - slug: classico-da-amizade
    origin: "Nombre que le dio la prensa por la buena relación histórica entre las dos hinchadas."
    review_status: approved

  - slug: classico-do-povo
    origin: "Reúne a las dos hinchadas más grandes de Brasil."
    review_status: approved
