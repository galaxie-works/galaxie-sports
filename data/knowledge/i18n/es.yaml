  # ── basketball/derbies/nba.yaml ──────────────────────────────────────────────────────────────────
  - slug: basketball-lakers-celtics
    origin: "Las dos franquicias más ganadoras de la NBA se enfrentaron por primera vez en una final en 1959."
    trivia:
      - "Es el duelo más repetido en finales de la NBA: 12 series por el título, 9 ganadas por Boston y 3 por Los Ángeles."
      - "La rivalidad Magic Johnson × Larry Bird reavivó el clásico en la década de 1980, con finales en 1984, 1985 y 1987."
      - "En 2010, los Lakers vencieron a los Celtics en el séptimo partido de la final, con Kobe Bryant elegido MVP de las finales."
    review_status: draft

  - slug: basketball-celtics-76ers
    origin: "Rivalidad de la Conferencia Este marcada por los duelos Bill Russell × Wilt Chamberlain en la década de 1960."
    trivia:
      - "Las dos franquicias suman 23 series de playoffs entre sí, uno de los enfrentamientos más frecuentes de la historia de la NBA."
      - "Larry Bird y Julius Erving protagonizaron finales del Este en 1981 y 1985, ambas ganadas por Boston."
    review_status: draft

  - slug: basketball-bulls-pistons
    origin: "Cobró fuerza entre 1988 y 1991, cuando los «Bad Boys» de Detroit y el Chicago de Michael Jordan se cruzaron en cuatro playoffs seguidos."
    trivia:
      - "Detroit eliminó a Chicago en 1988, 1989 y 1990; en 1991 los Bulls barrieron a los Pistons por 4 a 0 y conquistaron su primer título."
      - "Las «Jordan Rules» fueron la estrategia defensiva de Detroit para contener a Michael Jordan."
    review_status: draft

  # ── football/derbies/europe.yaml ─────────────────────────────────────────────────────────────────
  - slug: el-clasico
    origin: "Nombre que se da a cualquier partido entre Barcelona y Real Madrid; originalmente solo los de la Liga española, hoy todas las competiciones."
    trivia:
      - "El primer enfrentamiento fue en 1902."
      - "En 2025-26, un Clásico definió matemáticamente el título de LaLiga para el Barcelona."
    review_status: draft

  - slug: derbi-madrileno
    origin: "Nombre de los partidos entre Real Madrid y Atlético de Madrid, los dos grandes clubes de la capital española."
    review_status: draft

  - slug: derbi-sevillano
    origin: "Clásico municipal de Sevilla entre Sevilla y Real Betis, también llamado «El Gran Derbi»."
    trivia:
      - "El primer derbi terminó con victoria del Sevilla por 4–3."
      - "El primer partido oficial fue el 19 de febrero de 1928, por la Copa del Rey."
    review_status: draft

  - slug: derbi-vasco
    origin: "Clásico entre los dos mayores clubes del País Vasco, Athletic Club (Bilbao) y Real Sociedad (San Sebastián)."
    trivia:
      - "Se disputó por primera vez en abril de 1909."
      - "Ambos se enfrentaron en la final de la Copa del Rey de 2020."
    review_status: draft

  - slug: derby-della-madonnina
    origin: "El nombre rinde homenaje a la estatua de la Madonnina en lo alto del Duomo de Milán."
    trivia:
      - "El primer derbi fue la final de la Chiasso Cup de 1908, en Suiza; el Milan ganó por 2–1."
      - "Ambos clubes comparten el estadio San Siro."
    review_status: draft

  - slug: derby-ditalia
    origin: "Término acuñado en 1967 por el periodista italiano Gianni Brera para el enfrentamiento entre Inter y Juventus."
    review_status: draft

  - slug: derby-della-capitale
    origin: "Clásico municipal de Roma entre Lazio y Roma, que comparten el Stadio Olimpico."
    trivia:
      - "El primer derbi terminó 1–0 a favor de la Roma."
      - "La Lazio ganó su primer derbi el 23 de octubre de 1932."
    review_status: draft

  - slug: derby-della-mole
    origin: "El nombre viene de la Mole Antonelliana, símbolo arquitectónico de Turín."
    trivia:
      - "Es el derbi municipal más antiguo que aún se disputa en el fútbol italiano."
      - "Fue el primer partido oficial de la historia del Torino."
    review_status: draft

  - slug: der-klassiker
    origin: "Nombre que se da a los partidos entre Bayern de Múnich y Borussia Dortmund, dos de los clubes más ganadores de Alemania."
    trivia:
      - "El primer partido terminó 2–0 a favor del Dortmund, en Múnich."
      - "Ambos disputaron la final de la Liga de Campeones de 2013."
    review_status: draft

  - slug: revierderby
    origin: "El nombre viene de «Revier», forma corta de «Bergbaurevier» (región minera), como se llama al Ruhr."
    trivia:
      - "En el primer encuentro, el Schalke ganó por 4–2."
    review_status: draft

  - slug: le-classique
    origin: "La mayor rivalidad del fútbol francés, entre Paris Saint-Germain y Olympique de Marseille."
    trivia:
      - "El primer encuentro fue en el Stade Vélodrome, con victoria del Marseille por 4–2."
      - "La primera victoria del PSG en Marsella no llegó hasta el 8 de diciembre de 1979."
    review_status: draft

  - slug: choc-des-olympiques
    origin: "Rivalidad entre los dos grandes clubes franceses con «Olympique» en el nombre, Lyon y Marseille."
    trivia:
      - "El primer encuentro terminó 1–1."
      - "La prensa francesa popularizó el apodo «Olympico», en referencia a El Clásico."
    review_status: draft

  - slug: north-london-derby
    origin: "La rivalidad comenzó en 1913, cuando el Arsenal se mudó de Woolwich al norte de Londres."
    trivia:
      - "El primer encuentro, en 1887, fue un amistoso, cuando el Arsenal todavía se llamaba Royal Arsenal."
      - "El primer partido de liga fue el 4 de diciembre de 1909, con victoria del Arsenal por 1–0."
    review_status: draft

  - slug: merseyside-derby
    origin: "Clásico de la ciudad de Liverpool entre Everton y Liverpool, el derbi de élite más antiguo de Inglaterra."
    trivia:
      - "Se disputa sin interrupción en primera división desde la temporada 1962-63."
      - "Anfield y Goodison Park estaban a menos de una milla, separados por Stanley Park."
    review_status: draft

  - slug: manchester-derby
    origin: "Clásico entre Manchester City y Manchester United, disputado desde 1881."
    trivia:
      - "El primer partido reunió a St. Mark's (futuro City) y Newton Heath (futuro United)."
      - "El primer derbi con iluminación artificial fue el 26 de febrero de 1889."
    review_status: draft

  - slug: north-west-derby
    origin: "Rivalidad entre Liverpool y Manchester United, considerada por jugadores y aficionados más grande incluso que los derbis locales de cada club."
    trivia:
      - "El primer encuentro fue un partido de desempate (test match) de la Football League en 1894."
    review_status: draft

  - slug: tyne-wear-derby
    origin: "Derbi del noreste de Inglaterra entre Newcastle United y Sunderland, ciudades casi contiguas."
    trivia:
      - "El primer encuentro fue en 1883."
    review_status: draft

  - slug: o-classico
    origin: "Nombre que se da a los partidos entre Benfica y Porto, los dos clubes portugueses más ganadores en competiciones europeas."
    trivia:
      - "El primer partido fue una exhibición ganada por el Benfica por 8–2."
      - "A pesar de los siete títulos europeos que suman entre ambos, nunca se enfrentaron en una competición europea."
    review_status: draft

  - slug: derby-de-lisboa
    origin: "La rivalidad nació en 1907, cuando ocho jugadores del Benfica se pasaron al Sporting antes del primer derbi."
    trivia:
      - "Se considera el mayor derbi del fútbol portugués."
    review_status: draft

  - slug: de-klassieker
    origin: "Clásico entre Ajax (Ámsterdam) y Feyenoord (Róterdam), los dos mayores clubes de las dos mayores ciudades de los Países Bajos."
    trivia:
      - "El primer encuentro fue en Róterdam."
    review_status: draft

  # ── volleyball/derbies/br.yaml ───────────────────────────────────────────────────────────────────
  - slug: volleyball-classico-mineiro-masculino
    origin: "Duelo de los dos principales equipos masculinos de Minas Gerais, disputado en la Superliga y en el Campeonato Mineiro."
    trivia:
      - "Según Flashscore, Sada Cruzeiro y Minas jugaron 12 finales seguidas del Campeonato Mineiro masculino, todas ganadas por el Cruzeiro."
      - "En 2013, el Sada Cruzeiro venció al Minas por 3 a 2 en Contagem y cortó una racha de nueve victorias del rival."
    review_status: draft

  - slug: volleyball-minas-praia-clube
    origin: "Rivalidad entre Belo Horizonte y Uberlândia que se convirtió en la final más frecuente de la Superliga femenina; la prensa llama a la definición «final pão de queijo»."
    trivia:
      - "El clásico definió la Superliga femenina en cinco temporadas seguidas, de 2018-19 a 2023-24 (la de 2019-20 fue cancelada)."
      - "Hasta abril de 2026, los equipos habían disputado 31 finales desde 2013, con 21 títulos del Minas y 10 del Praia."
      - "En la final de 2025-26, en el Ibirapuera, el Praia Clube ganó por 3 a 0 y conquistó su tercer título de la Superliga."
    review_status: draft
