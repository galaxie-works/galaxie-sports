# yaml-language-server: $schema=../schemas/i18n.schema.json
#
# Colômbia: hinchada (e barra para o grupo organizado), marrano, gallinazo. Só os campos que mudam;
# o resto cai no es de i18n/es.yaml (docs/06 §3.3).
schema_version: 1
locale: es-CO

teams:
  - slug: palmeiras
    identity:
      - "Fundado por inmigrantes italianos como Palestra Italia; adoptó el nombre Palmeiras en 1942."
      - "El apodo Porco (marrano, en portugués) nació como una burla de los rivales y la hinchada lo adoptó con orgullo."
      - "En 2026 el estadio pasó a llamarse Nubank Parque (antes Allianz Parque) por un contrato de naming rights."
    mascot: Porco (marrano)
    review_status: draft

  - slug: flamengo
    identity:
      - "Nació como club de remo en 1895, en Río de Janeiro."
      - "El Urubu (un gallinazo), que los rivales usaban como burla, fue adoptado por la hinchada en 1969."
    mascot: Urubu (gallinazo)
    review_status: draft

  - slug: fluminense
    identity:
      - "Fundado en 1902 en el barrio de Laranjeiras; campeón de la Copa Libertadores 2023."
      - "El apodo Pó de Arroz (polvo de arroz), nacido como burla en 1914, fue resignificado por la hinchada."
    review_status: draft

  - slug: atletico-mineiro
    identity:
      - "Fundado en 1908 en Belo Horizonte; campeón de la Copa Libertadores 2013, cuando el lema Eu acredito («Yo creo») impulsó a toda la barra."
    review_status: draft

derbies:
  - slug: classico-da-amizade
    origin: "Nombre dado por la prensa por la buena relación histórica entre las dos hinchadas."
    review_status: draft

  - slug: classico-do-povo
    origin: "Reúne a las dos hinchadas más grandes de Brasil."
    review_status: draft
