  - brazil-nt
  - argentina-nt
  scope: international
  intensity: 5
  first_match: null
  origin: Rivalidade entre as seleções de Brasil e Argentina, descrita pela FIFA como a "essência da rivalidade no futebol".
  trivia:
  - O primeiro jogo entre as seleções foi em 1914.
  - '"Superclásico de las Américas" também foi o nome de um torneio amistoso entre as duas, disputado a partir de 2011, sucessor da Copa Roca.'
  - O primeiro encontro em Copas do Mundo foi em 1974.
  sources:
  - https://en.wikipedia.org/wiki/Argentina%E2%80%93Brazil_football_rivalry
  - https://pt.wikipedia.org/wiki/Rivalidade_entre_Argentina_e_Brasil_no_futebol
  - https://es.wikipedia.org/wiki/Cl%C3%A1sico_sudamericano
  - https://en.wikipedia.org/wiki/Supercl%C3%A1sico_de_las_Am%C3%A9ricas
