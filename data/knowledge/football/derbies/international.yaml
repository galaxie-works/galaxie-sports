- slug: superclasico-de-las-americas
  name: Superclásico de las Américas
  aliases:
  - Clásico sudamericano
  - Superclássico das Américas
  - Brasil x Argentina
  - South American derby
  labels: {pt-BR: Brasil x Argentina, es: Superclásico de las Américas, en: Argentina–Brazil rivalry}
