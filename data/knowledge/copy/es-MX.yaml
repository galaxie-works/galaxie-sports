# Biblioteca de copy — México (es-MX). Ver docs/06 §4 e data/knowledge/SCHEMA.md.
# Padrões naturais: "le voy al…", "¿a quién le vas?", "Liguilla" (fase final). Identidade forte só com
# relação estabelecida (afinidade declarada). Liga MX não tem rebaixamento hoje: sem copy de relegation.
# Placeholders: {team}, {nickname}, {rival}, {minutes}. Todos os templates nascem draft até revisão nativa.
schema_version: 1
locale: es-MX
sport: football
templates:
  # ------------------------------------------------------------------ inform
  - { key: inform-1, intent: inform, tone: 1, template: "Próximo partido: {team}", confidence: HIGH, review_status: draft }
  - { key: inform-1-today, intent: inform, tone: 1, momentum: today, template: "Hoy juega {team}", confidence: HIGH, review_status: draft }
  - { key: inform-1-d1, intent: inform, tone: 1, momentum: D-1, template: "Mañana juega {team}", confidence: HIGH, review_status: draft }
  - { key: inform-1-t30, intent: inform, tone: 1, momentum: T-30, template: "{team} juega en {minutes} minutos", confidence: HIGH, review_status: draft }
  - { key: inform-1-live, intent: inform, tone: 1, momentum: live, template: "{team} está jugando en este momento", confidence: HIGH, review_status: draft }
  - { key: inform-2-today, intent: inform, tone: 2, momentum: today, template: "Hoy hay partido de {team}", confidence: HIGH, review_status: draft }
  - { key: inform-2-derby, intent: inform, tone: 2, competition_context: derby, template: "Hoy hay clásico: {team} vs. {rival}", confidence: HIGH, review_status: draft }
  # ------------------------------------------------------------------ anticipate
  - { key: anticipate-1-d1, intent: anticipate, tone: 1, momentum: D-1, template: "Mañana hay partido de {team}", confidence: HIGH, review_status: draft }
  - { key: anticipate-2-today, intent: anticipate, tone: 2, momentum: today, template: "Hoy juega {team}. ¿Ya tienes plan?", confidence: HIGH, review_status: draft }
  - { key: anticipate-2-t60, intent: anticipate, tone: 2, momentum: T-60, template: "En {minutes} minutos juega {team}", confidence: HIGH, review_status: draft }
  - { key: anticipate-3-today, intent: anticipate, tone: 3, momentum: today, template: "¡Hoy juega {team}! Tú ya sabes a quién le vas", confidence: MEDIUM, review_status: draft }
  - { key: anticipate-3-d1, intent: anticipate, tone: 3, momentum: D-1, template: "Mañana juega {team}. ¡Ya se siente!", confidence: MEDIUM, review_status: draft }
  - { key: anticipate-4-today, intent: anticipate, tone: 4, momentum: today, template: "¡Hoy es día de {nickname}! ¡Vamos!", confidence: HIGH, review_status: draft }
  # ------------------------------------------------------------------ cheer
  - { key: cheer-2, intent: cheer, tone: 2, template: "¡Suerte, {team}!", confidence: HIGH, review_status: draft }
  - { key: cheer-3, intent: cheer, tone: 3, template: "¡Vamos, {team}!", confidence: HIGH, review_status: draft }
  - { key: cheer-3-nickname, intent: cheer, tone: 3, template: "¡Arriba, {nickname}!", confidence: HIGH, review_status: draft }
  - { key: cheer-3-derby, intent: cheer, tone: 3, competition_context: derby, template: "{team} vs. {rival}: hoy es clásico. ¡Vamos, {nickname}!", confidence: HIGH, review_status: draft }
  - { key: cheer-4, intent: cheer, tone: 4, template: "¡Con todo, {nickname}! ¡A dejar el alma!", confidence: MEDIUM, review_status: draft }
  - { key: cheer-4-final, intent: cheer, tone: 4, competition_context: final, template: "¡Es la final! ¡Vamos con todo, {nickname}!", confidence: HIGH, review_status: draft }
  # ------------------------------------------------------------------ rivalry (rival declarado)
  - { key: rivalry-1, intent: rivalry, tone: 1, affinity_type: rival, affinity_source: explicit, template: "Hoy juega {rival}, tu rival", confidence: HIGH, review_status: draft }
  - { key: rivalry-2, intent: rivalry, tone: 2, affinity_type: rival, affinity_source: explicit, template: "Juega {rival}. ¿Le vas a echar un ojo?", confidence: MEDIUM, review_status: draft }
  - { key: rivalry-3, intent: rivalry, tone: 3, affinity_type: rival, affinity_source: explicit, template: "Juega {rival}. Ya sabes a quién le vas hoy", confidence: MEDIUM, review_status: draft }
  # ------------------------------------------------------------------ urgency
  - { key: urgency-1-t10, intent: urgency, tone: 1, momentum: T-10, template: "{team} juega en {minutes} minutos", confidence: HIGH, review_status: draft }
  - { key: urgency-2-starting, intent: urgency, tone: 2, momentum: starting, template: "Ya empieza el partido de {team}", confidence: HIGH, review_status: draft }
  - { key: urgency-2-live, intent: urgency, tone: 2, momentum: live, template: "{team} juega ahora. Síguelo en vivo", confidence: HIGH, review_status: draft }
  - { key: urgency-3-starting, intent: urgency, tone: 3, momentum: starting, template: "¡Ya empieza! ¡Vamos, {nickname}!", confidence: HIGH, review_status: draft }
  - { key: urgency-4-starting, intent: urgency, tone: 4, momentum: starting, template: "¡Arrancamos! ¡Con todo, {nickname}!", confidence: MEDIUM, review_status: draft }
  # ------------------------------------------------------------------ decisive
  - { key: decisive-1, intent: decisive, tone: 1, template: "Partido decisivo hoy: juega {team}", confidence: HIGH, review_status: draft }
  - { key: decisive-2-final, intent: decisive, tone: 2, competition_context: final, template: "Final hoy: {team} va por el título", confidence: HIGH, review_status: draft }
  - { key: decisive-2-playoff, intent: decisive, tone: 2, competition_context: playoff, template: "Es Liguilla: hoy juega {team}", confidence: MEDIUM, review_status: draft }
  - { key: decisive-3, intent: decisive, tone: 3, template: "Partido grande hoy. ¡Vamos, {nickname}!", confidence: HIGH, review_status: draft }
  - { key: decisive-3-playoff, intent: decisive, tone: 3, competition_context: playoff, template: "¡Es Liguilla! ¡Arriba, {nickname}!", confidence: MEDIUM, review_status: draft }
  - { key: decisive-3-title, intent: decisive, tone: 3, competition_context: title, template: "Hoy se puede ganar el título. ¡Vamos, {nickname}!", confidence: HIGH, review_status: draft }
  - { key: decisive-4-final, intent: decisive, tone: 4, competition_context: final, template: "¡Final! ¡A dejar todo en la cancha, {nickname}!", confidence: HIGH, review_status: draft }
