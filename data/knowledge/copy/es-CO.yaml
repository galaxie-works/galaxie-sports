# Biblioteca de copy — Colômbia (es-CO). Ver docs/06 §4 e data/knowledge/SCHEMA.md.
# Padrões naturais: "hacer fuerza", "hágale", tratamento por "usted", "la estrella" (título), cuadrangulares.
# Rivalidade: forma negativa controlada ("hacer fuerza en contra") só para rival DECLARADO.
# Placeholders: {team}, {nickname}, {rival}, {minutes}. Todos os templates nascem draft até revisão nativa.
schema_version: 1
locale: es-CO
sport: football
templates:
  # ------------------------------------------------------------------ inform
  - { key: inform-1, intent: inform, tone: 1, template: "Próximo partido: {team}", confidence: HIGH, review_status: draft }
  - { key: inform-1-today, intent: inform, tone: 1, momentum: today, template: "Hoy juega {team}", confidence: HIGH, review_status: draft }
  - { key: inform-1-d1, intent: inform, tone: 1, momentum: D-1, template: "Mañana juega {team}", confidence: HIGH, review_status: draft }
  - { key: inform-1-t30, intent: inform, tone: 1, momentum: T-30, template: "{team} juega en {minutes} minutos", confidence: HIGH, review_status: draft }
  - { key: inform-1-live, intent: inform, tone: 1, momentum: live, template: "{team} está jugando en este momento", confidence: HIGH, review_status: draft }
  - { key: inform-2-today, intent: inform, tone: 2, momentum: today, template: "Hoy hay partido de {team}", confidence: HIGH, review_status: draft }
  - { key: inform-2-derby, intent: inform, tone: 2, competition_context: derby, template: "Hoy hay clásico: {team} vs. {rival}", confidence: HIGH, review_status: draft }
  # ------------------------------------------------------------------ anticipate
  - { key: anticipate-1-d1, intent: anticipate, tone: 1, momentum: D-1, template: "Mañana hay partido de {team}", confidence: HIGH, review_status: draft }
  - { key: anticipate-2-today, intent: anticipate, tone: 2, momentum: today, template: "Hoy juega {team}. ¡No se lo pierda!", confidence: HIGH, review_status: draft }
  - { key: anticipate-2-t60, intent: anticipate, tone: 2, momentum: T-60, template: "En {minutes} minutos juega {team}", confidence: HIGH, review_status: draft }
  - { key: anticipate-3-today, intent: anticipate, tone: 3, momentum: today, template: "Hoy juega {team}. ¡A hacerle fuerza!", confidence: HIGH, review_status: draft }
  - { key: anticipate-3-d1, intent: anticipate, tone: 3, momentum: D-1, template: "Mañana juega {team}. ¡Vamos a hacerle fuerza!", confidence: MEDIUM, review_status: draft }
  - { key: anticipate-4-today, intent: anticipate, tone: 4, momentum: today, template: "¡Llegó el día! ¡Vamos, {nickname}!", confidence: HIGH, review_status: draft }
  # ------------------------------------------------------------------ cheer
  - { key: cheer-2, intent: cheer, tone: 2, template: "¡Suerte, {team}!", confidence: HIGH, review_status: draft }
  - { key: cheer-3, intent: cheer, tone: 3, template: "¡Vamos, {team}!", confidence: HIGH, review_status: draft }
  - { key: cheer-3-nickname, intent: cheer, tone: 3, template: "¡Hágale, {nickname}!", confidence: MEDIUM, review_status: draft }
  - { key: cheer-3-derby, intent: cheer, tone: 3, competition_context: derby, template: "{team} vs. {rival}: hoy es clásico. ¡Fuerza, {nickname}!", confidence: HIGH, review_status: draft }
  - { key: cheer-4, intent: cheer, tone: 4, template: "¡Con toda, {nickname}! ¡Hoy le hacemos fuerza!", confidence: MEDIUM, review_status: draft }
  - { key: cheer-4-final, intent: cheer, tone: 4, competition_context: final, template: "¡Es la final! ¡Con toda, {nickname}!", confidence: HIGH, review_status: draft }
  # ------------------------------------------------------------------ rivalry (rival declarado; forma negativa controlada)
  - { key: rivalry-1, intent: rivalry, tone: 1, affinity_type: rival, affinity_source: explicit, template: "Hoy juega {rival}, su rival", confidence: HIGH, review_status: draft }
  - { key: rivalry-2, intent: rivalry, tone: 2, affinity_type: rival, affinity_source: explicit, template: "Juega {rival}. ¿Le va a seguir el partido?", confidence: MEDIUM, review_status: draft }
  - { key: rivalry-3, intent: rivalry, tone: 3, affinity_type: rival, affinity_source: explicit, template: "Juega {rival}. Hoy hacemos fuerza en contra", confidence: MEDIUM, review_status: draft }
  # ------------------------------------------------------------------ urgency
  - { key: urgency-1-t10, intent: urgency, tone: 1, momentum: T-10, template: "{team} juega en {minutes} minutos", confidence: HIGH, review_status: draft }
  - { key: urgency-2-starting, intent: urgency, tone: 2, momentum: starting, template: "Ya empieza el partido de {team}", confidence: HIGH, review_status: draft }
  - { key: urgency-2-live, intent: urgency, tone: 2, momentum: live, template: "{team} juega ahora. Sígalo en vivo", confidence: HIGH, review_status: draft }
  - { key: urgency-3-starting, intent: urgency, tone: 3, momentum: starting, template: "¡Ya arranca! ¡Fuerza, {nickname}!", confidence: HIGH, review_status: draft }
  - { key: urgency-4-starting, intent: urgency, tone: 4, momentum: starting, template: "¡Ya va a arrancar! ¡Con toda, {nickname}!", confidence: MEDIUM, review_status: draft }
  # ------------------------------------------------------------------ decisive
  - { key: decisive-1, intent: decisive, tone: 1, template: "Partido decisivo hoy: juega {team}", confidence: HIGH, review_status: draft }
  - { key: decisive-2-final, intent: decisive, tone: 2, competition_context: final, template: "Final hoy: {team} va por el título", confidence: HIGH, review_status: draft }
  - { key: decisive-2-playoff, intent: decisive, tone: 2, competition_context: playoff, template: "Partido de cuadrangulares: hoy juega {team}", confidence: MEDIUM, review_status: draft }
  - { key: decisive-2-relegation, intent: decisive, tone: 2, competition_context: relegation, template: "Partido clave por la permanencia: juega {team}", confidence: MEDIUM, review_status: draft }
  - { key: decisive-3, intent: decisive, tone: 3, template: "Partido grande hoy. ¡Fuerza, {nickname}!", confidence: HIGH, review_status: draft }
  - { key: decisive-3-title, intent: decisive, tone: 3, competition_context: title, template: "Hoy puede llegar la estrella. ¡Vamos, {nickname}!", confidence: MEDIUM, review_status: draft }
  - { key: decisive-4-final, intent: decisive, tone: 4, competition_context: final, template: "¡Final! ¡Hoy se deja todo, {nickname}!", confidence: HIGH, review_status: draft }
