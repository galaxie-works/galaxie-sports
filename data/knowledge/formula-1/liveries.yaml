# Base semântica — cores das equipes de Fórmula 1 por época (schema v1)
#
# Uma linha por pintura: o intervalo de temporadas, [primária, secundária] em hex e a pintura em poucas palavras.
# A primária é a cor de identidade da época: a cor oficial da equipe nas transmissões (era moderna) ou a que
# domina o carro (histórico). O slug é o id do construtor no F1DB. Temporada fora de toda época = sem cor curada
# (a API cai nas cores do escudo, quando houver). Os hex são aproximações da pintura descrita nas fontes.
# Revisão (24/10/2026): cada época foi conferida contra as fontes por um revisor de IA independente; o que não
# se confirmou em texto saiu (melhor sem cor do que com cor errada). Rebaixe para draft o que um revisor humano contestar.
schema_version: 1
