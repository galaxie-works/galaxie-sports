name: CI

# Só leitura do repositório: nenhum job daqui publica nada nem escreve no PR.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # fila de merge do GitHub: roda de novo sobre a main + os PRs à frente na fila (os checks obrigatórios vêm daqui)
  merge_group:

concurrency:
  # Na main cada commit tem o próprio grupo e nada é cancelado: o deploy só publica um SHA com o CI verde, e um
  # merge logo depois do outro não pode deixar o primeiro sem teste. Nos PRs, o push novo cancela o anterior; na fila,
  # cada grupo tem a própria ref (gh-readonly-queue/main/pr-…).
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: checks (Postgres ${{ matrix.postgres }}, Valkey ${{ matrix.valkey }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ler os rótulos do PR (passo da migration destrutiva); continua sem escrever em nada
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      # 17/8 é o que roda em produção; 18/9 é o alvo do upgrade (issue #201). Ao migrar, sai a linha 17/8.
      matrix:
        include:
          - { postgres: 17, valkey: 8 }
          - { postgres: 18, valkey: 9 }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: galaxie
          POSTGRES_PASSWORD: galaxie
          POSTGRES_DB: galaxie_sports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galaxie -d galaxie_sports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:${{ matrix.valkey }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://galaxie:galaxie@localhost:5432/galaxie_sports
      REDIS_URL: redis://localhost:6379
    steps:
      # No PR o checkout é o commit de merge (main + PR) e precisa dos dois pais para o turbo achar a base do --affected:
      # com profundidade 1 o commit de merge fica sem pais e o turbo cai calado para "tudo mudou".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No PR, build, typecheck e testes (unitários e de integração) rodam só nos pacotes que a mudança alcança: os que
      # mudaram e quem depende deles (`turbo --affected`, base = o 1º pai do commit de merge, a main em que o PR entra).
      # Formatação, lint e a regra de dependência olham o repositório todo (são rápidos e cobrem arquivos fora dos pacotes).
      # Na fila de merge e no push para a main roda tudo: o deploy só publica um SHA com o CI completo. O que está fora
      # dos pacotes mas muda o resultado (config/, data/, docs/rules/, package.json, este arquivo) está em
      # globalDependencies do turbo.json e afeta todos. O docker.yml não tem filtro (ver o cabeçalho dele).
      - name: Escopo (pacotes afetados no PR; tudo na fila de merge e no push)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Fila de merge ou push: o CI roda tudo."
            exit 0
          fi
          base=$(git rev-parse --verify --quiet 'HEAD^1' || true)
          if [ -z "$base" ]; then
            echo "::warning::Commit base indisponível: o CI roda tudo."
            exit 0
          fi
          export TURBO_SCM_BASE="$base"
          if ! pnpm exec turbo run build --affected --dry=json > "$RUNNER_TEMP/affected.json" 2> "$RUNNER_TEMP/affected.err"; then
            cat "$RUNNER_TEMP/affected.err"
            echo "::warning::O turbo não calculou os pacotes afetados: o CI roda tudo."
            exit 0
          fi
          if grep -q "unable to detect git range" "$RUNNER_TEMP/affected.err"; then
            cat "$RUNNER_TEMP/affected.err"
            echo "::warning::O turbo não achou a base do --affected (e assumiu que tudo mudou): o CI roda tudo."
            exit 0
          fi
          echo "TURBO_SCM_BASE=$base" >> "$GITHUB_ENV"
          echo "AFFECTED=--affected" >> "$GITHUB_ENV"
          # O build do Next da demo (~90 s, em cada uma das duas pernas) já é feito, em todo PR que muda a demo, pelo check
          # obrigatório `build demo` do docker.yml (docker build da imagem). Aqui ele sai do PR; as dependências da demo
          # continuam sendo construídas pelo typecheck e pelos testes (dependsOn ^build). Na fila e no push entra de novo.
          echo "BUILD_FILTER=--filter=!@galaxie/demo" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const names = j.packages.filter((p) => p !== "//").map((p) => p.replace("@galaxie/", ""));
            const text = names.length ? names.join(", ") : "nenhum (a mudança está fora dos pacotes)";
            console.log(`Pacotes afetados (${names.length}): ${text}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `**Pacotes afetados (${names.length}):** ${text}\n`);
          ' "$RUNNER_TEMP/affected.json"

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # As fronteiras de docs/15 (scripts/deps): app não importa app nem serviço, serviço não importa serviço, pacote
      # não importa app nem serviço, base não importa domínio e só o apisports-client fala com a api-sports. O PR que
      # viola é reprovado com o nome da regra; o que já violava está em scripts/deps/exceptions.json, com o motivo. O
      # mapa de docs/15 sai da mesma ferramenta (`pnpm deps:map`): desatualizado reprova no PR e só avisa na fila e no
      # push, para dois PRs que somam arestas diferentes não se derrubarem na fila.
      - name: Regra de dependência
        run: pnpm lint:deps --map=${{ github.event_name == 'pull_request' && 'error' || 'warn' }}

      - name: Testes da regra de dependência
        run: pnpm test:deps

      - name: Testes do status dos PRs
        run: pnpm test:status-prs

      - name: Build
        run: pnpm exec turbo run build $AFFECTED $BUILD_FILTER

      # A base semântica e as checagens de migration abaixo rodam o dist do knowledge e do db, mesmo no PR que não chega
      # a esses pacotes (o build acima só constrói o que o PR alcança); o turbo reaproveita o que já construiu.
      - name: Build do db e do knowledge (checagens de migration e da base semântica)
        run: pnpm exec turbo run build --filter=@galaxie/db --filter=@galaxie/knowledge

      - name: Base semântica (JSON Schema + referências em data/knowledge)
        run: pnpm --filter @galaxie/knowledge knowledge:validate

      - name: Typecheck
        run: pnpm typecheck $AFFECTED

      - name: Testes unitários
        run: pnpm test $AFFECTED

      # O migrator só aplica a migration com `when` maior que o da última aplicada: renumerada no merge e com
      # `when` menor, ela seria pulada em silêncio na produção (aqui o banco é vazio e tudo passa). A base é o
      # 1º pai do commit testado: no PR e na fila, a main em que ele entra; no push, o commit anterior da main.
      # Sem a base, o PR e a fila falham (é ali que a renumeração se confere); no push, só avisa.
      - name: Migrations em ordem (when crescente e base preservada)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          if [ -n "$base" ] && git fetch -q --no-tags --depth=1 origin "$base"; then
            git show "$base:packages/db/drizzle/meta/_journal.json" > "$RUNNER_TEMP/journal-base.json"
            node packages/db/dist/journal-check-cli.js --base "$RUNNER_TEMP/journal-base.json"
          elif [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            echo "::error::Commit base ($base) indisponível: sem ele não dá para conferir o journal contra a main."
            exit 1
          else
            echo "::warning::Commit base indisponível: conferindo só a ordem interna do journal."
            node packages/db/dist/journal-check-cli.js
          fi

      # A troca de versão é lado a lado e o candidato migra antes dela: a migration nova tem que servir também à
      # versão antiga. DROP, RENAME, mudança de tipo e NOT NULL sem DEFAULT (contrair) quebram a antiga e a volta do
      # código; só entram num PR próprio com o rótulo `contrair`, depois do deploy que parou de usar o que sai
      # (docs/runbooks/migrations.md). Migrations novas = as que o PR acrescenta sobre a base (1º pai do commit
      # testado, como no passo acima). Só no PR o rótulo decide; na fila e no push o PR já passou por aqui, então só
      # avisa. O rótulo é lido da API na hora (o payload do evento fica velho ao reexecutar o job depois de rotular).
      - name: Migration destrutiva sem o rótulo contrair
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAYLOAD_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
          if [ -z "$base" ] || ! git fetch -q --no-tags --depth=1 origin "$base"; then
            if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
              echo "::error::Commit base ($base) indisponível: sem ele não dá para saber quais migrations o PR acrescenta."
              exit 1
            fi
            echo "::warning::Commit base indisponível: migrations destrutivas não conferidas neste push."
            exit 0
          fi
          mapfile -t files < <(git diff --name-only --no-renames --diff-filter=A "$base" HEAD -- 'packages/db/drizzle/*.sql')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhuma migration nova."
            exit 0
          fi
          mode=--warn
          if [ "$EVENT" = pull_request ]; then
            labels=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name' 2>/dev/null) \
              || labels=$(printf '%s' "$PAYLOAD_LABELS" | jq -r '.[]')
            if printf '%s\n' "$labels" | grep -qx contrair; then mode=--allowed; else mode=; fi
          fi
          node packages/db/dist/destructive-migrations-cli.js $mode "${files[@]}"

      - name: Migrations sem drift (schema TS ⇄ SQL versionado)
        working-directory: packages/db
        run: |
          pnpm exec drizzle-kit generate --name=ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::O schema Drizzle mudou sem migration versionada. Rode 'pnpm db:generate' e commite a pasta drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      # Cada suíte cria um banco descartável e aplica todas as migrations numa transação só, e as suítes rodam em
      # paralelo: com o padrão (64), a tabela de locks compartilhada estoura ("out of shared memory").
      - name: Postgres com mais locks por transação
        run: |
          id="${{ job.services.postgres.id }}" # vale para todas as versões da matriz
          docker exec "$id" psql -U galaxie -d galaxie_sports -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart "$id"
          until docker exec "$id" pg_isready -U galaxie -d galaxie_sports; do sleep 1; done
          docker exec "$id" psql -U galaxie -d galaxie_sports -tAc "SHOW max_locks_per_transaction"

      - name: Testes de integração (Postgres)
        run: pnpm test:integration $AFFECTED

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instala o gitleaks (binário oficial, checksum verificado)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
          rm -f "$tarball" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"

      # Varre só o histórico que este evento traz: no PR e na fila, os commits dele (base..head); no push, o
      # histórico do commit enviado. Sem isso, o `git .` com fetch-depth 0 alcança todas as branches
      # remotas e um achado numa branch de trabalho derruba o CI de todos os PRs.
      - name: Varredura de segredos (commits do PR ou histórico do commit enviado)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if [ -n "$HEAD_SHA" ]; then range="$BASE_SHA..$HEAD_SHA"; else range="$GITHUB_SHA"; fi
          echo "intervalo: $range"
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --log-opts="$range"

  audit:
    name: Auditoria de dependências (informativa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Não bloqueia o merge: o relatório vai para o resumo do job; correções chegam via Dependabot.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: pnpm audit --prod
        run: |
          set +e
          pnpm audit --prod > audit.txt 2>&1
          status=$?
          {
            echo "## pnpm audit --prod"
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
          if [ $status -ne 0 ]; then echo "::warning::pnpm audit encontrou vulnerabilidades (ver resumo do job)."; fi
          exit 0
