name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Na main cada commit tem o próprio grupo e nada é cancelado: o deploy.sh só publica um SHA com o CI verde, e um
  # merge logo depois do outro não pode deixar o primeiro sem teste. Nos PRs, o push novo cancela o anterior.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: checks (Postgres ${{ matrix.postgres }}, Valkey ${{ matrix.valkey }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 17/8 é o que roda em produção; 18/9 é o alvo do upgrade (issue #201). Ao migrar, sai a linha 17/8.
      matrix:
        include:
          - { postgres: 17, valkey: 8 }
          - { postgres: 18, valkey: 9 }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: galaxie
          POSTGRES_PASSWORD: galaxie
          POSTGRES_DB: galaxie_sports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galaxie -d galaxie_sports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:${{ matrix.valkey }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://galaxie:galaxie@localhost:5432/galaxie_sports
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Base semântica (JSON Schema + referências em data/knowledge)
        run: pnpm --filter @galaxie/knowledge knowledge:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Migrations sem drift (schema TS ⇄ SQL versionado)
        working-directory: packages/db
        run: |
          pnpm exec drizzle-kit generate --name=ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::O schema Drizzle mudou sem migration versionada. Rode 'pnpm db:generate' e commite a pasta drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      # Cada suíte cria um banco descartável e aplica todas as migrations numa transação só, e as suítes rodam em
      # paralelo: com o padrão (64), a tabela de locks compartilhada estoura ("out of shared memory").
      - name: Postgres com mais locks por transação
        run: |
          id="${{ job.services.postgres.id }}" # vale para todas as versões da matriz
          docker exec "$id" psql -U galaxie -d galaxie_sports -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart "$id"
          until docker exec "$id" pg_isready -U galaxie -d galaxie_sports; do sleep 1; done
          docker exec "$id" psql -U galaxie -d galaxie_sports -tAc "SHOW max_locks_per_transaction"

      - name: Testes de integração (Postgres)
        run: pnpm test:integration

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instala o gitleaks (binário oficial, checksum verificado)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
          rm -f "$tarball" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"

      # Varre só o histórico que este evento traz: no PR, os commits dele (base..head); no push, o
      # histórico do commit enviado. Sem isso, o `git .` com fetch-depth 0 alcança todas as branches
      # remotas e um achado numa branch de trabalho derruba o CI de todos os PRs.
      - name: Varredura de segredos (commits do PR ou histórico do commit enviado)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$HEAD_SHA" ]; then range="$BASE_SHA..$HEAD_SHA"; else range="$GITHUB_SHA"; fi
          echo "intervalo: $range"
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose --log-opts="$range"

  audit:
    name: Auditoria de dependências (informativa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Não bloqueia o merge: o relatório vai para o resumo do job; correções chegam via Dependabot.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: pnpm audit --prod
        run: |
          set +e
          pnpm audit --prod > audit.txt 2>&1
          status=$?
          {
            echo "## pnpm audit --prod"
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
          if [ $status -ne 0 ]; then echo "::warning::pnpm audit encontrou vulnerabilidades (ver resumo do job)."; fi
          exit 0
