name: Imagens e stack de staging

# Constrói e valida em todo PR. No push para a main e na fila de merge (merge_group) publica no GHCR as imagens que a
# stack usa: na fila com a tag <sha> do commit que vai virar a main; no push
# com <sha>, main e staging. Imagem cuja entrada não mudou não é reconstruída: ganha as tags novas (passo "Entrada da
# imagem"). O deploy (deploy.yml) sobe a stack com as imagens do SHA — ver infra/vps-telemetry/README.md.
# A entrada de api, ingestor e demo é calculada por infra/ops/image-inputs.mjs a partir do grafo do pnpm: as pastas do
# fechamento de dependências do app (com as de dev, que o build compila), o que o Dockerfile copia de fora do grafo e os
# arquivos da raiz. Um merge só na demo reaproveita a api e o ingestor. Mudança em config/ continua reconstruindo api e
# ingestor, de propósito: o config/ inteiro vai dentro dessas duas imagens. Na demo só entram config/broadcasters e
# config/broadcast-rights, as pastas que o Dockerfile dela copia.
# Sem filtro de caminhos: todo commit da main precisa das imagens do próprio SHA, e um check obrigatório que não roda
# (PR só de docs) trava o PR para sempre. PR que não muda a entrada das imagens só reaproveita e termina em segundos.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Na main, a execução em andamento nunca é cancelada (o deploy exige o CI verde do SHA); o grupo continua por ref para
  # as tags main/staging saírem em ordem, então só uma execução ainda na fila pode ser trocada pela do commit seguinte.
  # Na fila de merge cada grupo tem a própria ref.
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/galaxie-works/galaxie-sports-${{ matrix.image }}
      # Publica no push para a main e na fila de merge.
      PUBLISH: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group') }}
      # PR de fork não tem token para o GHCR: constrói sempre, sem consultar o registry
      SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        # A entrada de cada imagem (o que o build lê do contexto e muda a imagem) está em infra/ops/image-hash.sh: a pasta
        # dela, ou, nas três do Node, que copiam a raiz inteira (COPY . ., menos o .dockerignore) mas só leem parte dela,
        # a lista de infra/ops/image-inputs.mjs.
        include:
          - image: api
            context: .
            file: apps/api/Dockerfile
          - image: ingestor
            context: .
            file: services/ingestor/Dockerfile
          - image: demo
            context: .
            file: apps/demo/Dockerfile
          - image: backup
            context: infra/backup
            file: infra/backup/Dockerfile
          - image: prometheus
            context: infra/observability/prometheus
            file: infra/observability/prometheus/Dockerfile
          - image: grafana
            context: infra/observability/grafana
            file: infra/observability/grafana/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR
        if: env.SAME_REPO == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hash da entrada (infra/ops/image-hash.sh, a mesma fórmula do deploy-gh.sh): pasta única = hash git dela (o mesmo
      # rótulo works.galaxie.context-tree que o deploy.sh confere na VPS); várias = sha256 da listagem git delas. A imagem
      # já publicada com a tag in-<hash> é a que um build agora daria: ganha as tags deste commit (imagetools, sem baixar
      # camada) em vez de ser reconstruída. Na fila, a imagem do próprio SHA (publicada pelo grupo) serve também para o
      # push na main que vem logo depois. A lista do Node vem do grafo do pnpm (o Node já instalado no runner basta: o
      # script não tem dependências).
      - name: Entrada da imagem
        id: input
        env:
          NAME: ${{ matrix.image }}
        run: |
          hash=$(bash infra/ops/image-hash.sh "$NAME")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          src=""
          if [ "$SAME_REPO" = true ]; then
            for ref in "$IMAGE:$GITHUB_SHA" "$IMAGE:in-$hash"; do
              if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
                src="$ref"
                break
              fi
            done
          fi
          echo "source=$src" >> "$GITHUB_OUTPUT"
          echo "entrada $hash: ${src:-sem imagem publicada, constrói}"
          {
            echo 'tags<<FIM'
            echo "$IMAGE:$GITHUB_SHA"
            echo "$IMAGE:in-$hash"
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "$IMAGE:main"
              echo "$IMAGE:staging"
            fi
            echo FIM
          } >> "$GITHUB_OUTPUT"

      - name: Reaproveita a imagem publicada (entrada igual)
        if: env.PUBLISH == 'true' && steps.input.outputs.source != ''
        env:
          SOURCE: ${{ steps.input.outputs.source }}
          TAGS: ${{ steps.input.outputs.tags }}
        run: |
          args=()
          while read -r t; do [ -z "$t" ] || args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          echo "tags deste commit apontam para $SOURCE"

      - name: Build (e push na main e na fila)
        if: steps.input.outputs.source == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUBLISH == 'true' }}
          # nos PRs as imagens do Node ficam no Docker local para as checagens de arquivos abaixo
          load: ${{ env.PUBLISH != 'true' && (matrix.image == 'api' || matrix.image == 'ingestor' || matrix.image == 'demo') }}
          labels: works.galaxie.context-tree=${{ steps.input.outputs.hash }}
          # as três do Node gravam o hash em GALAXIE_IMAGE_HASH (o /version e o build_info leem dali). Determinístico: a
          # mesma entrada dá o mesmo valor, e o reaproveitamento acima continua valendo
          build-args: ${{ matrix.context == '.' && format('IMAGE_HASH=in-{0}', steps.input.outputs.hash) || '' }}
          # Só tags do GHCR: com push ligado o Buildx envia TODAS as tags (uma sem registry iria para o Docker Hub).
          tags: ${{ steps.input.outputs.tags }}
          # A fila lê o cache da main (o GitHub só deixa ler o da própria ref e o da branch padrão) e não grava: a ref
          # dela é descartável, e o cache gravado ali tiraria espaço do limite do repositório sem ninguém ler.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name != 'merge_group' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

      # Os pacotes leem config/ e data/knowledge a partir de si mesmos e silenciam quando não acham
      # (lista vazia): sem esta checagem, faltar um diretório na imagem só aparece na produção. Imagem reaproveitada
      # (entrada igual) já passou por aqui quando foi construída.
      - name: Arquivos de config dentro da imagem
        if: env.PUBLISH != 'true' && steps.input.outputs.source == '' && (matrix.image == 'api' || matrix.image == 'ingestor')
        run: |
          docker run --rm --entrypoint node "ghcr.io/galaxie-works/galaxie-sports-${{ matrix.image }}:${{ github.sha }}" -e '
            const fs = require("fs");
            const env = process.env;
            const need = {
              api: [env.RULES_CONFIG_DIR + "/default.yaml", env.WTW_CONFIG_DIR + "/broadcasters", env.KNOWLEDGE_DIR + "/glossary",
                    env.MEDIA_DENYLIST_PATH, env.GEO_CONFIG_DIR + "/market-audience.yaml", "/srv/config/plans.yaml"],
              ingestor: [env.RULES_CONFIG_DIR + "/default.yaml", env.WTW_CONFIG_DIR + "/broadcasters",
                         env.WTW_CONFIG_DIR + "/related-content", "/srv/config/competitions", "/srv/data/knowledge",
                         env.GEO_CONFIG_DIR + "/market-audience.yaml",
                         "/srv/services/ai-agents/dist/cli/recap-run.js",
                         // seed semântico do pós-deploy (infra/vps-telemetry/post-deploy.sh)
                         "/srv/services/ingestor/node_modules/@galaxie/knowledge/dist/cli/seed-semantic.js"],
            }["${{ matrix.image }}"];
            const missing = need.filter((p) => !p || p.includes("undefined") || !fs.existsSync(p));
            if (missing.length) { console.error("faltando na imagem:", missing); process.exit(1); }
            console.log("ok:", need.length, "caminhos");'

      - name: Hash da entrada dentro da imagem (GALAXIE_IMAGE_HASH)
        if: env.PUBLISH != 'true' && steps.input.outputs.source == '' && (matrix.image == 'api' || matrix.image == 'ingestor' || matrix.image == 'demo')
        env:
          WANT: GALAXIE_IMAGE_HASH=in-${{ steps.input.outputs.hash }}
        run: |
          docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE:$GITHUB_SHA" | grep -qx "$WANT" ||
            { echo "::error::a imagem não tem $WANT"; exit 1; }
          echo "$WANT"

      # O repositório é público e as imagens vão para o GHCR: nenhum .env pode entrar (o .dockerignore exclui **/.env*,
      # menos o .env.example). Segredo só no .env da VPS, em tempo de execução.
      - name: Nenhum .env dentro da imagem
        if: env.PUBLISH != 'true' && steps.input.outputs.source == '' && (matrix.image == 'api' || matrix.image == 'ingestor' || matrix.image == 'demo')
        run: |
          # /srv é o app inteiro nas três imagens; node_modules de terceiros fica de fora (não é código nosso)
          found=$(docker run --rm --entrypoint sh "$IMAGE:$GITHUB_SHA" -c \
            "find /srv -name node_modules -prune -o \( -name .env -o -name '.env.*' \) ! -name .env.example -print")
          if [ -n "$found" ]; then
            echo "::error::.env dentro da imagem: $found"
            exit 1
          fi
          echo "nenhum .env na imagem"

  # A stack de dev do NAS (Portainer, GitOps por polling; infra/nas-dev/compose.yml) acompanha a branch `nas-dev`, não a
  # main: este job avança a branch para o SHA só depois de TODAS as imagens do commit terem saído com a tag `main`.
  # Assim o redeploy do Portainer nunca vê um commit cujas imagens ainda não existem: o poll de 5 min caía no meio do
  # build, puxava a imagem anterior e, sem commit novo, não tentava de novo (a migration ficava sem aplicar até o merge
  # seguinte). Push pelo GITHUB_TOKEN não dispara workflow nenhum. Build de uma imagem falhou = a branch não anda, e o
  # `gs dev:esquema` avisa o atraso. Runbook: docs/runbooks/ambiente-de-dev.md › Stack a partir do git.
  nas-dev:
    name: avança nas-dev (stack de dev do NAS)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: nas-dev = este SHA (imagens main publicadas)
        run: |
          # execuções da main saem em ordem (concurrency acima), mas se a branch já estiver à frente deste SHA
          # (commit seguinte publicado antes), não há o que fazer: avançar para trás seria voltar o dev
          if git fetch origin nas-dev 2>/dev/null && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::notice::nas-dev já está em $(git rev-parse --short FETCH_HEAD), à frente de $(git rev-parse --short HEAD); nada a fazer"
            exit 0
          fi
          git push origin "HEAD:refs/heads/nas-dev"
          echo "nas-dev → $(git rev-parse --short HEAD)"

  # Servidor do Playwright do lineup-render (infra/lineup-render). A base tem ~2 GB: só constrói quando a pasta muda.
  # No PR e na fila de merge, em relação ao 1º pai do commit (a main em que ele entra). No push para a main, em relação ao rótulo
  # works.galaxie.context-tree da tag publicada no GHCR: uma execução trocada na fila pela do commit seguinte não deixa
  # a mudança sem imagem. O disparo manual sempre constrói. Na main (push ou disparo manual) publica com a tag da
  # versão do Playwright (a que o compose usa) e a do SHA.
  lineup-render:
    name: build lineup-render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/galaxie-works/galaxie-sports-lineup-render
      PUBLISH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Mesma versão do Playwright na imagem, no compose e no services/ai-agents
        run: |
          node --test infra/lineup-render/versions.test.mjs
          node infra/lineup-render/versions.mjs

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Só avisa: a Microsoft pode republicar a mesma tag, e isso não pode derrubar o CI de todo PR. O build usa sempre
      # o digest fixado; tag e digest do FROM sobem juntos.
      - name: Digest do FROM ainda é o da tag declarada
        run: |
          from=$(sed -n 's/^FROM \(mcr\.microsoft\.com\/playwright:[^@ ]*\)@\(sha256:[0-9a-f]*\).*/\1 \2/p' infra/lineup-render/Dockerfile)
          ref=${from% *}
          want=${from#* }
          # a saída padrão traz "Digest: sha256:…" do que a tag aponta (o índice multi-arquitetura); o --format
          # .Manifest é o documento cru, que não tem campo digest
          got=$(docker buildx imagetools inspect "$ref" | awk '$1 == "Digest:" { print $2; exit }') || got=
          if [ "$got" = "$want" ]; then
            echo "$ref = $want"
          else
            echo "::warning::$ref aponta hoje para ${got:-?}; o Dockerfile fixa $want. Suba tag e digest juntos."
          fi

      - name: A pasta mudou?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          tree=$(git rev-parse HEAD:infra/lineup-render)
          version=$(node -p "require('./infra/lineup-render/package.json').dependencies.playwright")
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            same=""
          elif [ "$PUBLISH" = true ]; then
            # rótulo da tag publicada (sem tag, sem rótulo ou sem acesso: vazio → constrói)
            same=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Image}}' 2>/dev/null |
              jq -r '[.. | objects | .Labels? // empty | .["works.galaxie.context-tree"]? // empty] | first // empty') || same=
            echo "rótulo publicado em $IMAGE:$version: ${same:-nenhum}"
          else
            base=$(git cat-file -p HEAD | awk '/^parent /{print $2; exit}')
            same=""
            if [ -n "$base" ] && git fetch -q --no-tags --depth=1 origin "$base"; then
              same=$(git rev-parse -q --verify "$base:infra/lineup-render") || same=
            fi
            echo "infra/lineup-render no commit base ${base:-?}: ${same:-sem a pasta ou indisponível}"
          fi
          if [ "$same" = "$tree" ]; then
            echo "infra/lineup-render ($tree) já tem imagem: sem build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (e push na main)
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/lineup-render
          file: infra/lineup-render/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          # mesmo rótulo que o deploy.sh usa para saber se a VPS já tem a imagem desta versão da pasta
          labels: works.galaxie.context-tree=${{ steps.changed.outputs.tree }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.changed.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          # sem cache do GHA: a base de ~2 GB disputaria o limite de cache do repositório com as outras imagens, e
          # este build é raro e curto (npm ci de dois pacotes)

      # Sem rede: prova que a partida não baixa nada do npm. O servidor tem de ficar no ar, anunciar o endpoint e,
      # conectado de dentro do contêiner pelo protocolo do Playwright, abrir uma página no Chromium.
      - name: run-server sobe como pwuser e sem rede, e o navegador abre uma página
        if: steps.changed.outputs.build == 'true' && env.PUBLISH != 'true'
        run: |
          img="$IMAGE:${{ github.sha }}"
          user=$(docker image inspect -f '{{.Config.User}}' "$img")
          [ "$user" = pwuser ] || { echo "::error::usuário da imagem é '$user', esperado pwuser"; exit 1; }
          docker run -d --name lineup-render --network none --init --shm-size 512m "$img"
          for _ in $(seq 60); do
            docker logs lineup-render 2>&1 | grep -q 'Listening on ws://' && break
            sleep 1
          done
          docker logs lineup-render
          sleep 3
          [ "$(docker inspect -f '{{.State.Running}}' lineup-render)" = true ] || { echo "::error::o servidor caiu"; exit 1; }
          docker logs lineup-render 2>&1 | grep -q 'Listening on ws://0.0.0.0:3000/'
          docker exec lineup-render node -e '
            const { chromium } = require("/opt/playwright-server/node_modules/playwright");
            (async () => {
              const browser = await chromium.connect("ws://127.0.0.1:3000/");
              const page = await browser.newPage();
              await page.setContent("<p id=ok>ok</p>");
              const text = await page.textContent("#ok");
              console.log("Chromium", browser.version(), "abriu a página:", text);
              await browser.close();
              if (text !== "ok") process.exit(1);
            })().catch((e) => { console.error(e); process.exit(1); });'
          docker rm -f lineup-render

  stack:
    name: valida stack, alertas e scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker compose config (os três projetos da VPS)
        run: |
          for f in compose.yml compose.dados.yml compose.obs.yml; do
            docker compose -f "infra/vps-telemetry/$f" --env-file infra/vps-telemetry/env.example config -q
          done

      # A stack de dev do NAS é lida pelo Portainer direto do git (#552): o arquivo tem de fechar sozinho, com e sem o
      # perfil workers, e o migrate tem de ser o da produção na tag main (o resto das regras está no vitest do ingestor)
      - name: docker compose config (stack de dev do NAS, a partir do git)
        run: |
          docker compose -f infra/nas-dev/compose.yml --env-file infra/nas-dev/env.example config -q
          docker compose -f infra/nas-dev/compose.yml --env-file infra/nas-dev/env.example --profile workers config -q
          docker compose -f infra/nas-dev/compose.yml --env-file infra/nas-dev/env.example config --format json |
            jq -e '.services.migrate.image == "ghcr.io/galaxie-works/galaxie-sports-api:main"
              and .services.migrate.restart == "no"
              and (.services.migrate.depends_on.postgres.condition == "service_healthy")' >/dev/null ||
            { echo "::error::migrate da stack de dev fora do esperado (imagem api:main, restart no, espera o postgres)"; exit 1; }

      - name: docker compose config (candidatos do deploy)
        run: |
          docker compose -f infra/vps-telemetry/compose.yml --env-file infra/vps-telemetry/env.example --profile candidate config --format json |
            jq -e '.services["api-candidate"].environment.REDIS_KEY_PREFIX == "gs-candidate:"
              and .services["api-candidate"].environment.USAGE_PERSIST == "off"
              and (.services["api-candidate"].labels | keys) == ["traefik.enable"]
              and .services["api-candidate"].image == .services.api.image
              and ([.services as $s | ("site", "console") | . as $w | $s[$w + "-candidate"] as $c
                | $c.environment.GALAXIE_API_URL == "http://api-candidate:8080"
                  and ($c.labels | keys) == ["traefik.enable"]
                  and $c.image == $s[$w].image
                  and $c.mem_limit == $s[$w].mem_limit
                  and $c.environment.APP_ROLE == $w and $s[$w].environment.APP_ROLE == $w] | all)
              and .services.site.image == .services.console.image
              and (.services | has("demo") | not)' >/dev/null ||
            { echo "::error::candidatos fora do esperado (api, site e console: sem router, prefixo próprio, mesma imagem e papel)"; exit 1; }

      - name: docker compose config (o Traefik da VPS)
        run: docker compose -f infra/traefik/compose.yml --env-file infra/traefik/env.example config -q

      - name: docker compose config (a stack de dev do NAS, com o serviço espelho)
        run: docker compose -f infra/nas-dev/compose.yml --env-file infra/nas-dev/env.example config -q

      # O Traefik descarta um middleware declarado diferente em dois contêineres: os gsports-* têm de ser iguais em
      # todos os serviços que os declaram (infra/traefik/README.md)
      - name: Middlewares da borda iguais em todos os serviços
        run: |
          for f in compose.yml compose.dados.yml; do
            docker compose -f "infra/vps-telemetry/$f" --env-file infra/vps-telemetry/env.example config --format json
          done | jq -es '[.[].services[] | .labels // {} | with_entries(select(.key | startswith("traefik.http.middlewares.gsports-")))
              | select(length > 0)] | (length >= 2) and (unique | length == 1)' >/dev/null ||
            { echo "::error::traefik.http.middlewares.gsports-* difere entre os serviços (ou sumiu)"; exit 1; }

      # O deploy-gh.sh baixa as imagens dos serviços com TAG_* nos composes; todas precisam sair do job build acima
      - name: Deploy pelo Actions acha as imagens publicadas (compose ⇄ docker.yml)
        run: |
          out=$(for p in apps dados obs; do SHA=$(git rev-parse HEAD) bash infra/vps-telemetry/deploy-gh.sh --project "$p" --services; done)
          echo "$out"
          got=$(printf '%s\n' "$out" | sed -n 's/.*imagens: //p' | tr ' ' '\n' | sort | tr '\n' ' ')
          want="api backup demo grafana ingestor prometheus "
          [ "$got" = "$want" ] || { echo "::error::imagens do compose ($got) ≠ publicadas pelo docker.yml ($want)"; exit 1; }

      - name: Alertas — teste simulado (promtool)
        run: |
          docker run --rm -v "$PWD/infra/observability/prometheus:/w" -w /w --entrypoint promtool \
            prom/prometheus:v3.15.1 test rules alerts.test.yml slo.test.yml
          docker run --rm -v "$PWD/infra/observability/prometheus:/w" -w /w --entrypoint promtool \
            prom/prometheus:v3.15.1 check config prometheus.yml --syntax-only

      - name: Painel do Grafana é JSON válido
        run: jq empty infra/observability/grafana/dashboards/*.json

      - name: shellcheck
        run: |
          shellcheck -S warning infra/backup/*.sh infra/observability/prometheus/entrypoint.sh infra/observability/grafana/entrypoint.sh \
            infra/vps-telemetry/deploy.sh infra/vps-telemetry/deploy-gh.sh infra/vps-telemetry/deploy-gh.test.sh \
            infra/vps-telemetry/deploy-plan.sh infra/vps-telemetry/deploy-verify.sh infra/vps-telemetry/post-deploy.sh infra/ops/codex-gate.sh \
            infra/ops/image-hash.sh infra/ops/image-hash.test.sh \
            infra/ops/mover-tasks-para-bucket-privado.sh infra/ops/mover-tasks-para-bucket-privado.test.sh             infra/ops/mirror-prod-to-dev.sh infra/ops/mirror-prod-to-dev.test.sh \
            infra/nas-backup/nas-pull.sh infra/nas-backup/nas-pull.test.sh infra/ops/merge-train.test.sh infra/ops/codex-gate.test.sh \
            infra/vps-telemetry/candidate.sh infra/vps-telemetry/maintenance.sh infra/vps-telemetry/migrar-para-tres-projetos.sh infra/vps-telemetry/rolling-swap.sh infra/vps-telemetry/rolling-swap.test.sh infra/vps-telemetry/ligar-webhooks.sh \
            infra/vps-telemetry/prune-images.sh infra/vps-telemetry/prune-images.test.sh infra/ops/vps-stats/*.sh \
            infra/ops/migrate-dev.sh infra/ops/migrate-dev.test.sh

      - name: Trem de merge (cancelado ao lado de verde não reprova; gh falso)
        run: bash infra/ops/merge-train.test.sh

      - name: Migrate do dev pela máquina (migrate-dev.sh com docker e pnpm falsos; recusa URL que não é a do dev)
        run: bash infra/ops/migrate-dev.test.sh

      - name: Portão do Codex (review travado ou de commit anterior avisa; P1 barra; gh falso)
        run: bash infra/ops/codex-gate.test.sh

      # A troca da API, dos webhooks e da demo no deploy: Traefik de verdade, tráfego durante a troca e uma versão que nunca fica
      # healthy
      - name: Troca sem página de manutenção (rolling-swap.sh com o Traefik)
        run: bash infra/vps-telemetry/rolling-swap.test.sh

      # O roteiro inteiro contra uma VPS de faz de conta (ssh falso, registry local): só o que mudou troca, volta por
      # serviço, volta da stack inteira e SHA anterior às tags por serviço
      - name: Deploy só do que mudou (deploy-gh.sh com o Docker)
        run: bash infra/vps-telemetry/deploy-gh.test.sh

      - name: Poda das imagens antigas na VPS (prune-images.sh com o Docker)
        run: bash infra/vps-telemetry/prune-images.test.sh

      - name: Cópia dos assets do S3 e recibo no verificador (s3-sync.sh com aws falso)
        run: bash infra/backup/s3-sync.test.sh

      - name: Migração de tasks/ para o bucket privado (mover-tasks-para-bucket-privado.sh com docker, aws e psql falsos)
        run: bash infra/ops/mover-tasks-para-bucket-privado.test.sh

      - name: Cópia do NAS com assets do S3 (nas-pull.sh com rsync e ssh falsos)
        run: bash infra/nas-backup/nas-pull.test.sh

      - name: Espelho produção → dev (mirror-prod-to-dev.sh com psql, pg_restore, age e aws falsos)
        run: bash infra/ops/mirror-prod-to-dev.test.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Notas de versão (numeração, agrupamento e CLI com gh falso)
        run: node --test infra/vps-telemetry/release-notes.test.mjs

      - name: Smoke do deploy (retry de 5xx e de tempo esgotado; agenda dependente da home)
        run: node --test infra/vps-telemetry/smoke.test.mjs

      - name: Entrada das imagens (quais mudam com cada caminho; lista ⇄ Dockerfiles)
        run: node --test infra/ops/image-inputs.test.mjs

      - name: Hash da entrada (a fórmula que o docker.yml e o deploy dividem)
        run: bash infra/ops/image-hash.test.sh

      # Alerta ProducaoAtrasada (#530): a decisão com fatos de faz de conta e o "desde quando" num repositório de verdade
      - name: Produção atrasada (decisão do alerta; hash por commit)
        run: node --test infra/ops/producao-atrasada.test.mjs

      - name: Página de manutenção (rótulo de revisão bate com o conteúdo das configs)
        run: |
          docker compose -f infra/vps-telemetry/compose.yml --env-file infra/vps-telemetry/env.example config --format json \
            | node infra/vps-telemetry/maintenance-rev.mjs

      - name: Página de manutenção (Caddyfile)
        run: |
          docker compose -f infra/vps-telemetry/compose.yml --env-file infra/vps-telemetry/env.example config --format json \
            | jq -r '.configs["maintenance-caddyfile"].content' > "$RUNNER_TEMP/Caddyfile.maintenance"
          docker run --rm -v "$RUNNER_TEMP/Caddyfile.maintenance:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backup-restore:
    name: backup e restore ponta a ponta (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Servidor e cliente do backup na mesma versão: 17 é produção, 18 é o alvo do upgrade (issue #201).
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: galaxie
          POSTGRES_PASSWORD: galaxie
          POSTGRES_DB: galaxie_sports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galaxie -d galaxie_sports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DB: galaxie_backup_e2e
      BACKUP_IMAGE: galaxie-sports-backup:ci
      DOCKER_NETWORK: host
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: galaxie
      PGPASSWORD: galaxie
      # Papel do backup (packages/db/src/roles.ts), como na stack: o migrate dá LOGIN com esta senha e o backup, o
      # verificador e os ensaios rodam com ele (sem superusuário). A restauração real continua com o dono.
      BACKUP_ROLE_URL: postgres://galaxie_backup:ci0papel0do0backup0so0de0teste@localhost:5432/galaxie_backup_e2e
      MIGRATE_CMD: DATABASE_URL=postgres://galaxie:galaxie@localhost:5432/galaxie_backup_e2e DB_URL_BACKUP=$BACKUP_ROLE_URL pnpm --filter @galaxie/db db:migrate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter "@galaxie/db..." run build

      - name: Imagem de backup
        run: docker build --build-arg "POSTGRES_IMAGE=postgres:${{ matrix.postgres }}-alpine" -t "$BACKUP_IMAGE" infra/backup

      - name: Banco descartável migrado
        run: |
          psql -d galaxie_sports -c "create database $E2E_DB"
          sh -c "$MIGRATE_CMD"

      - name: backup → perda → ensaio → restore
        run: bash infra/backup/e2e-test.sh
