# Atualizações automáticas de dependências (docs/11 §4, SECURITY.md).
# Atualizações de segurança chegam assim que publicadas; as de versão, semanalmente e agrupadas
# para não inundar a fila de PRs. Majors de runtime/infra ficam para revisão manual.
version: 2
updates:
  # Workspace pnpm inteiro (o ecossistema npm entende pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # Os tipos acompanham o Node do runtime (.nvmrc, engines e imagens): o major sobe junto com o Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # O cliente do services/ai-agents fala o protocolo do servidor do lineup-render: a versão sobe à mão, nos cinco
      # lugares que infra/lineup-render/versions.mjs confere (Dockerfile, package.json e lock da pasta, ai-agents, compose).
      - dependency-name: 'playwright-core'
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']

  # Imagens base dos Dockerfiles (API, demo, ingestor, backup, Caddy, Prometheus, Grafana). O lineup-render fica fora:
  # a imagem do Playwright sobe junto com o playwright-core, à mão (infra/lineup-render/versions.mjs).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/demo
      - /services/ingestor
      - /infra/backup
      - /infra/caddy
      - /infra/observability/prometheus
      - /infra/observability/grafana
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    labels: [dependencies, infra]
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      # O cliente do backup acompanha o servidor; major do Postgres só com o plano de dump/restore (issue #201).
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        patterns: ['*']
        update-types: [minor, patch]

  # Imagens dos compose: infra local, stack de produção (VPS) e o Traefik da VPS. As de produção
  # (postgres, valkey, rustfs, aws-cli, caddy da manutenção, node-exporter) e o Traefik só mudam na VPS pelo deploy;
  # o Traefik, à mão (infra/traefik/README.md).
  - package-ecosystem: docker-compose
    directories:
      - /infra
      - /infra/vps-telemetry
      - /infra/traefik
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    labels: [dependencies, infra]
    commit-message:
      prefix: 'chore(docker)'
    ignore:
      # Major de banco e de cache exige dump/restore planejado em dev, staging e produção (issue #201).
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
      - dependency-name: 'valkey/valkey'
        update-types: ['version-update:semver-major']
      # A borda de todas as stacks da VPS: major só com leitura das notas de migração e janela combinada.
      - dependency-name: 'traefik'
        update-types: ['version-update:semver-major']
    groups:
      compose-images:
        patterns: ['*']
        update-types: [minor, patch]
