# Configuração do gitleaks (varredura de segredos no CI — .github/workflows/ci.yml, job "segredos").
# Usa as regras padrão e só libera falsos positivos conhecidos. Antes de adicionar uma exceção,
# confirme que o valor não é um segredo real; se for, revogue-o primeiro (SECURITY.md §Segredos).
title = "galaxie-sports"

[extend]
useDefault = true

[[allowlists]]
description = "Chaves de template de copy em testes (identificadores, não segredos)"
regexTarget = "line"
regexes = ['''copyTemplate\.key''']

[[allowlists]]
description = "Senha fictícia da stack de teste local no README do Portainer (sequência hex 0-f)"
regexTarget = "match"
regexes = ['''=0123456789abcdef$''']

[[allowlists]]
description = "Chaves do acervo de fotos da Commons (car/lotus/1985, driver/ayrton-senna): slugs, não segredos"
# Só a linha inteira "key: <slug>/<slug>". Sem `paths` de propósito: no gitleaks 8.28 um `paths` pula o arquivo
# todo (mesmo com condition = "AND"), e um segredo real no acervo passaria despercebido.
regexTarget = "line"
regexes = ['''^\s*-?\s*key:\s*[a-z][a-z0-9-]*(/[a-z0-9-]+)+\s*$''']

[[allowlists]]
description = "Chaves de itens da base semântica (pt-BR.cheer-3-derby, es-AR.alentar): locale + slug, não segredos"
# Só a linha inteira "key: '<locale>.<slug>'," (testes e fixtures da revisão semântica).
regexTarget = "line"
regexes = ['''^\s*key:\s*'[a-z]{2}(-[A-Z]{2})?\.[a-z0-9][a-z0-9-]*',?\s*$''']
